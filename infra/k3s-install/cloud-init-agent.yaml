#cloud-config
# Base cloud-init for k3s worker VMs. Shares the same kernel tuning as the server.
hostname_changed: true
package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - jq
  - open-iscsi
  - nfs-common
  - ethtool
  - conntrack
  - apparmor
  - apparmor-utils

write_files:
  - path: /etc/sysctl.d/90-k3s.conf
    permissions: "0644"
    content: |
      fs.inotify.max_user_instances = 8192
      fs.inotify.max_user_watches = 524288
      net.core.somaxconn = 4096
      net.ipv4.ip_local_port_range = 1024 65535
      net.ipv4.tcp_tw_reuse = 1
      vm.max_map_count = 262144
      vm.swappiness = 10

  - path: /etc/security/limits.d/90-stream2pretrain.conf
    permissions: "0644"
    content: |
      *  soft  nofile  1048576
      *  hard  nofile  1048576

runcmd:
  - [ sysctl, --system ]
  - [ systemctl, enable, --now, iscsid ]
  - [ swapoff, -a ]
  - [ sed, -i, "/swap/d", /etc/fstab ]
