---
- name: Deploy Stream2Pretrain k3s cluster
  hosts: stream2pretrain
  become: true
  gather_facts: true

  vars:
    # Keep this role focused on the Kubernetes base layer. Helmfile owns the
    # pinned Traefik, cert-manager, ExternalDNS, and application releases. DNS
    # credentials are supplied to configure-edge.yaml as the lecture's second
    # inventory, so there is one owner per in-cluster resource.
    ip_family: dual
    ip_family_primary: ipv6
    k3s_extra_exec_args: "--disable=traefik"
    cert_manager_email: ""
    rfc2136_zone: ""
    longhorn_enabled: false
    k3s_auto_upgrade_enabled: false
    kubeconfig_path: "../kubeconfig-stream2pretrain.yaml"

  roles:
    - role: k3s-dhbw-cloud-role

  post_tasks:
    - name: Wait until every cluster node is Ready
      when: k3s_role == 'server'
      ansible.builtin.shell: |
        set -o pipefail
        expected="{{ ansible_play_hosts_all | length }}"
        /usr/local/bin/kubectl get nodes --no-headers \
          | awk -v expected="$expected" '$2 == "Ready" { ready++ } END { exit (ready == expected) ? 0 : 1 }'
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_root }}"
      register: stream2pretrain_nodes_ready
      until: stream2pretrain_nodes_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false
      tags:
        - skip_ansible_lint

    - name: Show cluster nodes
      when: k3s_role == 'server'
      ansible.builtin.command: /usr/local/bin/kubectl get nodes -o wide
      environment:
        KUBECONFIG: "{{ kubeconfig_root }}"
      register: stream2pretrain_node_table
      changed_when: false

    - name: Apply the CoreDNS disruption budget
      when: k3s_role == 'server'
      ansible.builtin.command:
        cmd: /usr/local/bin/kubectl apply -f /dev/stdin
        stdin: "{{ lookup('file', '../kubernetes/coredns-pdb.yaml') }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_root }}"
      register: stream2pretrain_coredns_pdb
      changed_when: >-
        'configured' in stream2pretrain_coredns_pdb.stdout or
        'created' in stream2pretrain_coredns_pdb.stdout

    - name: Keep two CoreDNS replicas on separate nodes
      when: k3s_role == 'server'
      ansible.builtin.command:
        cmd: >-
          /usr/local/bin/kubectl -n kube-system patch deployment/coredns
          --type=strategic --patch-file=/dev/stdin
        stdin: "{{ lookup('file', '../kubernetes/coredns-ha-patch.yaml') }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_root }}"
      register: stream2pretrain_coredns_patch
      changed_when: "'no change' not in stream2pretrain_coredns_patch.stdout"

    - name: Wait for both CoreDNS replicas
      when: k3s_role == 'server'
      ansible.builtin.command:
        cmd: >-
          /usr/local/bin/kubectl -n kube-system rollout status
          deployment/coredns --timeout=180s
      environment:
        KUBECONFIG: "{{ kubeconfig_root }}"
      changed_when: false

    - name: Print cluster node table
      when: k3s_role == 'server'
      ansible.builtin.debug:
        var: stream2pretrain_node_table.stdout_lines

  handlers:
    - name: Restart k3s
      become: true
      ansible.builtin.systemd:
        name: "{{ 'k3s' if k3s_role == 'server' else 'k3s-agent' }}"
        state: restarted
