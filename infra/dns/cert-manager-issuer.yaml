---
# cert-manager ClusterIssuer for the Stream2Pretrain wildcard certificate.
#
# Uses ACME DNS-01 challenge via the rfc2136 webhook (per Exercise Track 1).
# A wildcard cert (*.stream2pretrain.example.org) cannot be issued via HTTP-01,
# only DNS-01.
#
# REQUIRED USER ACTION before applying:
#   1. Replace stream2pretrain.example.org with your team's actual DNS zone.
#   2. Replace ns1.example.org with the authoritative DNS server that accepts
#      RFC 2136 dynamic updates.
#   3. Generate a TSIG key (HMAC-SHA256):
#        tsig-keygen -a hmac-sha256 cert-manager > tsig.key
#      and store the secret value in the rfc2136-tsig Secret below
#      (base64-encoded; kubectl create secret generic does this for you).
#   4. Replace ops@example.org with a real address that receives ACME notices.
#
# The webhook rfc2136 provider is built into cert-manager 1.13+; no extra
# helm release is needed.

apiVersion: v1
kind: Secret
metadata:
  name: rfc2136-tsig
  namespace: cert-manager
type: Opaque
stringData:
  # >>> REPLACE <<<: paste the raw secret half of `tsig-keygen` output here.
  tsig-secret-key: "REPLACE_WITH_BASE64_TSIG_SECRET"
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ops@example.org # >>> REPLACE <<<
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - dns01:
          rfc2136:
            nameserver: "ns1.example.org:53" # >>> REPLACE <<<
            tsigKeyName: "cert-manager."
            tsigAlgorithm: HMACSHA256
            tsigSecretSecretRef:
              name: rfc2136-tsig
              key: tsig-secret-key
        selector:
          dnsZones:
            - "stream2pretrain.example.org" # >>> REPLACE <<<
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@example.org # >>> REPLACE <<<
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - dns01:
          rfc2136:
            nameserver: "ns1.example.org:53" # >>> REPLACE <<<
            tsigKeyName: "cert-manager."
            tsigAlgorithm: HMACSHA256
            tsigSecretSecretRef:
              name: rfc2136-tsig
              key: tsig-secret-key
        selector:
          dnsZones:
            - "stream2pretrain.example.org" # >>> REPLACE <<<
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: stream2pretrain-wildcard
  namespace: traefik
spec:
  secretName: stream2pretrain-wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.stream2pretrain.example.org" # >>> REPLACE <<<
  dnsNames:
    - "stream2pretrain.example.org"            # >>> REPLACE <<<
    - "*.stream2pretrain.example.org"          # >>> REPLACE <<<
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  duration: 2160h    # 90d (LE max)
  renewBefore: 360h  # 15d
