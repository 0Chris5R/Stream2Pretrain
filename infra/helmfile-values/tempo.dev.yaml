---
# Tempo single-binary in dev. Receives OTLP gRPC from FastAPI, ingest, processor.
tempo:
  reportingEnabled: false
  retention: 24h
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://kps-prometheus.monitoring.svc:9090/api/v1/write
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    jaeger:
      protocols:
        thrift_http:
          endpoint: 0.0.0.0:14268
service:
  type: ClusterIP
persistence:
  enabled: true
  storageClassName: local-path
  size: 5Gi
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi
serviceMonitor:
  enabled: true
  namespace: monitoring
