---
# DHBW demo override. Every key in this file is validated by the application
# chart's values.schema.json. Keep this file small and measured-cluster-specific.

profile: dev

image:
  registry: docker.io
  tag: "0.2.0-2e1d99b"
  # Images currently exist only in the control-plane containerd store. Never
  # hide an incomplete image distribution step behind a remote pull attempt.
  pullPolicy: Never

redpanda:
  bootstrapServers: redpanda.redpanda.svc.cluster.local:9093
  schemaRegistry: http://redpanda.redpanda.svc.cluster.local:8081
  # First Bytewax v2 recovery imports the last broker-owned native offset.
  # Later restarts use the recovery PVC and ignore this bootstrap value.
  startingOffset: stored

minio:
  endpoint: http://minio.minio.svc.cluster.local:9000
  credentialsSecret: stream2pretrain-minio
  buckets:
    bronze: s2p-bronze
    silver: s2p-silver
    gold: s2p-gold
    posttrain: s2p-posttrain

iceberg:
  catalog: stream2pretrain
  namespace: gold
  goldTable: curated
  polarisUrl: http://polaris.polaris.svc.cluster.local:8181/api/catalog
  warehouse: stream2pretrain
  accessDelegation: none
  credentialSecret: stream2pretrain-polaris

# The existing cluster has no Tempo, Loki, or Alloy release. Empty endpoints
# disable exporters instead of creating unbounded retry logs.
observability:
  tracing:
    otlpEndpoint: ""
    sampleRatio: 0.0
  logs:
    lokiEndpoint: ""

keda:
  enabled: true

processor:
  fetcher:
    replicas: 1
    tag: "0.2.0-1f4cf19"
    requireRealModels: true
    doclingEnabled: true
    # Full CPU PDF extraction has an explicit memory ceiling.
    pdfProcessingEnabled: true
    resources:
      requests: {cpu: 200m, memory: 2Gi}
      limits: {cpu: 2, memory: 8Gi}
  curate:
    replicas: 1
    tag: "0.2.0-619290f"
    requireRealModels: true
    doclingEnabled: false
    usePresidio: true
    resources:
      # Reserve state/cache headroom independently of inference services.
      requests: {cpu: 500m, memory: 2Gi}
      limits: {cpu: 2, memory: 6Gi}
    modelBundle:
      bootstrap: false
  modelService:
    enabled: true
    replicas: 1
    profiles:
      quality:
        autoscaling:
          minReplicas: 2
          # Ceiling fits the current three-node reservation budget.
          maxReplicas: 4
    autoscaling:
      enabled: true
      minReplicas: 1
      # Profile-specific ceilings override this fallback. The curator remains
      # a single checkpoint owner, leasing one request per ready model Pod.
      maxReplicas: 3
  iceberg:
    replicas: 1
    # Recovery holds Arrow buffers and both Iceberg frontiers in memory.
    resources:
      requests: {cpu: 200m, memory: 1Gi}
      limits: {cpu: 2, memory: 4Gi}
  duckdbApi:
    replicas: 1
    # The retained index bootstraps the complete Iceberg history once, then
    # serves and updates that persistent baseline incrementally from Kafka.
    memoryLimit: 4GB
    resources:
      requests: {cpu: 100m, memory: 2Gi}
      limits: {cpu: 1, memory: 6Gi}
  # Single-writer foundry on the measured control-plane image cache.
  foundry:
    enabled: true

mixtureController:
  enabled: true
  replicas: 1

ui:
  replicas: 1
  ingress:
    enabled: true
    host: stream2pretrain-app.s241221-at-student-dhbw-mannheim-de.users.dhbw.site
    ingressClassName: traefik
    tlsSecret: ""

# DNS-based egress policies are not implementable by standard Kubernetes
# NetworkPolicy. Keep policies disabled until concrete cluster CIDRs are
# measured and a CNI-aware policy is designed.
networkPolicy:
  enabled: false

gatekeeper:
  # ConstraintTemplate CRDs are established asynchronously. Install the
  # application constraint in a separate phase after the baseline works.
  enabled: false

# CI publishes every source image to GHCR before Helm deploys this override.
# Aggregate SourceFeed templates remain suspended where the controller owns the
# schedules; independent source workers stay enabled and keep durable cursors.
sources:
  arxiv:
    # The SourceFeed controller owns the per-feed RSS and OAI-PMH schedules.
    # Keep the Helm CronJobs rendered but suspended as clone templates.
    enabled: false
    htmlFetcher:
      enabled: true
ingest:
  # One arXiv OAI page per two-hour poll is a measured-course-cluster
  # backpressure boundary; the durable token resumes the same window later.
  oaipmh:
    maxPagesPerRun: 1
  arxivHtmlFetcher:
    tag: "0.2.0-619290f"
    maxRecordsPerLoop: 0
  hf:
    replicas: 1
