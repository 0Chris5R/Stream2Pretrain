---
# DHBW demo override. Every key in this file is validated by the application
# chart's values.schema.json. Keep this file small and measured-cluster-specific.

profile: dev

image:
  registry: docker.io
  tag: "0.2.0"
  # Images currently exist only in the control-plane containerd store. Never
  # hide an incomplete image distribution step behind a remote pull attempt.
  pullPolicy: Never

# Temporary scheduling constraint matching measured image availability. Remove
# this only after the image-sync or registry step has verified the same digests
# on every worker.
nodeSelector:
  kubernetes.io/hostname: stream2pretrain-master

redpanda:
  bootstrapServers: redpanda.redpanda.svc.cluster.local:9093
  schemaRegistry: http://redpanda.redpanda.svc.cluster.local:8081
  # Smoke mode skips the uncommitted historical backlog. Switch to beginning
  # only after one controlled document completes the full pipeline.
  startingOffset: end

minio:
  endpoint: http://minio.minio.svc.cluster.local:9000
  credentialsSecret: stream2pretrain-minio
  buckets:
    bronze: s2p-bronze
    silver: s2p-silver
    gold: s2p-gold
    decon: s2p-decon

iceberg:
  catalog: stream2pretrain
  namespace: gold
  goldTable: curated
  polarisUrl: http://polaris.polaris.svc.cluster.local:8181/api/catalog
  warehouse: stream2pretrain
  credentialSecret: stream2pretrain-polaris

# The existing cluster has no Tempo, Loki, or Alloy release. Empty endpoints
# disable exporters instead of creating unbounded retry logs.
observability:
  tracing:
    otlpEndpoint: ""
    sampleRatio: 0.0
  logs:
    lokiEndpoint: ""

# Establish a single working replica before measuring or enabling autoscaling.
keda:
  enabled: false

processor:
  fetcher:
    replicas: 1
  curate:
    replicas: 1
  iceberg:
    replicas: 1
  duckdbApi:
    replicas: 1
  deconGate:
    replicas: 1

mixtureController:
  replicas: 1

ui:
  replicas: 1
  ingress:
    enabled: false

# DNS-based egress policies are not implementable by standard Kubernetes
# NetworkPolicy. Keep policies disabled until concrete cluster CIDRs are
# measured and a CNI-aware policy is designed.
networkPolicy:
  enabled: false

gatekeeper:
  # ConstraintTemplate CRDs are established asynchronously. Install the
  # application constraint in a separate phase after the baseline works.
  enabled: false

# These images are not present in the current node image set. Enable each only
# after its image is distributed and its smoke test passes.
sources:
  arxiv:
    htmlFetcher:
      enabled: false

ingest:
  githubTarballFetcher:
    enabled: false

openreviewPoller:
  enabled: false
