---
# MinIO tenant: single-pool, 4 servers x 1 drive of 20Gi each (smallest erasure-set
# the operator allows). Lecture-default object store; serves bronze/silver/gold
# Iceberg buckets, Loki chunks, and Tempo blocks.
secrets:
  name: stream2pretrain-minio-secret
  accessKey: stream2pretrain
  # >>> REPLACE in any non-dev environment <<<
  secretKey: stream2pretrain-dev-key
tenant:
  name: stream2pretrain
  configuration:
    name: stream2pretrain-env-configuration
  pools:
    - name: pool-0
      servers: 4
      volumesPerServer: 1
      size: 20Gi
      storageClassName: local-path
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          cpu: 1000m
          memory: 2Gi
  metrics:
    enabled: true
    port: 9000
    protocol: http
  prometheusOperator: true
  serviceMetadata:
    minioServiceLabels:
      app.kubernetes.io/name: minio
  certificate:
    requestAutoCert: false
  buckets:
    - name: bronze
    - name: silver
    - name: gold
    - name: decon-attestations
    - name: loki-chunks
    - name: loki-ruler
    - name: loki-admin
    - name: tempo
    - name: polaris-warehouse
ingress:
  api:
    enabled: false
  console:
    enabled: false
