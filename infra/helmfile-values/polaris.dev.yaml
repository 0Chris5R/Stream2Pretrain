---
replicaCount: 1

image:
  repository: apache/polaris
  tag: "1.7.0"
  pullPolicy: IfNotPresent

persistence:
  # Demo-only. A relational JDBC backend and its storage requirements remain
  # needs-measurement before production deployment.
  type: in-memory

realmContext:
  type: default
  realms: [POLARIS]
  requireHeader: false

extraEnv:
  - name: QUARKUS_HTTP_HOST
    value: "::"
  - name: QUARKUS_MANAGEMENT_HOST
    value: "::"
  - name: POLARIS_BOOTSTRAP_CREDENTIALS
    valueFrom:
      secretKeyRef:
        name: polaris-bootstrap
        key: credentials

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
