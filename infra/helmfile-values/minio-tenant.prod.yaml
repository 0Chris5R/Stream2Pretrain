---
secrets:
  name: stream2pretrain-minio-secret
  # In prod, set these via an externalSecret / sealed-secret instead of values.
  accessKey: stream2pretrain
  secretKey: REPLACE_WITH_PROD_SECRET
tenant:
  name: stream2pretrain
  configuration:
    name: stream2pretrain-env-configuration
  pools:
    - name: pool-0
      servers: 4
      volumesPerServer: 2
      size: 100Gi
      storageClassName: local-path
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: 2000m
          memory: 4Gi
  metrics:
    enabled: true
    port: 9000
    protocol: http
  prometheusOperator: true
  serviceMetadata:
    minioServiceLabels:
      app.kubernetes.io/name: minio
  certificate:
    requestAutoCert: false
  buckets:
    - name: bronze
    - name: silver
    - name: gold
    - name: decon-attestations
    - name: loki-chunks
    - name: loki-ruler
    - name: loki-admin
    - name: tempo
    - name: polaris-warehouse
ingress:
  api:
    enabled: false
  console:
    enabled: false
