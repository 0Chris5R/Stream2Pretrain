---
# Single-binary monolithic Loki for the dev cluster (lecture default scale).
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
      admin: loki-admin
    s3:
      # MinIO tenant in-cluster endpoint; matches infra/helmfile-values/minio-tenant.*.yaml.
      endpoint: http://minio.minio.svc:80
      accessKeyId: ${LOKI_S3_ACCESS_KEY:-loki}
      secretAccessKey: ${LOKI_S3_SECRET_KEY:-lokisecret}
      s3ForcePathStyle: true
      insecure: true
      region: us-east-1
  limits_config:
    retention_period: 168h        # 7 days
    max_global_streams_per_user: 5000
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  persistence:
    enabled: true
    size: 10Gi
    storageClass: local-path
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false
gateway:
  enabled: false
test:
  enabled: false
monitoring:
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: false
  serviceMonitor:
    enabled: true
    namespace: monitoring
