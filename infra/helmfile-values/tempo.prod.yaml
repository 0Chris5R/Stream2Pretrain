---
tempo:
  reportingEnabled: false
  retention: 168h    # 7 days
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://kps-prometheus.monitoring.svc:9090/api/v1/write
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    jaeger:
      protocols:
        thrift_http:
          endpoint: 0.0.0.0:14268
service:
  type: ClusterIP
persistence:
  enabled: true
  storageClassName: local-path
  size: 50Gi
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi
serviceMonitor:
  enabled: true
  namespace: monitoring
