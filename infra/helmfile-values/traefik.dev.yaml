---
# Traefik dev values. k3s ServiceLB publishes 80/443 on the measured public
# node IPv6 addresses and forwards them to two Traefik replicas.
deployment:
  kind: Deployment
  replicas: 2
ports:
  web:
    redirectTo:
      port: websecure
  websecure:
    tls:
      enabled: true
service:
  type: LoadBalancer
ingressClass:
  enabled: true
  isDefaultClass: true
providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true
metrics:
  prometheus:
    service:
      enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
logs:
  general:
    level: INFO
  access:
    enabled: true
    format: json
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
