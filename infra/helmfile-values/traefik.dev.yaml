---
# Traefik dev values. Runs as a DaemonSet on workers so any node accepts 80/443.
deployment:
  kind: DaemonSet
ports:
  web:
    redirectTo:
      port: websecure
  websecure:
    tls:
      enabled: true
service:
  type: ClusterIP
ingressClass:
  enabled: true
  isDefaultClass: true
providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true
metrics:
  prometheus:
    service:
      enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
logs:
  general:
    level: INFO
  access:
    enabled: true
    format: json
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
