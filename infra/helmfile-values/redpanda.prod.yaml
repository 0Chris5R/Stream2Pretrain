---
# Same 1-broker dev mode in prod for the demo cluster (4 VMs would be required
# for 3-broker quorum; outside scope per CLAUDE.md 2026-06-15 risks log).
statefulset:
  replicas: 1
  podAntiAffinity:
    type: soft
console:
  enabled: true
  ingress:
    enabled: false
  service:
    type: ClusterIP
external:
  enabled: false
auth:
  sasl:
    enabled: false
tls:
  enabled: false
listeners:
  kafka:
    port: 9093
  admin:
    port: 9644
  http:
    enabled: true
    port: 8082
  schemaRegistry:
    enabled: true
    port: 8081
  rpc:
    port: 33145
config:
  cluster:
    auto_create_topics_enabled: false
    default_topic_replications: 1
    log_retention_ms: 1209600000    # 14 days
    log_segment_size: 134217728     # 128 MiB
storage:
  persistentVolume:
    enabled: true
    storageClass: local-path
    size: 200Gi
resources:
  cpu:
    cores: 2
  memory:
    container:
      max: 4Gi
serviceMonitor:
  enabled: true
  namespace: monitoring
post_install_job:
  enabled: false
post_upgrade_job:
  enabled: false
