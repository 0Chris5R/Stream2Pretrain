---
# Values currently proven by the running DHBW cluster. They are a deployment
# baseline, not a capacity recommendation.
fullnameOverride: kps
crds:
  enabled: true
defaultRules:
  create: true
alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    retention: 24h
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
grafana:
  enabled: true
  # Let the Grafana subchart own a randomly generated Kubernetes Secret.
  # An empty value selects the chart's generator instead of the insecure
  # kube-prometheus-stack default password. Retrieve it with the documented
  # command when an operator needs to log in.
  adminPassword: ""
  # The single Grafana replica owns one consistent Secret configuration.
  deploymentStrategy:
    type: Recreate
  defaultDashboardsTimezone: utc
  serviceMonitor:
    enabled: true
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
    datasources:
      enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
prometheus:
  prometheusSpec:
    retention: 24h
    retentionSize: 5GiB
    walCompression: true
    serviceMonitorSelectorNilUsesHelmValues: false
    # Redpanda owns its ServiceMonitor in the redpanda namespace. An explicit
    # empty selector lets this Prometheus instance discover ServiceMonitors in
    # every namespace rather than only monitoring.
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeInterval: 30s
    evaluationInterval: 30s
    enableAdminAPI: true
    # Prometheus 2.54 does not enable container-aware GOMEMLIMIT by default.
    # Reserve 25% of the 2 GiB cgroup for mmap/WAL and runtime overhead so a
    # WAL replay cannot repeatedly cross the Kubernetes memory limit.
    enableFeatures:
      - auto-gomemlimit
    additionalArgs:
      - name: auto-gomemlimit.ratio
        value: "0.75"
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true
