---
replicaCount: 2
image:
  repository: apache/polaris
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8181
catalog:
  warehouse: s3://polaris-warehouse/
  s3:
    endpoint: http://minio.minio.svc:80
    region: us-east-1
    pathStyleAccess: true
    credentialsSecret: stream2pretrain-minio-secret
auth:
  enabled: true
  # >>> REPLACE <<<: in prod, supply OAuth2/OIDC config via secret.
  oidcSecret: polaris-oidc
persistence:
  enabled: true
  storageClass: local-path
  size: 20Gi
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi
serviceMonitor:
  enabled: true
  namespace: monitoring
