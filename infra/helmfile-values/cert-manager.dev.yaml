---
# cert-manager dev values: keep webhook + cainjector tiny, install CRDs.
installCRDs: true
global:
  leaderElection:
    namespace: cert-manager
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
webhook:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
cainjector:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 256Mi
prometheus:
  enabled: true
  servicemonitor:
    enabled: true
    namespace: monitoring
