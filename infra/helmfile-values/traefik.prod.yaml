---
deployment:
  kind: DaemonSet
ports:
  web:
    redirectTo:
      port: websecure
  websecure:
    tls:
      enabled: true
service:
  type: ClusterIP
ingressClass:
  enabled: true
  isDefaultClass: true
providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true
metrics:
  prometheus:
    service:
      enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
logs:
  general:
    level: INFO
  access:
    enabled: true
    format: json
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi
tlsStore:
  default:
    defaultCertificate:
      secretName: stream2pretrain-wildcard-tls
