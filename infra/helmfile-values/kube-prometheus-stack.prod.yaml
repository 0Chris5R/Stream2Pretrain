---
fullnameOverride: kps
crds:
  enabled: true
defaultRules:
  create: true
alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 2
    retention: 7d
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
grafana:
  enabled: true
  # Provide adminPassword via a secret in prod; placeholder for now.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  serviceMonitor:
    enabled: true
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
    datasources:
      enabled: true
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
prometheus:
  prometheusSpec:
    retention: 14d
    retentionSize: 40GiB
    walCompression: true
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeInterval: 30s
    evaluationInterval: 30s
    enableFeatures:
      - exemplar-storage
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true
