---
# Three brokers match the three-node DHBW topology. Whether the existing nodes
# have enough free CPU, RAM and local disk for the replicated retained backlog
# must be measured before this profile is deployed.
statefulset:
  replicas: 3
  podAntiAffinity:
    type: hard
console:
  enabled: false
  ingress:
    enabled: false
  service:
    type: ClusterIP
external:
  enabled: false
auth:
  sasl:
    enabled: false
tls:
  enabled: false
listeners:
  kafka:
    port: 9093
    tls:
      enabled: false
  admin:
    port: 9644
    tls:
      enabled: false
  http:
    enabled: true
    port: 8082
    tls:
      enabled: false
  schemaRegistry:
    enabled: true
    port: 8081
    tls:
      enabled: false
  rpc:
    port: 33145
    tls:
      enabled: false
config:
  cluster:
    auto_create_topics_enabled: false
    default_topic_replications: 3
    log_retention_ms: 604800000     # 7 days
    log_segment_size: 67108864      # 64 MiB
storage:
  persistentVolume:
    enabled: true
    storageClass: local-path
    size: 50Gi
resources:
  cpu:
    cores: 1
  memory:
    container:
      max: 2Gi
# Redpanda chart 25.3.10 creates its ServiceMonitor from `monitoring`. Keep the
# release label aligned with the kube-prometheus-stack selector convention.
monitoring:
  enabled: true
  scrapeInterval: 30s
  labels:
    release: kube-prometheus-stack
post_install_job:
  enabled: false
