[project]
name = "stream2pretrain-tests"
version = "0.1.0"
description = "Cross-component integration tests for Stream2Pretrain."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "stream2pretrain",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "confluent-kafka>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
