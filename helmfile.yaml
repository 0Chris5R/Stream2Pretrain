---
# One release graph for the DHBW cluster. Selectors let the deployment script
# validate and apply one ownership tier at a time.

repositories:
  - name: jetstack
    url: https://charts.jetstack.io
  - name: traefik
    url: https://traefik.github.io/charts
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: kedacore
    url: https://kedacore.github.io/charts
  - name: gatekeeper
    url: https://open-policy-agent.github.io/gatekeeper/charts
  - name: redpanda
    url: https://charts.redpanda.com
  - name: apache-polaris
    url: https://downloads.apache.org/polaris/helm-chart/
  - name: external-dns
    url: https://kubernetes-sigs.github.io/external-dns/

environments:
  dev: {}

---
helmDefaults:
  wait: true
  waitForJobs: true
  timeout: 600
  atomic: false
  createNamespace: true
  historyMax: 5

releases:
  - name: cert-manager
    namespace: cert-manager
    chart: jetstack/cert-manager
    version: v1.15.3
    labels: {tier: edge, component: certificates}
    values:
      - infra/helmfile-values/cert-manager.{{ .Environment.Name }}.yaml

  - name: traefik
    namespace: traefik
    chart: traefik/traefik
    version: 30.1.0
    labels: {tier: edge, component: edge}
    needs: [cert-manager/cert-manager]
    values:
      - infra/helmfile-values/traefik.{{ .Environment.Name }}.yaml

  - name: external-dns
    namespace: external-dns
    chart: external-dns/external-dns
    version: 1.19.0
    labels: {tier: edge, component: edge}
    values:
      - infra/helmfile-values/external-dns.{{ .Environment.Name }}.yaml

  - name: kube-prometheus-stack
    namespace: monitoring
    chart: prometheus-community/kube-prometheus-stack
    version: 65.1.0
    labels: {tier: platform}
    values:
      - infra/helmfile-values/kube-prometheus-stack.{{ .Environment.Name }}.yaml

  - name: keda
    namespace: keda
    chart: kedacore/keda
    version: 2.15.1
    labels: {tier: platform}
    values:
      - infra/helmfile-values/keda.{{ .Environment.Name }}.yaml

  - name: gatekeeper
    namespace: gatekeeper-system
    chart: gatekeeper/gatekeeper
    version: 3.17.2
    labels: {tier: platform}
    values:
      - infra/helmfile-values/gatekeeper.{{ .Environment.Name }}.yaml

  - name: redpanda
    namespace: redpanda
    chart: redpanda/redpanda
    version: 5.9.5
    labels: {tier: platform}
    values:
      - infra/helmfile-values/redpanda.{{ .Environment.Name }}.yaml

  # Official Apache Polaris chart. The DHBW dev profile is explicitly
  # in-memory; relational persistence remains a measured production blocker.
  - name: polaris
    namespace: polaris
    chart: apache-polaris/polaris
    version: 1.7.0
    labels: {tier: catalog}
    values:
      - infra/helmfile-values/polaris.{{ .Environment.Name }}.yaml

  - name: stream2pretrain
    namespace: stream2pretrain
    chart: ./charts/stream2pretrain
    # Application readiness is verified per changed workload by the deployment
    # workflow. A release-wide Helm wait reloads unchanged model services and
    # blocks on unrelated historical failures.
    wait: false
    waitForJobs: false
    labels: {tier: application}
    needs:
      - monitoring/kube-prometheus-stack
      - keda/keda
      - gatekeeper-system/gatekeeper
      - redpanda/redpanda
      - polaris/polaris
    values:
      - charts/stream2pretrain/values-{{ .Environment.Name }}.yaml
      - infra/helmfile-values/stream2pretrain.{{ .Environment.Name }}.yaml
