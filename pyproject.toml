[project]
name = "stream2pretrain"
version = "0.1.0"
description = "Streaming-first LLM pretraining data curator on Kubernetes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Stream2Pretrain Contributors" }]

# Shared runtime dependencies. Components import these directly; component-specific
# extras live in the workspace member's own pyproject.toml when needed.
#
# Note on Kafka client choice:
#   - ingest/* uses aiokafka (async producer for asyncio pollers and fetchers).
#   - processor uses confluent-kafka (Bytewax's bytewax-kafka connector wraps it).
# Both are listed here so the schemas package and shared utilities can be exercised
# from either side without re-resolving the lock.
dependencies = [
    "pydantic>=2.7,<3",
    "structlog>=24.1",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "httpx>=0.27",
    "openai==3.6.0",
    "orjson>=3.10",
    "aiokafka>=0.11",
    "confluent-kafka>=2.5",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    # Iceberg writer unit doubles materialize Arrow tables. Production gets
    # this from processor[runtime]; CI needs it explicitly as well.
    "pyarrow>=16.0",
    "stream2pretrain-ingest-common",
    "stream2pretrain-rss-poller",
    "stream2pretrain-arxiv-html-fetcher",
    "stream2pretrain-hf-poller",
    "stream2pretrain-oaipmh-poller",
    "stream2pretrain-processor",
    "stream2pretrain-tests",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schemas"]

# uv workspace - members are paths whose pyproject.toml will be discovered.
# `charts/` intentionally omitted (Helm only, no Python).
[tool.uv.workspace]
members = [
    "ingest/common",
    "ingest/rss_poller",
    "ingest/hf_poller",
    "ingest/oaipmh_poller",
    "ingest/arxiv_html_fetcher",
    "processor",
    "tests",
]

[tool.uv.sources]
stream2pretrain = { workspace = true }
stream2pretrain-ingest-common = { workspace = true }
stream2pretrain-rss-poller = { workspace = true }
stream2pretrain-arxiv-html-fetcher = { workspace = true }
stream2pretrain-hf-poller = { workspace = true }
stream2pretrain-oaipmh-poller = { workspace = true }
stream2pretrain-processor = { workspace = true }
stream2pretrain-tests = { workspace = true }
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802", "N803"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "aiokafka.*",
    "aiobotocore.*",
    "boto3.*",
    "botocore.*",
    "bytewax.*",
    "confluent_kafka.*",
    "datasketch.*",
    "datasets.*",
    "duckdb.*",
    "fastlangid.*",
    "feedparser.*",
    "kenlm.*",
    "kopf.*",
    "kubernetes.*",
    "langdetect.*",
    "onnxruntime.*",
    "plyvel.*",
    "presidio_analyzer.*",
    "pygments.*",
    "pyiceberg.*",
    "rensa.*",
    "resiliparse.*",
    "sentencepiece.*",
    "sqlitedict.*",
    "sympy.*",
    "tiktoken.*",
    "transformers.*",
    "types_aiobotocore_s3.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "test_config",
    "test_common",
    "test_fetcher",
    "tests.*",
    "ingest.*.tests.*",
    "ingest.common.tests.*",
    "processor.tests.*",
]
disallow_untyped_defs = false
disallow_any_generics = false
disable_error_code = ["arg-type", "assignment", "attr-defined", "call-overload", "no-any-return", "no-untyped-def", "type-arg", "union-attr"]

[[tool.mypy.overrides]]
module = [
    "processor.operators.*",
    "processor.tokenize",
]
disable_error_code = ["attr-defined", "no-any-return", "operator"]

[[tool.mypy.overrides]]
module = [
    "ingest.common.minio_writer",
    "ingest.common.state",
    "ingest.common.kafka_producer",
    "ingest.common.logging",
    "ingest.common.otel",
    "processor.common",
    "processor.iceberg_writer",
    "processor.mixture_controller.controller",
    "ingest.oaipmh_poller.client",
]
disable_error_code = ["arg-type", "assignment", "attr-defined", "misc", "no-any-return", "type-arg", "union-attr", "untyped-decorator"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "processor/tests",
    "ingest/common/tests",
    "ingest/rss_poller/tests",
    "ingest/hf_poller/tests",
    "ingest/oaipmh_poller/tests",
    "ingest/arxiv_html_fetcher/tests",
]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error::DeprecationWarning",
    "ignore:SelectableGroups dict interface is deprecated:DeprecationWarning",
]
markers = [
    "integration: tests that need Docker, Redpanda, MinIO, Iceberg, or other external services",
]
