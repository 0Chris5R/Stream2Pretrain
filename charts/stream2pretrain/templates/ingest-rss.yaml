{{- if or .Values.sources.arxiv.enabled .Values.mixtureController.enabled }}
{{- $component := "ingest-rss" }}
{{- $name := printf "%s-%s" (include "stream2pretrain.fullname" .) $component }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  suspend: {{ not .Values.sources.arxiv.enabled }}
  schedule: {{ .Values.sources.arxiv.rss.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1200
      template:
        metadata:
          labels:
            {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 12 }}
            stream2pretrain.io/egress-class: arxiv
        spec:
          serviceAccountName: {{ include "stream2pretrain.serviceAccountName" . }}
          restartPolicy: OnFailure
          {{- include "stream2pretrain.imagePullSecrets" . | nindent 10 }}
          {{- include "stream2pretrain.podSecurityContext" . | nindent 10 }}
          {{- include "stream2pretrain.scheduling" . | nindent 10 }}
          containers:
            - name: rss
              image: {{ include "stream2pretrain.image" (dict "ctx" . "image" .Values.ingest.rss.image) | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "-m", "ingest.rss_poller.poller"]
              {{- include "stream2pretrain.containerSecurityContext" . | nindent 14 }}
              args:
                - --config
                - /etc/s2p/feeds/arxiv.json
                - --license-default
                - {{ .Values.sources.arxiv.rss.licenseDefault | quote }}
              env:
                {{- include "stream2pretrain.commonEnv" . | nindent 16 }}
                - name: S2P_COMPONENT
                  value: {{ $component | quote }}
                - name: S2P_FEED_CONFIG
                  value: /etc/s2p/feeds/arxiv.json
              volumeMounts:
                - name: feeds
                  mountPath: /etc/s2p/feeds
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                {{- toYaml .Values.ingest.rss.resources | nindent 16 }}
          volumes:
            - name: feeds
              configMap:
                name: {{ include "stream2pretrain.fullname" . }}-feeds
            - name: tmp
              emptyDir: {}
{{- end }}
{{- if .Values.sources.blogs.enabled }}
---
{{- $blogName := printf "%s-ingest-blogs" (include "stream2pretrain.fullname" .) }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $blogName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" "ingest-blogs") | nindent 4 }}
spec:
  schedule: {{ .Values.sources.blogs.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" "ingest-blogs") | nindent 12 }}
            stream2pretrain.io/egress-class: blogs
        spec:
          serviceAccountName: {{ include "stream2pretrain.serviceAccountName" . }}
          restartPolicy: OnFailure
          {{- include "stream2pretrain.imagePullSecrets" . | nindent 10 }}
          {{- include "stream2pretrain.podSecurityContext" . | nindent 10 }}
          {{- include "stream2pretrain.scheduling" . | nindent 10 }}
          containers:
            - name: blogs
              image: {{ include "stream2pretrain.image" (dict "ctx" . "image" .Values.ingest.rss.image) | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "-m", "ingest.rss_poller.poller"]
              {{- include "stream2pretrain.containerSecurityContext" . | nindent 14 }}
              args:
                - --config
                - /etc/s2p/feeds/blogs.json
              env:
                {{- include "stream2pretrain.commonEnv" . | nindent 16 }}
                - name: S2P_COMPONENT
                  value: ingest-blogs
                - name: S2P_FEED_CONFIG
                  value: /etc/s2p/feeds/blogs.json
              volumeMounts:
                - name: feeds
                  mountPath: /etc/s2p/feeds
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                {{- toYaml .Values.ingest.rss.resources | nindent 16 }}
          volumes:
            - name: feeds
              configMap:
                name: {{ include "stream2pretrain.fullname" . }}-feeds
            - name: tmp
              emptyDir: {}
{{- end }}
