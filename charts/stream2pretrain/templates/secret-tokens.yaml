{{/*
NOTE: Stream2Pretrain expects external secrets to be managed by sealed-secrets,
External Secrets Operator, or similar. This file declares the *names* the
chart references; populate them out-of-band. To install the chart in dev with
local stub values, set --set-file with-stub.yaml or use kubectl create secret
generic <name> --from-literal=...

Required secrets (create before installing):
  - {{ .Values.minio.credentialsSecret }}                     keys: accessKey, secretKey
  - {{ .Values.sources.huggingface.models.tokenSecret }}      key: {{ .Values.sources.huggingface.models.tokenSecretKey }}
  - {{ .Values.processor.deconGate.signingKeySecret }}        key: {{ .Values.processor.deconGate.signingKeyKey }}
  - {{ .Values.iceberg.credentialSecret }}                   keys: {{ .Values.iceberg.credentialKey }}, {{ .Values.iceberg.scopeKey }}
  - {{ .Values.processor.deconGate.benchmarkCorpus.configMap }}               key: {{ .Values.processor.deconGate.benchmarkCorpus.fileName }} (ConfigMap with benchmark corpus JSON)
  - {{ .Values.keda.triggerAuthSecret }}                      keys: sasl, tls (optional)
  - {{ .Values.processor.foundry.providerSecret }}            keys: {{ .Values.processor.foundry.hetznerKey }}, {{ .Values.processor.foundry.controlTokenKey }} (when foundry is enabled)
*/}}
{{- if .Values.networkPolicy.enabled -}}
# Empty placeholder ConfigMap so helm template renders a non-empty doc here
# even when no Secret manifests are emitted directly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stream2pretrain.fullname" . }}-secret-refs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.labels" . | nindent 4 }}
data:
  README: |
    Secrets used by Stream2Pretrain are managed externally. See the comment in
    templates/secret-tokens.yaml for the list and required keys. Use sealed-
    secrets or External Secrets Operator to populate them.
{{- end }}
