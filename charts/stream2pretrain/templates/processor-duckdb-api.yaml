{{- $component := "duckdb" }}
{{- $name := printf "%s-%s" (include "stream2pretrain.fullname" .) $component }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.processor.duckdbApi.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 8 }}
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: {{ include "stream2pretrain.serviceAccountName" . }}
      {{- include "stream2pretrain.imagePullSecrets" . | nindent 6 }}
      {{- include "stream2pretrain.podSecurityContext" . | nindent 6 }}
      {{- include "stream2pretrain.scheduling" . | nindent 6 }}
      containers:
        - name: duckdb-api
          image: {{ include "stream2pretrain.image" (dict "ctx" . "image" .Values.processor.duckdbApi.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["s2p-entrypoint", "s2p-duckdb-api"]
          {{- include "stream2pretrain.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.processor.duckdbApi.apiPort }}
          env:
            {{- include "stream2pretrain.commonEnv" . | nindent 12 }}
            - name: S2P_COMPONENT
              value: {{ $component | quote }}
            - name: S2P_DUCKDB_API_PORT
              value: {{ .Values.processor.duckdbApi.apiPort | quote }}
            - name: S2P_DUCKDB_GOLD_RELATION
              value: {{ .Values.processor.duckdbApi.goldRelation | quote }}
            - name: S2P_ACTIVE_SCORING_VERSION
              value: {{ .Values.processor.duckdbApi.activeScoringVersion | quote }}
            - name: S2P_DUCKDB_CATALOG_REFRESH_SECONDS
              value: {{ .Values.processor.duckdbApi.catalogRefreshSeconds | quote }}
            - name: S2P_DUCKDB_MEMORY_LIMIT
              value: {{ .Values.processor.duckdbApi.memoryLimit | quote }}
            - name: S2P_DUCKDB_THREADS
              value: {{ .Values.processor.duckdbApi.threads | quote }}
            - name: S2P_DUCKDB_TEMP_DIRECTORY
              value: /tmp/duckdb-spill
            - name: S2P_DUCKDB_MAX_TEMP_DIRECTORY_SIZE
              value: {{ .Values.processor.duckdbApi.maxTempDirectorySize | quote }}
            - name: S2P_SERVING_INDEX_ENABLED
              value: "1"
            - name: S2P_SERVING_INDEX_DATABASE
              value: /var/lib/s2p-serving/serving.duckdb
            - name: S2P_SERVING_INDEX_BATCH_SIZE
              value: {{ .Values.processor.duckdbApi.servingIndex.batchSize | quote }}
            - name: HOME
              value: /tmp
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.processor.duckdbApi.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: serving-index
              mountPath: /var/lib/s2p-serving
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.processor.duckdbApi.tempStorageSizeLimit }}
        - name: serving-index
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-serving-index" $name) .Values.processor.duckdbApi.servingIndex.existingClaim }}
{{- if not .Values.processor.duckdbApi.servingIndex.existingClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-serving-index" $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.processor.duckdbApi.servingIndex.storageClass }}
  storageClassName: {{ .Values.processor.duckdbApi.servingIndex.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.processor.duckdbApi.servingIndex.size }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.processor.duckdbApi.apiPort }}
      targetPort: http
  selector:
    {{- include "stream2pretrain.componentServiceSelectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
