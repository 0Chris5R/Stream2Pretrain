{{- /*
arXiv full-paper-HTML fetcher.

A Kafka consumer-group ``Deployment`` subscribes to the source-specific
``arxiv.discovery`` topic and fetches the native HTML body for every freshly
seen arXiv id. Historical backfill is intentionally not part of the deployed
source catalogue.

The egress class is ``arxiv`` and is already wired in
networkpolicies.yaml.

Each Kafka partition has one consumer-group owner and each offset is committed
only after durable handling. KEDA can therefore scale this worker from the
source-specific backlog without counting the enriched records it publishes to
``raw.fetched``.
*/ -}}
{{- if .Values.sources.arxiv.htmlFetcher.enabled }}
{{- $component := "ingest-arxiv-html" }}
{{- $name := printf "%s-%s" (include "stream2pretrain.fullname" .) $component }}
{{- $hf := .Values.ingest.arxivHtmlFetcher }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ default 1 $hf.replicas }}
  selector:
    matchLabels:
      {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 8 }}
        stream2pretrain.io/egress-class: arxiv
    spec:
      serviceAccountName: {{ include "stream2pretrain.serviceAccountName" . }}
      {{- include "stream2pretrain.imagePullSecrets" . | nindent 6 }}
      {{- include "stream2pretrain.podSecurityContext" . | nindent 6 }}
      {{- include "stream2pretrain.scheduling" . | nindent 6 }}
      containers:
        - name: arxiv-html
          image: {{ include "stream2pretrain.image" (dict "ctx" . "image" $hf.image "tag" $hf.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "stream2pretrain.containerSecurityContext" . | nindent 10 }}
          args:
            - --feed-name
            - {{ .Values.sources.arxiv.htmlFetcher.feedName | quote }}
            - --stream-topic
            - {{ .Values.redpanda.topics.arxivDiscovery | quote }}
            - --consumer-group
            - {{ $hf.consumerGroup | quote }}
            - --auto-offset-reset
            - {{ $hf.autoOffsetReset | quote }}
            {{- if $hf.maxRecordsPerLoop }}
            - --max-records
            - {{ $hf.maxRecordsPerLoop | quote }}
            {{- end }}
          env:
            {{- include "stream2pretrain.commonEnv" . | nindent 12 }}
            - name: S2P_COMPONENT
              value: {{ $component | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml $hf.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- if and .Values.keda.enabled (gt (int $hf.replicas) 1) }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ $name }}
  pollingInterval: {{ .Values.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  minReplicaCount: 1
  maxReplicaCount: {{ $hf.replicas }}
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: {{ .Values.redpanda.bootstrapServers | quote }}
        consumerGroup: {{ $hf.consumerGroup | quote }}
        topic: {{ .Values.redpanda.topics.arxivDiscovery | quote }}
        lagThreshold: "1"
        offsetResetPolicy: {{ $hf.autoOffsetReset | quote }}
        allowIdleConsumers: "false"
      {{- if .Values.keda.auth.enabled }}
      authenticationRef:
        name: {{ include "stream2pretrain.fullname" . }}-redpanda
      {{- end }}
{{- end }}
{{- end }}
