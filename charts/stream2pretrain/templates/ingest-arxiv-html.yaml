{{- /*
arXiv full-paper-HTML fetcher.

A fixed single-replica ``Deployment`` subscribes to ``raw.fetched`` and
fetches the native HTML body for every freshly seen arXiv id. Historical
backfill is intentionally not part of the deployed source catalogue.

Per CLAUDE.md the egress class is ``arxiv`` (already wired in
networkpolicies.yaml).

Kafka-lag KEDA is deliberately absent here. The worker consumes the shared
``raw.fetched`` topic and publishes enriched arXiv records back to that topic,
so topic-wide lag is self-amplifying and is not an arXiv work metric. Keep one
replica until a source-specific Prometheus backlog metric exists.
*/ -}}
{{- if .Values.sources.arxiv.htmlFetcher.enabled }}
{{- $component := "ingest-arxiv-html" }}
{{- $name := printf "%s-%s" (include "stream2pretrain.fullname" .) $component }}
{{- $hf := .Values.ingest.arxivHtmlFetcher }}
{{- if ne (int $hf.replicas) 1 }}
{{- fail "ingest.arxivHtmlFetcher.replicas must be exactly 1 until a source-specific backlog scaler exists" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ default 1 $hf.replicas }}
  selector:
    matchLabels:
      {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 8 }}
        stream2pretrain.io/egress-class: arxiv
    spec:
      serviceAccountName: {{ include "stream2pretrain.serviceAccountName" . }}
      {{- include "stream2pretrain.imagePullSecrets" . | nindent 6 }}
      {{- include "stream2pretrain.podSecurityContext" . | nindent 6 }}
      {{- include "stream2pretrain.scheduling" . | nindent 6 }}
      containers:
        - name: arxiv-html
          image: {{ include "stream2pretrain.image" (dict "ctx" . "image" $hf.image "tag" $hf.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "stream2pretrain.containerSecurityContext" . | nindent 10 }}
          args:
            - --feed-name
            - {{ .Values.sources.arxiv.htmlFetcher.feedName | quote }}
            - --stream-topic
            - {{ .Values.redpanda.topics.rawFetched | quote }}
            - --consumer-group
            - {{ $hf.consumerGroup | quote }}
            - --auto-offset-reset
            - {{ $hf.autoOffsetReset | quote }}
            {{- if $hf.maxRecordsPerLoop }}
            - --max-records
            - {{ $hf.maxRecordsPerLoop | quote }}
            {{- end }}
          env:
            {{- include "stream2pretrain.commonEnv" . | nindent 12 }}
            - name: S2P_COMPONENT
              value: {{ $component | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml $hf.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
