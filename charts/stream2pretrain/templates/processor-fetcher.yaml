{{- $component := "processor-fetcher" }}
{{- $name := printf "%s-%s" (include "stream2pretrain.fullname" .) $component }}
{{- $checkpoint := .Values.processor.fetcher.checkpoint }}
{{- if ne (int .Values.processor.fetcher.replicas) 1 }}
{{- fail "processor.fetcher.replicas must be exactly 1 until coordinated Bytewax multi-worker recovery is implemented" }}
{{- end }}
{{- if ne (int .Values.processor.fetcher.canary.replicas) 1 }}
{{- fail "processor.fetcher.canary.replicas must be exactly 1" }}
{{- end }}
{{- $checkpointClaim := default (printf "%s-checkpoint" $name) $checkpoint.existingClaim }}
{{- if not $checkpoint.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $checkpointClaim }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with $checkpoint.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $checkpoint.size | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.processor.fetcher.replicas }}
  selector:
    matchLabels:
      {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 8 }}
        stream2pretrain.io/egress-class: arxiv
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: {{ include "stream2pretrain.serviceAccountName" . }}
      {{- include "stream2pretrain.imagePullSecrets" . | nindent 6 }}
      {{- include "stream2pretrain.podSecurityContext" . | nindent 6 }}
      {{- include "stream2pretrain.scheduling" . | nindent 6 }}
      containers:
        - name: fetcher
          image: {{ include "stream2pretrain.image" (dict "ctx" . "image" .Values.processor.fetcher.image "tag" .Values.processor.fetcher.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["s2p-entrypoint", "s2p-fetcher"]
          {{- include "stream2pretrain.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: metrics
              containerPort: 9090
          env:
            {{- include "stream2pretrain.commonEnv" . | nindent 12 }}
            - name: S2P_COMPONENT
              value: {{ $component | quote }}
            - name: S2P_BYTEWAX_FLOW_NAME
              value: "s2p-fetcher-live-v5"
            - name: S2P_BYTEWAX_RECOVERY_NAME
              value: "fetcher-live-v5"
            - name: S2P_STATE_DIR
              value: /var/lib/s2p/checkpoint
            - name: S2P_CONSUMER_GROUP
              value: s2p-fetcher
            - name: S2P_FETCHER_INPUT_TOPICS
              value: {{ .Values.redpanda.topics.rawFetched | quote }}
            - name: S2P_BYTEWAX_RECOVERY_PARTITIONS
              value: {{ $checkpoint.recoveryPartitions | int | quote }}
            - name: S2P_BYTEWAX_SNAPSHOT_SECONDS
              value: {{ $checkpoint.snapshotSeconds | quote }}
            - name: S2P_MAX_RAW_OBJECT_BYTES
              value: "67108864"
            - name: S2P_MAX_EXPANDED_OBJECT_BYTES
              value: "67108864"
            - name: S2P_WAYBACK_LOOKUP_ENABLED
              value: "0"
            - name: S2P_DOCLING_ENABLED
              value: {{ ternary "1" "0" .Values.processor.fetcher.doclingEnabled | quote }}
            - name: S2P_PDF_PROCESSING_ENABLED
              value: {{ ternary "1" "0" .Values.processor.fetcher.pdfProcessingEnabled | quote }}
            - name: S2P_REQUIRE_REAL_MODELS
              value: {{ ternary "1" "0" .Values.processor.fetcher.requireRealModels | quote }}
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.processor.fetcher.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: checkpoint
              mountPath: /var/lib/s2p/checkpoint
      volumes:
        - name: tmp
          emptyDir: {}
        - name: checkpoint
          persistentVolumeClaim:
            claimName: {{ $checkpointClaim | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
  selector:
    {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
{{- if .Values.processor.fetcher.canary.enabled }}
---
{{- $canaryComponent := "processor-fetcher-canary" }}
{{- $canaryName := printf "%s-%s" (include "stream2pretrain.fullname" .) $canaryComponent }}
{{- $canaryCheckpoint := .Values.processor.fetcher.canary.checkpoint }}
{{- $canaryCheckpointClaim := default (printf "%s-checkpoint" $canaryName) $canaryCheckpoint.existingClaim }}
{{- if not $canaryCheckpoint.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $canaryCheckpointClaim }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $canaryComponent) | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with $canaryCheckpoint.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $canaryCheckpoint.size | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $canaryName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $canaryComponent) | nindent 4 }}
spec:
  replicas: {{ .Values.processor.fetcher.canary.replicas }}
  selector:
    matchLabels:
      {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $canaryComponent) | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $canaryComponent) | nindent 8 }}
        stream2pretrain.io/egress-class: arxiv
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: {{ include "stream2pretrain.serviceAccountName" . }}
      {{- include "stream2pretrain.imagePullSecrets" . | nindent 6 }}
      {{- include "stream2pretrain.podSecurityContext" . | nindent 6 }}
      {{- include "stream2pretrain.scheduling" . | nindent 6 }}
      containers:
        - name: fetcher
          image: {{ include "stream2pretrain.image" (dict "ctx" . "image" .Values.processor.fetcher.image "tag" .Values.processor.fetcher.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["s2p-entrypoint", "s2p-fetcher"]
          {{- include "stream2pretrain.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: metrics
              containerPort: 9090
          env:
            {{- include "stream2pretrain.commonEnv" . | nindent 12 }}
            - name: S2P_COMPONENT
              value: {{ $canaryComponent | quote }}
            - name: S2P_BYTEWAX_FLOW_NAME
              value: "s2p-fetcher-smoke-v1"
            - name: S2P_BYTEWAX_RECOVERY_NAME
              value: "fetcher-smoke-v1"
            - name: S2P_STATE_DIR
              value: /var/lib/s2p/checkpoint
            - name: S2P_CONSUMER_GROUP
              value: {{ .Values.processor.fetcher.canary.consumerGroup | quote }}
            - name: S2P_FETCHER_INPUT_TOPICS
              value: {{ .Values.redpanda.topics.smokeRaw | quote }}
            - name: S2P_FETCHER_OUTPUT_TOPIC
              value: {{ .Values.redpanda.topics.docsNormalizedSmoke | quote }}
            - name: S2P_PROCESSING_FAILURE_BUCKET
              value: {{ .Values.minio.buckets.state | quote }}
            - name: S2P_PROCESSING_FAILURE_PREFIX
              value: "canary-processing-failures/fetcher"
            - name: S2P_BYTEWAX_RECOVERY_PARTITIONS
              value: {{ $canaryCheckpoint.recoveryPartitions | int | quote }}
            - name: S2P_BYTEWAX_SNAPSHOT_SECONDS
              value: {{ $canaryCheckpoint.snapshotSeconds | quote }}
            - name: S2P_MAX_RAW_OBJECT_BYTES
              value: "67108864"
            - name: S2P_MAX_EXPANDED_OBJECT_BYTES
              value: "67108864"
            - name: S2P_WAYBACK_LOOKUP_ENABLED
              value: "0"
            - name: S2P_DOCLING_ENABLED
              value: {{ ternary "1" "0" .Values.processor.fetcher.doclingEnabled | quote }}
            - name: S2P_PDF_PROCESSING_ENABLED
              value: {{ ternary "1" "0" .Values.processor.fetcher.pdfProcessingEnabled | quote }}
            - name: S2P_REQUIRE_REAL_MODELS
              value: {{ ternary "1" "0" .Values.processor.fetcher.requireRealModels | quote }}
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.processor.fetcher.canary.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: checkpoint
              mountPath: /var/lib/s2p/checkpoint
      volumes:
        - name: tmp
          emptyDir: {}
        - name: checkpoint
          persistentVolumeClaim:
            claimName: {{ $canaryCheckpointClaim | quote }}
{{- end }}
