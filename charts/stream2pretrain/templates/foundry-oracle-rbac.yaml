{{- if and .Values.processor.foundry.enabled .Values.processor.foundry.enableOracles }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "stream2pretrain.fullname" . }}-foundry-oracles
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "stream2pretrain.fullname" . }}-foundry-oracles
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "stream2pretrain.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "stream2pretrain.fullname" . }}-foundry-oracles
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "stream2pretrain.fullname" . }}-foundry-oracles-deny-all
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      stream2pretrain.io/component: foundry-oracle
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress: []
{{- end }}
