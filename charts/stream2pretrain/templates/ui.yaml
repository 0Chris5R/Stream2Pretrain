{{- $component := "ui" }}
{{- $name := printf "%s-%s" (include "stream2pretrain.fullname" .) $component }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "stream2pretrain.serviceAccountName" . }}
      {{- include "stream2pretrain.imagePullSecrets" . | nindent 6 }}
      {{- include "stream2pretrain.podSecurityContext" . | nindent 6 }}
      {{- include "stream2pretrain.scheduling" . | nindent 6 }}
      containers:
        - name: ui
          image: {{ include "stream2pretrain.image" (dict "ctx" . "image" .Values.ui.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "stream2pretrain.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.port }}
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: {{ .Values.ui.port | quote }}
            - name: HOSTNAME
              value: "::"
            - name: DECON_GATE_URL
              value: {{ printf "http://%s-decon-gate.%s.svc:%v" (include "stream2pretrain.fullname" .) .Release.Namespace .Values.processor.deconGate.apiPort | quote }}
            - name: MIXTURE_API_URL
              value: {{ printf "http://%s-mixture-controller.%s.svc:%v" (include "stream2pretrain.fullname" .) .Release.Namespace .Values.mixtureController.apiPort | quote }}
            - name: SOURCES_API_URL
              value: {{ printf "http://%s-mixture-controller.%s.svc:%v" (include "stream2pretrain.fullname" .) .Release.Namespace .Values.mixtureController.apiPort | quote }}
            - name: DUCKDB_URL
              value: {{ printf "http://%s-duckdb.%s.svc:%v" (include "stream2pretrain.fullname" .) .Release.Namespace .Values.processor.duckdbApi.apiPort | quote }}
            - name: PROMETHEUS_URL
              value: {{ .Values.observability.prometheus.serverAddress | quote }}
            - name: FOUNDRY_URL
              value: {{ printf "http://%s-foundry.%s.svc:%v" (include "stream2pretrain.fullname" .) .Release.Namespace .Values.processor.foundry.apiPort | quote }}
            {{- if .Values.processor.foundry.enabled }}
            - name: FOUNDRY_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.processor.foundry.providerSecret | quote }}
                  key: {{ .Values.processor.foundry.controlTokenKey | quote }}
            {{- end }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.credentialsSecret | quote }}
                  key: accessKey
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.credentialsSecret | quote }}
                  key: secretKey
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          volumeMounts:
            - name: cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "stream2pretrain.componentServiceSelectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
