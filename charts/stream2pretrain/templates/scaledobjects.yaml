{{- /*
Fetcher and curate store Bytewax source progress in recovery databases, so
standard Kafka-lag scaling cannot observe or safely rescale either core
execution. Independent ingest consumers may still use this shared Redpanda
authentication for their own ScaledObjects.
*/ -}}
{{- if and .Values.keda.enabled .Values.keda.auth.enabled }}
{{- $fullName := include "stream2pretrain.fullname" . -}}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ $fullName }}-redpanda
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: sasl
      name: {{ .Values.keda.triggerAuthSecret | quote }}
      key: sasl
    - parameter: tls
      name: {{ .Values.keda.triggerAuthSecret | quote }}
      key: tls
    - parameter: username
      name: {{ .Values.keda.triggerAuthSecret | quote }}
      key: username
    - parameter: password
      name: {{ .Values.keda.triggerAuthSecret | quote }}
      key: password
{{- end }}
