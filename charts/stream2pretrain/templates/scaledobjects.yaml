{{- /*
Bytewax's KafkaSource intentionally stores offsets in its recovery database
and does not commit broker consumer-group offsets. Kafka-lag KEDA triggers for
the fetcher, curator, or Iceberg writer would therefore read dead/zero-lag
groups and could rebalance partitions away from the PVC that owns their
checkpoint. Only the independently committing ingest consumers render
ScaledObjects; this template supplies their optional Redpanda authentication.
*/ -}}
{{- if and .Values.keda.enabled .Values.keda.auth.enabled }}
{{- $fullName := include "stream2pretrain.fullname" . -}}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ $fullName }}-redpanda
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: sasl
      name: {{ .Values.keda.triggerAuthSecret | quote }}
      key: sasl
    - parameter: tls
      name: {{ .Values.keda.triggerAuthSecret | quote }}
      key: tls
    - parameter: username
      name: {{ .Values.keda.triggerAuthSecret | quote }}
      key: username
    - parameter: password
      name: {{ .Values.keda.triggerAuthSecret | quote }}
      key: password
{{- end }}
