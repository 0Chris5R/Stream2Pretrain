{{- /*
Curate and Iceberg still store Bytewax offsets in their recovery databases, so
they cannot use Kafka-lag scaling safely. The stateless fetcher and independent
ingest consumers render their own ScaledObjects; this template supplies their
optional shared Redpanda authentication.
*/ -}}
{{- if and .Values.keda.enabled .Values.keda.auth.enabled }}
{{- $fullName := include "stream2pretrain.fullname" . -}}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ $fullName }}-redpanda
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: sasl
      name: {{ .Values.keda.triggerAuthSecret | quote }}
      key: sasl
    - parameter: tls
      name: {{ .Values.keda.triggerAuthSecret | quote }}
      key: tls
    - parameter: username
      name: {{ .Values.keda.triggerAuthSecret | quote }}
      key: username
    - parameter: password
      name: {{ .Values.keda.triggerAuthSecret | quote }}
      key: password
{{- end }}
