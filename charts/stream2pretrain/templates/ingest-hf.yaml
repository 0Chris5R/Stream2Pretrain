{{- if .Values.sources.huggingface.enabled }}
{{- $component := "ingest-hf-cards" }}
{{- $name := printf "%s-%s" (include "stream2pretrain.fullname" .) $component }}
{{- $stateClaim := default (printf "%s-ingest-state" (include "stream2pretrain.fullname" .)) .Values.ingest.state.existingClaim }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.ingest.hf.replicas }}
  selector:
    matchLabels:
      {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 8 }}
        stream2pretrain.io/egress-class: huggingface
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: {{ include "stream2pretrain.serviceAccountName" . }}
      {{- include "stream2pretrain.imagePullSecrets" . | nindent 6 }}
      {{- include "stream2pretrain.podSecurityContext" . | nindent 6 }}
      {{- include "stream2pretrain.scheduling" . | nindent 6 }}
      containers:
        - name: hf-cards
          image: {{ include "stream2pretrain.image" (dict "ctx" . "image" .Values.ingest.hf.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "ingest.hf_poller.poller"]
          {{- include "stream2pretrain.containerSecurityContext" . | nindent 10 }}
          args:
            - --mode
            - hub-cards
            - --config
            - /etc/s2p/feeds/hf.json
            - --poll-interval-seconds
            - {{ .Values.sources.huggingface.models.pollIntervalSeconds | quote }}
          ports:
            - name: metrics
              containerPort: 9090
          env:
            {{- include "stream2pretrain.commonEnv" . | nindent 12 }}
            - name: S2P_COMPONENT
              value: {{ $component | quote }}
            - name: S2P_STATE_ROOT
              value: /var/lib/s2p-state
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sources.huggingface.models.tokenSecret | quote }}
                  key: {{ .Values.sources.huggingface.models.tokenSecretKey | quote }}
                  optional: true
          volumeMounts:
            - name: feeds
              mountPath: /etc/s2p/feeds
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if eq .Values.ingest.state.backend "pvc" }}
            - name: state
              mountPath: /var/lib/s2p-state
            {{- end }}
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ingest.hf.resources | nindent 12 }}
      volumes:
        - name: feeds
          configMap:
            name: {{ include "stream2pretrain.fullname" . }}-feeds
        - name: tmp
          emptyDir: {}
        {{- if eq .Values.ingest.state.backend "pvc" }}
        - name: state
          persistentVolumeClaim:
            claimName: {{ $stateClaim | quote }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
  selector:
    {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
{{- end }}
