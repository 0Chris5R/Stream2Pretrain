apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stream2pretrain.fullname" . }}-feeds
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.labels" . | nindent 4 }}
data:
  arxiv.json: |-
    {{- $oai := .Values.sources.arxiv.oaiPmh }}
    {
      "feeds": [
        {{- range $idx, $cat := .Values.sources.arxiv.rss.categories }}
        {{- if $idx }},{{ end }}
        {
          "name": {{ printf "rss-arxiv-%s" ($cat | lower | replace "." "-") | quote }},
          "protocol": "rss",
          "endpoint": {{ printf "https://rss.arxiv.org/rss/%s" $cat | quote }},
          "pollIntervalSeconds": {{ $.Values.sources.arxiv.rss.pollIntervalSeconds }},
          "rateLimit": {"requestsPerSecond": 1, "burst": 4},
          "licenseDefault": {{ $.Values.sources.arxiv.rss.licenseDefault | quote }},
          "enabled": true
        }
        {{- end }}
      ],
      "oai_pmh": {
        "name": {{ $oai.name | quote }},
        "endpoint": {{ $oai.endpoint | quote }},
        "set": {{ $oai.set | quote }},
        "poll_interval_seconds": {{ $oai.pollIntervalSeconds }},
        "license_default": {{ $oai.licenseDefault | quote }}
      },
      "rss": {
        "categories": {{ toJson .Values.sources.arxiv.rss.categories }},
        "poll_interval_seconds": {{ .Values.sources.arxiv.rss.pollIntervalSeconds }},
        "license_default": {{ .Values.sources.arxiv.rss.licenseDefault | quote }}
      }
    }
  github-repos.json: |-
    {
      "events": {
        "ai_org_filter": {{ toJson .Values.sources.github.events.aiOrgFilter }},
        "poll_interval_seconds": {{ .Values.sources.github.events.pollIntervalSeconds }},
        "respect_x_poll_interval": {{ .Values.sources.github.events.respectXPollInterval }}
      },
      "releases": {
        "repos": {{ toJson .Values.sources.github.releases.repos }},
        "poll_interval_seconds": {{ .Values.sources.github.releases.pollIntervalSeconds }}
      }
    }
  hf.json: |-
    {
      "models": {
        "endpoint": {{ .Values.sources.huggingface.models.endpoint | quote }},
        "poll_interval_seconds": {{ .Values.sources.huggingface.models.pollIntervalSeconds }}
      },
      "daily_papers": {
        "endpoint": {{ .Values.sources.huggingface.dailyPapers.endpoint | quote }},
        "poll_interval_seconds": {{ .Values.sources.huggingface.dailyPapers.pollIntervalSeconds }}
      }
    }
  blogs.json: |-
    {
      "feeds": [
        {{- range $idx, $feed := .Values.sources.blogs.feeds }}
        {{- if $idx }},{{ end }}
        {
          "name": {{ printf "rss-%s" $feed.name | quote }},
          "protocol": "rss",
          "endpoint": {{ $feed.url | quote }},
          "pollIntervalSeconds": {{ $.Values.sources.blogs.pollIntervalSeconds }},
          {{- if or (eq $feed.name "openai-news") (eq $feed.name "deepmind") (eq $feed.name "hf-blog") }}
          "rateLimit": {"requestsPerSecond": 1, "burst": 2},
          {{- else }}
          "rateLimit": {"requestsPerSecond": 0.5, "burst": 1},
          {{- end }}
          "licenseDefault": "unknown",
          "enabled": true
        }
        {{- end }}
      ],
      "poll_interval_seconds": {{ .Values.sources.blogs.pollIntervalSeconds }}
    }
  sitemap.json: |-
    {
      "feeds": {{ toJson .Values.sources.sitemap.feeds }},
      "poll_interval_seconds": {{ .Values.sources.sitemap.pollIntervalSeconds }}
    }
  topics.json: |-
    {
      "raw_fetched": {{ .Values.redpanda.topics.rawFetched | quote }},
      "docs_normalized": {{ .Values.redpanda.topics.docsNormalized | quote }},
      "docs_curated": {{ .Values.redpanda.topics.docsCurated | quote }},
      "curation_decisions": {{ .Values.redpanda.topics.curationDecisions | quote }},
      "decon_attest": {{ .Values.redpanda.topics.deconAttest | quote }}
    }
