{{- $component := "processor-curate" }}
{{- $name := printf "%s-%s" (include "stream2pretrain.fullname" .) $component }}
{{- $bench := .Values.processor.deconGate.benchmarkCorpus }}
{{- $signingMount := "/var/run/secrets/stream2pretrain/decon-signing" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: {{ .Values.processor.curate.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: {{ include "stream2pretrain.serviceAccountName" . }}
      {{- include "stream2pretrain.imagePullSecrets" . | nindent 6 }}
      {{- include "stream2pretrain.podSecurityContext" . | nindent 6 }}
      {{- include "stream2pretrain.scheduling" . | nindent 6 }}
      terminationGracePeriodSeconds: 60
      {{- if .Values.processor.curate.modelBundle.bootstrap }}
      initContainers:
        - name: model-bootstrap
          image: {{ include "stream2pretrain.image" (dict "ctx" . "image" .Values.processor.curate.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "stream2pretrain.containerSecurityContext" . | nindent 10 }}
          command: ["python", "-m", "processor.model_bootstrap"]
          env:
            - name: S2P_MODELS_DIR
              value: /models
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: FINEPDFS_EDU_V2_REVISION
              value: "90ddef285f67230389057c14b2f6bbfeb70d40ea"
            - name: FINEWEB_EDU_REVISION
              value: "284663cbb2dabf9bda30d8f8cc49601251ee1631"
            - name: E5_SMALL_REVISION
              value: "ffb93f3bd4047442299a41ebb6fa998a38507c52"
            - name: KENLM_REVISION
              value: "3fbe35c83b1a39f420a345b7c96a186c8030d834"
            - name: FIGURE_CLASSIFIER_REVISION
              value: "f859dfbff5c9916cd996942d4b0db7fa25808220"
          resources:
            {{- toYaml .Values.processor.curate.modelBundle.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
      {{- else if .Values.processor.curate.modelBundle.url }}
      initContainers:
        - name: fetch-onnx-model
          image: {{ .Values.processor.curate.modelBundle.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "stream2pretrain.containerSecurityContext" . | nindent 10 }}
          command: ["sh", "-ec"]
          args:
            - |
              set -euo pipefail
              dst="/models/$(basename {{ .Values.processor.curate.onnxModel | quote }})"
              if [ -s "$dst" ]; then
                echo "model already present: $dst"
                exit 0
              fi
              echo "downloading $S2P_MODEL_URL -> $dst"
              curl --fail --silent --show-error --location --max-time 600 \
                -o "$dst.tmp" "$S2P_MODEL_URL"
              if [ -n "${S2P_MODEL_SHA256:-}" ]; then
                echo "$S2P_MODEL_SHA256  $dst.tmp" | sha256sum -c -
              fi
              mv "$dst.tmp" "$dst"
          env:
            - name: S2P_MODEL_URL
              value: {{ .Values.processor.curate.modelBundle.url | quote }}
            - name: S2P_MODEL_SHA256
              value: {{ .Values.processor.curate.modelBundle.sha256 | quote }}
          volumeMounts:
            - name: models
              mountPath: /models
      {{- end }}
      containers:
        - name: curate
          image: {{ include "stream2pretrain.image" (dict "ctx" . "image" .Values.processor.curate.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "stream2pretrain.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: metrics
              containerPort: 9090
          env:
            {{- include "stream2pretrain.commonEnv" . | nindent 12 }}
            - name: S2P_COMPONENT
              value: {{ $component | quote }}
            - name: S2P_CHECKPOINT_DIR
              value: /var/lib/s2p/checkpoint
            - name: S2P_STATE_DIR
              value: /var/lib/s2p/checkpoint
            - name: S2P_ONNX_MODEL
              value: {{ .Values.processor.curate.onnxModel | quote }}
            - name: S2P_MODELS_DIR
              value: /models
            - name: S2P_REQUIRE_REAL_MODELS
              value: "1"
            - name: S2P_FINEPDFS_EDU_REVISION
              value: "finepdfs-edu-v2@90ddef285f67230389057c14b2f6bbfeb70d40ea"
            - name: S2P_FINEWEB_EDU_REVISION
              value: "fineweb-edu@284663cbb2dabf9bda30d8f8cc49601251ee1631"
            - name: S2P_DOCLING_ENABLED
              value: "1"
            - name: S2P_USE_PRESIDIO
              value: "1"
            - name: S2P_MINHASH_BANDS
              value: {{ .Values.processor.curate.minHashBands | quote }}
            - name: S2P_MINHASH_ROWS_PER_BAND
              value: {{ .Values.processor.curate.minHashRowsPerBand | quote }}
            - name: S2P_CONSUMER_GROUP
              value: s2p-curate
            - name: S2P_DECON_SIGNING_KEY
              value: {{ printf "%s/%s" $signingMount .Values.processor.deconGate.signingKeyKey | quote }}
            - name: S2P_DECON_SIGNING_CERT
              value: {{ printf "%s/%s" $signingMount .Values.processor.deconGate.signingCertKey | quote }}
            - name: S2P_BENCH_CORPUS_PATH
              value: {{ printf "%s/%s" $bench.mountPath $bench.fileName | quote }}
            - name: S2P_BENCH_SET_VERSION
              value: {{ .Values.processor.deconGate.benchmarkSetVersion | quote }}
            - name: S2P_DECON_BLOOM_BITS
              value: {{ .Values.processor.deconGate.bloomBits | quote }}
            - name: S2P_DECON_BLOOM_HASHES
              value: {{ .Values.processor.deconGate.bloomHashes | quote }}
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.processor.curate.resources | nindent 12 }}
          volumeMounts:
            - name: checkpoint
              mountPath: /var/lib/s2p/checkpoint
            - name: tmp
              mountPath: /tmp
            - name: models
              mountPath: /models
              readOnly: true
            - name: decon-signing
              mountPath: {{ $signingMount | quote }}
              readOnly: true
            - name: decon-benchmarks
              mountPath: {{ $bench.mountPath | quote }}
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: models
          emptyDir:
            sizeLimit: {{ printf "%dMi" (int .Values.processor.curate.modelBundle.sizeMi) | quote }}
        - name: decon-signing
          secret:
            secretName: {{ .Values.processor.deconGate.signingKeySecret | quote }}
        - name: decon-benchmarks
          {{- if $bench.secret }}
          secret:
            secretName: {{ $bench.secret | quote }}
          {{- else }}
          configMap:
            name: {{ $bench.configMap | quote }}
          {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: checkpoint
        labels:
          {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.processor.curate.checkpoint.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.processor.curate.checkpoint.size | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
  selector:
    {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
