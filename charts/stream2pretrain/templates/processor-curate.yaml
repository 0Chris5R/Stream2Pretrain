{{- $component := "processor-curate" }}
{{- $name := printf "%s-%s" (include "stream2pretrain.fullname" .) $component }}
{{- $externalModels := or .Values.processor.curate.modelBundle.bootstrap (ne .Values.processor.curate.modelBundle.url "") }}
{{- if ne (int .Values.processor.curate.replicas) 1 }}
{{- fail "processor.curate.replicas must be exactly 1 until coordinated Bytewax multi-worker recovery is implemented" }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: {{ .Values.processor.curate.replicas }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: {{ include "stream2pretrain.serviceAccountName" . }}
      {{- include "stream2pretrain.imagePullSecrets" . | nindent 6 }}
      {{- include "stream2pretrain.podSecurityContext" . | nindent 6 }}
      {{- include "stream2pretrain.scheduling" . | nindent 6 }}
      terminationGracePeriodSeconds: 60
      {{- if and .Values.processor.modelService.enabled (not $externalModels) }}
      initContainers:
        - name: wait-model-service
          image: {{ include "stream2pretrain.image" (dict "ctx" . "image" .Values.processor.curate.image "tag" .Values.processor.curate.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "stream2pretrain.containerSecurityContext" . | nindent 10 }}
          command: ["python", "-c"]
          args:
            - |
              import time
              import urllib.request

              urls = [
                  "http://{{ printf "%s-processor-model-service-finepdfs" (include "stream2pretrain.fullname" .) }}:{{ .Values.processor.modelService.port }}/readyz",
                  "http://{{ printf "%s-processor-model-service-fineweb" (include "stream2pretrain.fullname" .) }}:{{ .Values.processor.modelService.port }}/readyz",
                  "http://{{ printf "%s-processor-model-service-kenlm" (include "stream2pretrain.fullname" .) }}:{{ .Values.processor.modelService.port }}/readyz",
              ]
              deadline = time.monotonic() + 900
              for url in urls:
                  while True:
                      try:
                          with urllib.request.urlopen(url, timeout=3) as response:
                              if response.status == 200:
                                  break
                      except Exception:
                          pass
                      if time.monotonic() >= deadline:
                          raise SystemExit(f"model service did not become ready: {url}")
                      time.sleep(5)
      {{- else }}
      {{- if .Values.processor.curate.modelBundle.bootstrap }}
      initContainers:
        - name: model-bootstrap
          image: {{ include "stream2pretrain.image" (dict "ctx" . "image" .Values.processor.curate.image "tag" .Values.processor.curate.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "stream2pretrain.containerSecurityContext" . | nindent 10 }}
          command: ["python", "-m", "processor.model_bootstrap"]
          env:
            - name: S2P_MODELS_DIR
              value: {{ ternary "/models" "/opt/models" $externalModels | quote }}
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: FINEPDFS_EDU_V2_REVISION
              value: "90ddef285f67230389057c14b2f6bbfeb70d40ea"
            - name: FINEWEB_EDU_REVISION
              value: "284663cbb2dabf9bda30d8f8cc49601251ee1631"
            - name: KENLM_REVISION
              value: "3fbe35c83b1a39f420a345b7c96a186c8030d834"
            - name: FIGURE_CLASSIFIER_REVISION
              value: "f859dfbff5c9916cd996942d4b0db7fa25808220"
          resources:
            {{- toYaml .Values.processor.curate.modelBundle.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
      {{- else if .Values.processor.curate.modelBundle.url }}
      initContainers:
        - name: fetch-onnx-model
          image: {{ .Values.processor.curate.modelBundle.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "stream2pretrain.containerSecurityContext" . | nindent 10 }}
          command: ["sh", "-ec"]
          args:
            - |
              set -euo pipefail
              dst="/models/$(basename {{ .Values.processor.curate.onnxModel | quote }})"
              if [ -s "$dst" ]; then
                echo "model already present: $dst"
                exit 0
              fi
              echo "downloading $S2P_MODEL_URL -> $dst"
              curl --fail --silent --show-error --location --max-time 600 \
                -o "$dst.tmp" "$S2P_MODEL_URL"
              if [ -n "${S2P_MODEL_SHA256:-}" ]; then
                echo "$S2P_MODEL_SHA256  $dst.tmp" | sha256sum -c -
              fi
              mv "$dst.tmp" "$dst"
          env:
            - name: S2P_MODEL_URL
              value: {{ .Values.processor.curate.modelBundle.url | quote }}
            - name: S2P_MODEL_SHA256
              value: {{ .Values.processor.curate.modelBundle.sha256 | quote }}
          volumeMounts:
            - name: models
              mountPath: /models
      {{- end }}
      {{- end }}
      containers:
        - name: curate
          image: {{ include "stream2pretrain.image" (dict "ctx" . "image" .Values.processor.curate.image "tag" .Values.processor.curate.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "stream2pretrain.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: metrics
              containerPort: 9090
          env:
            {{- include "stream2pretrain.commonEnv" . | nindent 12 }}
            - name: S2P_COMPONENT
              value: {{ $component | quote }}
            - name: S2P_BYTEWAX_FLOW_NAME
              value: "s2p-curate-live-v5"
            - name: S2P_BYTEWAX_RECOVERY_NAME
              value: "curate-live-v5"
            - name: S2P_CHECKPOINT_DIR
              value: /var/lib/s2p/checkpoint
            - name: S2P_STATE_DIR
              value: /var/lib/s2p/checkpoint
            - name: S2P_BYTEWAX_RECOVERY_PARTITIONS
              value: {{ .Values.processor.curate.checkpoint.recoveryPartitions | int | quote }}
            - name: S2P_BYTEWAX_SNAPSHOT_SECONDS
              value: {{ .Values.processor.curate.checkpoint.snapshotSeconds | quote }}
            - name: S2P_BYTEWAX_SOURCE_BATCH_SIZE
              value: {{ .Values.processor.curate.sourceBatchSize | int | quote }}
            - name: S2P_MODELS_DIR
              value: {{ ternary "/models" "/opt/models" $externalModels | quote }}
            {{- if and .Values.processor.modelService.enabled (not $externalModels) }}
            - name: S2P_FINEPDFS_MODEL_SERVICE_URL
              value: {{ printf "http://%s-processor-model-service-finepdfs:%d" (include "stream2pretrain.fullname" .) (int .Values.processor.modelService.port) | quote }}
            - name: S2P_FINEWEB_MODEL_SERVICE_URL
              value: {{ printf "http://%s-processor-model-service-fineweb:%d" (include "stream2pretrain.fullname" .) (int .Values.processor.modelService.port) | quote }}
            - name: S2P_KENLM_MODEL_SERVICE_URL
              value: {{ printf "http://%s-processor-model-service-kenlm:%d" (include "stream2pretrain.fullname" .) (int .Values.processor.modelService.port) | quote }}
            {{- end }}
            - name: S2P_REQUIRE_REAL_MODELS
              value: {{ ternary "1" "0" .Values.processor.curate.requireRealModels | quote }}
            - name: S2P_SCORING_VERSION
              value: {{ .Values.processor.curate.scoringVersion | quote }}
            - name: S2P_FINEPDFS_EDU_REVISION
              value: "finepdfs-edu-v2@90ddef285f67230389057c14b2f6bbfeb70d40ea"
            - name: S2P_FINEWEB_EDU_REVISION
              value: "fineweb-edu@284663cbb2dabf9bda30d8f8cc49601251ee1631"
            - name: S2P_DOCLING_ENABLED
              value: {{ ternary "1" "0" .Values.processor.curate.doclingEnabled | quote }}
            - name: S2P_USE_PRESIDIO
              value: {{ ternary "1" "0" .Values.processor.curate.usePresidio | quote }}
            - name: S2P_MINHASH_BANDS
              value: {{ .Values.processor.curate.minHashBands | quote }}
            - name: S2P_MINHASH_ROWS_PER_BAND
              value: {{ .Values.processor.curate.minHashRowsPerBand | quote }}
            - name: S2P_CONSUMER_GROUP
              value: s2p-curate
            - name: S2P_CURATOR_RETRY_TOPIC
              value: {{ .Values.redpanda.topics.rawFetched | quote }}
            - name: S2P_CURATOR_MAX_EXTRACTION_RETRIES
              value: "2"
            - name: S2P_CURATOR_CLASSIFIER_CONCURRENCY
              # Six independent requests per quality family let the primary
              # FinePDFs service expose enough demand for its six-Pod KEDA
              # ceiling. The family-specific executors preserve exact result
              # ordering and classifier parity.
              value: "12"
            - name: S2P_CURATOR_CLASSIFIER_BATCH_SIZE
              value: {{ .Values.processor.curate.classifierBatchSize | int | quote }}
          startupProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 90
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.processor.curate.resources | nindent 12 }}
          volumeMounts:
            - name: checkpoint
              mountPath: /var/lib/s2p/checkpoint
            - name: tmp
              mountPath: /tmp
            {{- if $externalModels }}
            - name: models
              mountPath: /models
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $externalModels }}
        - name: models
          emptyDir:
            sizeLimit: {{ printf "%dMi" (int .Values.processor.curate.modelBundle.sizeMi) | quote }}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: checkpoint
        labels:
          {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.processor.curate.checkpoint.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.processor.curate.checkpoint.size | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
  selector:
    {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
