{{- $component := "processor-curate" }}
{{- $name := printf "%s-%s" (include "stream2pretrain.fullname" .) $component }}
{{- $externalModels := .Values.processor.curate.modelBundle.bootstrap }}
{{- $checkpoint := .Values.processor.curate.checkpoint }}
{{- $checkpointClaim := default (printf "%s-checkpoint" $name) $checkpoint.existingClaim }}
{{- if and (gt (int .Values.processor.curate.replicas) 1) (ne $checkpoint.accessMode "ReadWriteMany") }}
{{- fail "processor.curate.checkpoint.accessMode must be ReadWriteMany for a distributed Bytewax execution" }}
{{- end }}
{{- if not $checkpoint.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $checkpointClaim }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  accessModes: [{{ $checkpoint.accessMode | quote }}]
  {{- with $checkpoint.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $checkpoint.size | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: {{ .Values.processor.curate.replicas }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: {{ include "stream2pretrain.serviceAccountName" . }}
      {{- include "stream2pretrain.imagePullSecrets" . | nindent 6 }}
      {{- include "stream2pretrain.podSecurityContext" . | nindent 6 }}
      {{- include "stream2pretrain.scheduling" . | nindent 6 }}
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: bytewax-hostfile
          image: busybox:1.36.1
          {{- include "stream2pretrain.containerSecurityContext" . | nindent 10 }}
          command:
            - sh
            - -ec
            - |
              : > /etc/bytewax/hostfile.txt
              index=0
              while [ "$index" -lt "{{ .Values.processor.curate.replicas }}" ]
              do
                echo "{{ $name }}-${index}.{{ $name }}.{{ .Release.Namespace }}.svc.cluster.local:9999" >> /etc/bytewax/hostfile.txt
                index=$((index + 1))
              done
          volumeMounts:
            - name: bytewax-hostfile
              mountPath: /etc/bytewax
      {{- if and .Values.processor.modelService.enabled (not $externalModels) }}
        - name: wait-model-service
          image: {{ include "stream2pretrain.image" (dict "ctx" . "image" .Values.processor.curate.image "tag" .Values.processor.curate.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "stream2pretrain.containerSecurityContext" . | nindent 10 }}
          command: ["python", "-c"]
          args:
            - |
              import time
              import urllib.request

              urls = [
                  "http://{{ printf "%s-processor-model-service-quality" (include "stream2pretrain.fullname" .) }}:{{ .Values.processor.modelService.port }}/readyz",
                  "http://{{ printf "%s-processor-model-service-kenlm" (include "stream2pretrain.fullname" .) }}:{{ .Values.processor.modelService.port }}/readyz",
              ]
              deadline = time.monotonic() + 900
              for url in urls:
                  while True:
                      try:
                          with urllib.request.urlopen(url, timeout=3) as response:
                              if response.status == 200:
                                  break
                      except Exception:
                          pass
                      if time.monotonic() >= deadline:
                          raise SystemExit(f"model service did not become ready: {url}")
                      time.sleep(5)
      {{- else }}
      {{- if .Values.processor.curate.modelBundle.bootstrap }}
        - name: model-bootstrap
          image: {{ include "stream2pretrain.image" (dict "ctx" . "image" .Values.processor.curate.image "tag" .Values.processor.curate.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "stream2pretrain.containerSecurityContext" . | nindent 10 }}
          command: ["python", "-m", "processor.model_bootstrap"]
          env:
            - name: S2P_MODELS_DIR
              value: {{ ternary "/models" "/opt/models" $externalModels | quote }}
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: KENLM_REVISION
              value: "3fbe35c83b1a39f420a345b7c96a186c8030d834"
            - name: FIGURE_CLASSIFIER_REVISION
              value: "f859dfbff5c9916cd996942d4b0db7fa25808220"
          resources:
            {{- toYaml .Values.processor.curate.modelBundle.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
      {{- end }}
      {{- end }}
      containers:
        - name: curate
          image: {{ include "stream2pretrain.image" (dict "ctx" . "image" .Values.processor.curate.image "tag" .Values.processor.curate.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "stream2pretrain.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: metrics
              containerPort: 9090
            - name: bytewax
              containerPort: 9999
          env:
            {{- include "stream2pretrain.commonEnv" . | nindent 12 }}
            - name: S2P_COMPONENT
              value: {{ $component | quote }}
            - name: S2P_PRETRAIN_MAX_WORK_AGE_SECONDS
              value: {{ .Values.processor.maxWorkAgeSeconds | int | quote }}
            - name: S2P_BYTEWAX_FLOW_NAME
              value: "s2p-curate-live-v5"
            - name: S2P_BYTEWAX_RECOVERY_NAME
              value: "curate-live-v5"
            - name: S2P_CHECKPOINT_DIR
              value: {{ ternary "/var/lib/s2p/state" "/var/lib/s2p/recovery" (gt (int .Values.processor.curate.replicas) 1) | quote }}
            - name: S2P_STATE_DIR
              value: {{ ternary "/var/lib/s2p/state" "/var/lib/s2p/recovery" (gt (int .Values.processor.curate.replicas) 1) | quote }}
            - name: S2P_CACHE_DIR
              value: {{ ternary "/var/lib/s2p/cache" "/var/lib/s2p/recovery" (gt (int .Values.processor.curate.replicas) 1) | quote }}
            - name: S2P_BYTEWAX_RECOVERY_ROOT
              value: /var/lib/s2p/recovery
            - name: BYTEWAX_WORKERS_PER_PROCESS
              value: {{ .Values.processor.curate.workersPerProcess | int | quote }}
            - name: BYTEWAX_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BYTEWAX_STATEFULSET_NAME
              value: {{ $name | quote }}
            - name: BYTEWAX_HOSTFILE_PATH
              value: /etc/bytewax/hostfile.txt
            - name: S2P_COORDINATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.coordination.databaseUrlSecret | quote }}
                  key: {{ .Values.coordination.databaseUrlKey | quote }}
                  optional: {{ eq (int .Values.processor.curate.replicas) 1 }}
            - name: S2P_BYTEWAX_RECOVERY_PARTITIONS
              value: {{ .Values.processor.curate.checkpoint.recoveryPartitions | int | quote }}
            - name: S2P_BYTEWAX_SNAPSHOT_SECONDS
              value: {{ .Values.processor.curate.checkpoint.snapshotSeconds | quote }}
            - name: S2P_BYTEWAX_SOURCE_BATCH_SIZE
              value: {{ .Values.processor.curate.sourceBatchSize | int | quote }}
            - name: S2P_CURATOR_DOCUMENT_BATCH_SIZE
              value: {{ .Values.processor.curate.sourceBatchSize | int | quote }}
            - name: S2P_MODELS_DIR
              value: {{ ternary "/models" "/opt/models" $externalModels | quote }}
            {{- if and .Values.processor.modelService.enabled (not $externalModels) }}
            - name: S2P_QUALITY_MODEL_SERVICE_URL
              value: {{ printf "http://%s-processor-model-service-quality:%d" (include "stream2pretrain.fullname" .) (int .Values.processor.modelService.port) | quote }}
            - name: S2P_QUALITY_MODEL_SERVICE_DISCOVERY_HOST
              value: {{ printf "%s-processor-model-service-quality-headless" (include "stream2pretrain.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
            - name: S2P_KENLM_MODEL_SERVICE_URL
              value: {{ printf "http://%s-processor-model-service-kenlm:%d" (include "stream2pretrain.fullname" .) (int .Values.processor.modelService.port) | quote }}
            - name: S2P_KENLM_MODEL_SERVICE_DISCOVERY_HOST
              value: {{ printf "%s-processor-model-service-kenlm-headless" (include "stream2pretrain.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
            {{- end }}
            - name: S2P_REQUIRE_REAL_MODELS
              value: {{ ternary "1" "0" .Values.processor.curate.requireRealModels | quote }}
            - name: S2P_SCORING_VERSION
              value: {{ .Values.processor.curate.scoringVersion | quote }}
            - name: S2P_DOCLING_ENABLED
              value: {{ ternary "1" "0" .Values.processor.curate.doclingEnabled | quote }}
            - name: S2P_USE_PRESIDIO
              value: {{ ternary "1" "0" .Values.processor.curate.usePresidio | quote }}
            - name: S2P_MINHASH_BANDS
              value: {{ .Values.processor.curate.minHashBands | quote }}
            - name: S2P_MINHASH_ROWS_PER_BAND
              value: {{ .Values.processor.curate.minHashRowsPerBand | quote }}
            - name: S2P_CONSUMER_GROUP
              value: s2p-curate
            - name: S2P_CURATOR_RETRY_TOPIC
              value: {{ .Values.redpanda.topics.rawFetched | quote }}
            - name: S2P_CURATOR_MAX_EXTRACTION_RETRIES
              value: "2"
            - name: S2P_CURATOR_CLASSIFIER_CONCURRENCY
              # Bounded requests share complete paper inference across replicas.
              value: "12"
            - name: S2P_CURATOR_CLASSIFIER_BATCH_SIZE
              value: {{ .Values.processor.curate.classifierBatchSize | int | quote }}
          startupProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 90
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.processor.curate.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/s2p/state
            - name: recovery
              mountPath: /var/lib/s2p/recovery
            - name: cache
              mountPath: /var/lib/s2p/cache
            - name: bytewax-hostfile
              mountPath: /etc/bytewax
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if $externalModels }}
            - name: models
              mountPath: /models
              readOnly: true
            {{- end }}
      volumes:
        - name: state
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: bytewax-hostfile
          emptyDir: {}
        - name: recovery
          persistentVolumeClaim:
            claimName: {{ $checkpointClaim | quote }}
        - name: tmp
          emptyDir: {}
        {{- if $externalModels }}
        - name: models
          emptyDir:
            sizeLimit: {{ printf "%dMi" (int .Values.processor.curate.modelBundle.sizeMi) | quote }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
    - name: bytewax
      port: 9999
      targetPort: bytewax
  selector:
    {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
