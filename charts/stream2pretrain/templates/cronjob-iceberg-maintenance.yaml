{{- if .Values.processor.iceberg.maintenance.enabled }}
{{- $component := "iceberg-maintenance" }}
{{- $root := . }}
{{- range .Values.processor.iceberg.maintenance.tables }}
{{- $table := .name }}
{{- $name := printf "%s-%s-%s" (include "stream2pretrain.fullname" $root) $component ($table | replace "_" "-") | trunc 52 | trimSuffix "-" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" $root "component" $component) | nindent 4 }}
    stream2pretrain.io/iceberg-table: {{ $table | quote }}
spec:
  schedule: {{ .schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 14400
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" $root "component" $component) | nindent 12 }}
            stream2pretrain.io/iceberg-table: {{ $table | quote }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "stream2pretrain.serviceAccountName" $root }}
          {{- include "stream2pretrain.imagePullSecrets" $root | nindent 10 }}
          {{- include "stream2pretrain.podSecurityContext" $root | nindent 10 }}
          {{- include "stream2pretrain.scheduling" $root | nindent 10 }}
          containers:
            - name: maintenance
              image: {{ include "stream2pretrain.image" (dict "ctx" $root "image" $root.Values.processor.iceberg.image) | quote }}
              imagePullPolicy: {{ $root.Values.image.pullPolicy }}
              command: ["s2p-entrypoint", "s2p-iceberg-maintenance"]
              args: ["--apply", "--table", {{ $table | quote }}]
              {{- include "stream2pretrain.containerSecurityContext" $root | nindent 14 }}
              env:
                {{- include "stream2pretrain.commonEnv" $root | nindent 16 }}
                - name: S2P_COMPONENT
                  value: {{ $component | quote }}
              resources:
                {{- toYaml $root.Values.processor.iceberg.maintenance.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
---
{{- end }}
{{- end }}
