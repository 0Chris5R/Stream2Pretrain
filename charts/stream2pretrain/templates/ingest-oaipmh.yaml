{{- if or .Values.sources.arxiv.enabled .Values.mixtureController.enabled }}
{{- $component := "ingest-oaipmh" }}
{{- $name := printf "%s-%s" (include "stream2pretrain.fullname" .) $component }}
{{- $stateClaim := default (printf "%s-ingest-state" (include "stream2pretrain.fullname" .)) .Values.ingest.state.existingClaim }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  # Template only. The SourceFeed controller owns the active per-source job.
  suspend: true
  schedule: {{ .Values.sources.arxiv.oaiPmh.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 12 }}
            stream2pretrain.io/egress-class: arxiv
        spec:
          serviceAccountName: {{ include "stream2pretrain.serviceAccountName" . }}
          restartPolicy: OnFailure
          {{- include "stream2pretrain.imagePullSecrets" . | nindent 10 }}
          {{- include "stream2pretrain.podSecurityContext" . | nindent 10 }}
          {{- include "stream2pretrain.scheduling" . | nindent 10 }}
          containers:
            - name: oaipmh
              image: {{ include "stream2pretrain.image" (dict "ctx" . "image" .Values.ingest.oaipmh.image) | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "-m", "ingest.oaipmh_poller.poller"]
              {{- include "stream2pretrain.containerSecurityContext" . | nindent 14 }}
              args:
                - --config
                - /etc/s2p/feeds/arxiv.json
              env:
                {{- include "stream2pretrain.commonEnv" . | nindent 16 }}
                - name: S2P_COMPONENT
                  value: {{ $component | quote }}
                - name: S2P_STATE_ROOT
                  value: /var/lib/s2p-state
                - name: S2P_OAI_MAX_PAGES_PER_RUN
                  value: {{ .Values.ingest.oaipmh.maxPagesPerRun | quote }}
              volumeMounts:
                - name: feeds
                  mountPath: /etc/s2p/feeds
                  readOnly: true
                {{- if eq .Values.ingest.state.backend "pvc" }}
                - name: state
                  mountPath: /var/lib/s2p-state
                {{- end }}
                - name: tmp
                  mountPath: /tmp
              resources:
                {{- toYaml .Values.ingest.oaipmh.resources | nindent 16 }}
          volumes:
            - name: feeds
              configMap:
                name: {{ include "stream2pretrain.fullname" . }}-feeds
            {{- if eq .Values.ingest.state.backend "pvc" }}
            - name: state
              persistentVolumeClaim:
                claimName: {{ $stateClaim | quote }}
            {{- end }}
            - name: tmp
              emptyDir: {}
{{- end }}
