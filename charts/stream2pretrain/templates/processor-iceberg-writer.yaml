{{- $component := "processor-iceberg-writer" }}
{{- $name := printf "%s-%s" (include "stream2pretrain.fullname" .) $component }}
{{- $checkpoint := .Values.processor.iceberg.checkpoint }}
{{- if ne (int .Values.processor.iceberg.replicas) 1 }}
{{- fail "processor.iceberg.replicas must be exactly 1 until Iceberg commit coordination is externalized" }}
{{- end }}
{{- $checkpointClaim := default (printf "%s-checkpoint" $name) $checkpoint.existingClaim }}
{{- if not $checkpoint.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $checkpointClaim }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with $checkpoint.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $checkpoint.size | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.processor.iceberg.replicas }}
  selector:
    matchLabels:
      {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: {{ include "stream2pretrain.serviceAccountName" . }}
      {{- include "stream2pretrain.imagePullSecrets" . | nindent 6 }}
      {{- include "stream2pretrain.podSecurityContext" . | nindent 6 }}
      {{- include "stream2pretrain.scheduling" . | nindent 6 }}
      containers:
        - name: iceberg-writer
          image: {{ include "stream2pretrain.image" (dict "ctx" . "image" .Values.processor.iceberg.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["s2p-entrypoint", "s2p-iceberg-writer"]
          {{- include "stream2pretrain.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: metrics
              containerPort: 9090
          env:
            {{- include "stream2pretrain.commonEnv" . | nindent 12 }}
            - name: S2P_COMPONENT
              value: {{ $component | quote }}
            - name: S2P_STATE_DIR
              value: /var/lib/s2p/checkpoint
            - name: S2P_BYTEWAX_FLOW_NAME
              value: "s2p-iceberg-writer-live-v2"
            - name: S2P_BYTEWAX_RECOVERY_NAME
              value: "iceberg-writer-live-v2"
            - name: S2P_BYTEWAX_RECOVERY_PARTITIONS
              value: {{ $checkpoint.recoveryPartitions | int | quote }}
            - name: S2P_BYTEWAX_SNAPSHOT_SECONDS
              value: {{ $checkpoint.snapshotSeconds | quote }}
            - name: S2P_BYTEWAX_SOURCE_BATCH_SIZE
              value: {{ .Values.processor.iceberg.sourceBatchSize | int | quote }}
            - name: S2P_FLUSH_INTERVAL_SECONDS
              value: {{ .Values.processor.iceberg.flushIntervalSeconds | quote }}
            - name: S2P_FLUSH_RECORDS
              value: {{ .Values.processor.iceberg.flushRecords | quote }}
            - name: S2P_ICEBERG_BRANCH_MAIN
              value: {{ .Values.iceberg.branches.main | quote }}
            - name: S2P_CONSUMER_GROUP
              value: s2p-iceberg-writer
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.processor.iceberg.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: checkpoint
              mountPath: /var/lib/s2p/checkpoint
      volumes:
        - name: tmp
          emptyDir: {}
        - name: checkpoint
          persistentVolumeClaim:
            claimName: {{ $checkpointClaim | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
  selector:
    {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
