{{- $component := "processor-iceberg-writer" }}
{{- $name := printf "%s-%s" (include "stream2pretrain.fullname" .) $component }}
{{- $checkpoint := .Values.processor.iceberg.checkpoint }}
{{- if and (gt (int .Values.processor.iceberg.replicas) 1) (ne $checkpoint.accessMode "ReadWriteMany") }}
{{- fail "processor.iceberg.checkpoint.accessMode must be ReadWriteMany for a distributed Bytewax execution" }}
{{- end }}
{{- $checkpointClaim := default (printf "%s-checkpoint" $name) $checkpoint.existingClaim }}
{{- if not $checkpoint.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $checkpointClaim }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  accessModes: [{{ $checkpoint.accessMode | quote }}]
  {{- with $checkpoint.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $checkpoint.size | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: {{ .Values.processor.iceberg.replicas }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: {{ include "stream2pretrain.serviceAccountName" . }}
      {{- include "stream2pretrain.imagePullSecrets" . | nindent 6 }}
      {{- include "stream2pretrain.podSecurityContext" . | nindent 6 }}
      {{- include "stream2pretrain.scheduling" . | nindent 6 }}
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: bytewax-hostfile
          image: busybox:1.36.1
          {{- include "stream2pretrain.containerSecurityContext" . | nindent 10 }}
          command:
            - sh
            - -ec
            - |
              : > /etc/bytewax/hostfile.txt
              index=0
              while [ "$index" -lt "{{ .Values.processor.iceberg.replicas }}" ]
              do
                echo "{{ $name }}-${index}.{{ $name }}.{{ .Release.Namespace }}.svc.cluster.local:9999" >> /etc/bytewax/hostfile.txt
                index=$((index + 1))
              done
          volumeMounts:
            - name: bytewax-hostfile
              mountPath: /etc/bytewax
      containers:
        - name: iceberg-writer
          image: {{ include "stream2pretrain.image" (dict "ctx" . "image" .Values.processor.iceberg.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["s2p-entrypoint", "s2p-iceberg-writer"]
          {{- include "stream2pretrain.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: metrics
              containerPort: 9090
            - name: bytewax
              containerPort: 9999
          env:
            {{- include "stream2pretrain.commonEnv" . | nindent 12 }}
            - name: S2P_COMPONENT
              value: {{ $component | quote }}
            - name: S2P_STATE_DIR
              value: /var/lib/s2p/state
            - name: S2P_BYTEWAX_RECOVERY_ROOT
              value: /var/lib/s2p/recovery
            - name: BYTEWAX_WORKERS_PER_PROCESS
              value: {{ .Values.processor.iceberg.workersPerProcess | int | quote }}
            - name: BYTEWAX_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BYTEWAX_STATEFULSET_NAME
              value: {{ $name | quote }}
            - name: BYTEWAX_HOSTFILE_PATH
              value: /etc/bytewax/hostfile.txt
            - name: S2P_BYTEWAX_FLOW_NAME
              value: "s2p-iceberg-writer-live-v3"
            - name: S2P_BYTEWAX_RECOVERY_NAME
              value: "iceberg-writer-live-v3"
            - name: S2P_BYTEWAX_RECOVERY_PARTITIONS
              value: {{ $checkpoint.recoveryPartitions | int | quote }}
            - name: S2P_BYTEWAX_SNAPSHOT_SECONDS
              value: {{ $checkpoint.snapshotSeconds | quote }}
            - name: S2P_BYTEWAX_SOURCE_BATCH_SIZE
              value: {{ .Values.processor.iceberg.sourceBatchSize | int | quote }}
            - name: S2P_FLUSH_INTERVAL_SECONDS
              value: {{ .Values.processor.iceberg.flushIntervalSeconds | quote }}
            - name: S2P_FLUSH_RECORDS
              value: {{ .Values.processor.iceberg.flushRecords | quote }}
            - name: S2P_ICEBERG_BRANCH_MAIN
              value: {{ .Values.iceberg.branches.main | quote }}
            - name: S2P_CONSUMER_GROUP
              value: s2p-iceberg-writer
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.processor.iceberg.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: state
              mountPath: /var/lib/s2p/state
            - name: recovery
              mountPath: /var/lib/s2p/recovery
            - name: bytewax-hostfile
              mountPath: /etc/bytewax
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: state
          emptyDir: {}
        - name: bytewax-hostfile
          emptyDir: {}
        - name: recovery
          persistentVolumeClaim:
            claimName: {{ $checkpointClaim | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
    - name: bytewax
      port: 9999
      targetPort: bytewax
  selector:
    {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
