{{- if .Values.gatekeeper.enabled }}
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: s2psourcefeedrequirements
  labels:
    {{- include "stream2pretrain.labels" . | nindent 4 }}
spec:
  crd:
    spec:
      names:
        kind: S2PSourceFeedRequirements
      validation:
        openAPIV3Schema:
          type: object
          properties:
            minPollIntervalSeconds:
              type: integer
            maxPollIntervalSeconds:
              type: integer
            allowedLicenses:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package s2psourcefeedrequirements

        violation[{"msg": msg}] {
          input.review.kind.kind == "SourceFeed"
          spec := input.review.object.spec
          not spec.licenseDefault
          msg := "SourceFeed.spec.licenseDefault is required"
        }

        violation[{"msg": msg}] {
          input.review.kind.kind == "SourceFeed"
          spec := input.review.object.spec
          input.parameters.minPollIntervalSeconds
          spec.pollIntervalSeconds < input.parameters.minPollIntervalSeconds
          msg := sprintf("SourceFeed.spec.pollIntervalSeconds=%d is below policy minimum %d",
            [spec.pollIntervalSeconds, input.parameters.minPollIntervalSeconds])
        }

        violation[{"msg": msg}] {
          input.review.kind.kind == "SourceFeed"
          spec := input.review.object.spec
          input.parameters.maxPollIntervalSeconds
          spec.pollIntervalSeconds > input.parameters.maxPollIntervalSeconds
          msg := sprintf("SourceFeed.spec.pollIntervalSeconds=%d exceeds policy maximum %d",
            [spec.pollIntervalSeconds, input.parameters.maxPollIntervalSeconds])
        }

        violation[{"msg": msg}] {
          input.review.kind.kind == "SourceFeed"
          spec := input.review.object.spec
          allowed := input.parameters.allowedLicenses
          count(allowed) > 0
          not contains_license(allowed, spec.licenseDefault)
          msg := sprintf("SourceFeed.spec.licenseDefault=%q is not in the policy allow-list",
            [spec.licenseDefault])
        }

        contains_license(list, lic) {
          list[_] == lic
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: S2PSourceFeedRequirements
metadata:
  name: stream2pretrain-sourcefeed-requirements
  labels:
    {{- include "stream2pretrain.labels" . | nindent 4 }}
spec:
  enforcementAction: {{ .Values.gatekeeper.enforcementAction }}
  match:
    kinds:
      - apiGroups: ["stream2pretrain.io"]
        kinds: ["SourceFeed"]
  parameters:
    minPollIntervalSeconds: {{ .Values.gatekeeper.minPollIntervalSeconds }}
    maxPollIntervalSeconds: {{ .Values.gatekeeper.maxPollIntervalSeconds }}
    allowedLicenses:
      - CC-BY-4.0
      - CC-BY-SA-4.0
      - CC-BY-3.0
      - CC-BY-SA-3.0
      - CC0-1.0
      - Apache-2.0
      - MIT
      - BSD-2-Clause
      - BSD-3-Clause
      - MPL-2.0
      - ISC
      - Unlicense
      - per-record
      # These sources are fetchable only for transformed post-training. The
      # downstream licence gate still excludes them from verbatim exports.
      - unknown
      - arxiv-non-exclusive-distribution
      - ODC-By-1.0
{{- end }}
