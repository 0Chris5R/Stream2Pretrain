{{- $component := "submit-api" }}
{{- $name := printf "%s-%s" (include "stream2pretrain.fullname" .) $component }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.ingest.submitApi.replicas }}
  selector:
    matchLabels:
      {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.ingest.submitApi.port | quote }}
    spec:
      serviceAccountName: {{ include "stream2pretrain.serviceAccountName" . }}
      {{- include "stream2pretrain.imagePullSecrets" . | nindent 6 }}
      {{- include "stream2pretrain.podSecurityContext" . | nindent 6 }}
      {{- include "stream2pretrain.scheduling" . | nindent 6 }}
      containers:
        - name: submit-api
          image: {{ include "stream2pretrain.image" (dict "ctx" . "image" .Values.ingest.submitApi.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "stream2pretrain.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.ingest.submitApi.port }}
          env:
            {{- include "stream2pretrain.commonEnv" . | nindent 12 }}
            - name: S2P_COMPONENT
              value: {{ $component | quote }}
            - name: S2P_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ingest.submitApi.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
{{- if .Values.ingest.submitApi.ingress.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.ingest.submitApi.ingress.host }}`)
      kind: Rule
      services:
        - name: {{ $name }}
          port: 80
  tls:
    secretName: {{ .Values.ingest.submitApi.ingress.tlsSecret | quote }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.ingest.submitApi.ingress.tlsSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  secretName: {{ .Values.ingest.submitApi.ingress.tlsSecret | quote }}
  dnsNames:
    - {{ .Values.ingest.submitApi.ingress.host | quote }}
  issuerRef:
    name: {{ default "letsencrypt-prod" .Values.ui.ingress.clusterIssuer | quote }}
    kind: ClusterIssuer
{{- end }}
