{{- if .Values.observability.serviceMonitor.enabled }}
{{- $fullName := include "stream2pretrain.fullname" . -}}
{{- range $component := list "ingest-github-events" "ingest-github-tarball-fetcher" "ingest-hf-cards" "processor-fetcher" "processor-curate" "processor-iceberg-writer" "decon-gate" "mixture-controller" "foundry" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $fullName }}-{{ $component }}
  namespace: {{ $.Values.observability.serviceMonitor.namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" $ "component" $component) | nindent 4 }}
    {{- with $.Values.observability.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ $.Release.Namespace }}
  selector:
    matchLabels:
      {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" $ "component" $component) | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ $.Values.observability.serviceMonitor.interval }}
      scrapeTimeout: {{ $.Values.observability.serviceMonitor.scrapeTimeout }}
      path: /metrics
{{- end }}
{{- end }}
