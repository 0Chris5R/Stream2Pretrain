{{- $state := .Values.ingest.state -}}
{{- if and (eq $state.backend "pvc") (not $state.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-ingest-state" (include "stream2pretrain.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" "ingest-state") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with $state.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $state.size | quote }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-ingest-cursor-leases" (include "stream2pretrain.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" "ingest-state") | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-ingest-cursor-leases" (include "stream2pretrain.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" "ingest-state") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-ingest-cursor-leases" (include "stream2pretrain.fullname" .) }}
subjects:
  - kind: ServiceAccount
    name: {{ include "stream2pretrain.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
