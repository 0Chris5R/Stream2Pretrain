{{- if .Values.processor.foundry.enabled }}
{{- $workerComponent := "foundry-worker" }}
{{- $apiComponent := "foundry-api" }}
{{- $workerName := printf "%s-%s" (include "stream2pretrain.fullname" .) $workerComponent }}
{{- $apiName := printf "%s-%s" (include "stream2pretrain.fullname" .) $apiComponent }}
{{- $serviceName := printf "%s-foundry" (include "stream2pretrain.fullname" .) }}
{{- $checkpoint := .Values.processor.foundry.state }}
{{- $checkpointClaim := default (printf "%s-checkpoint" $workerName) $checkpoint.existingClaim }}
{{- if and (gt (int .Values.processor.foundry.workerReplicas) 1) (ne $checkpoint.accessMode "ReadWriteMany") }}
{{- fail "processor.foundry.state.accessMode must be ReadWriteMany for a distributed Bytewax execution" }}
{{- end }}
{{- if not $checkpoint.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $checkpointClaim }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $workerComponent) | nindent 4 }}
spec:
  accessModes: [{{ $checkpoint.accessMode | quote }}]
  {{- with $checkpoint.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $checkpoint.size | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $workerName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $workerComponent) | nindent 4 }}
spec:
  serviceName: {{ $workerName }}
  replicas: {{ .Values.processor.foundry.workerReplicas }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $workerComponent) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $workerComponent) | nindent 8 }}
        stream2pretrain.io/egress-class: foundry-providers
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: {{ include "stream2pretrain.serviceAccountName" . }}
      {{- include "stream2pretrain.imagePullSecrets" . | nindent 6 }}
      {{- include "stream2pretrain.podSecurityContext" . | nindent 6 }}
      {{- include "stream2pretrain.scheduling" . | nindent 6 }}
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: bytewax-hostfile
          image: busybox:1.36.1
          {{- include "stream2pretrain.containerSecurityContext" . | nindent 10 }}
          command:
            - sh
            - -ec
            - |
              : > /etc/bytewax/hostfile.txt
              index=0
              while [ "$index" -lt "{{ .Values.processor.foundry.workerReplicas }}" ]
              do
                echo "{{ $workerName }}-${index}.{{ $workerName }}.{{ .Release.Namespace }}.svc.cluster.local:9999" >> /etc/bytewax/hostfile.txt
                index=$((index + 1))
              done
          volumeMounts:
            - name: bytewax-hostfile
              mountPath: /etc/bytewax
      containers:
        - name: worker
          image: {{ include "stream2pretrain.image" (dict "ctx" . "image" .Values.processor.foundry.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["s2p-entrypoint", "s2p-foundry"]
          {{- include "stream2pretrain.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: metrics
              containerPort: 9090
            - name: bytewax
              containerPort: 9999
          env:
            {{- include "stream2pretrain.commonEnv" . | nindent 12 }}
            - name: S2P_COMPONENT
              value: {{ $workerComponent | quote }}
            - name: S2P_CONSUMER_GROUP
              value: s2p-foundry
            - name: S2P_STATE_DIR
              value: /var/lib/s2p/state
            - name: S2P_FOUNDRY_STATE_DIR
              value: /var/lib/s2p/state
            - name: S2P_BYTEWAX_RECOVERY_ROOT
              value: /var/lib/s2p/recovery
            - name: S2P_BYTEWAX_RECOVERY_PARTITIONS
              value: {{ $checkpoint.recoveryPartitions | int | quote }}
            - name: S2P_BYTEWAX_SNAPSHOT_SECONDS
              value: {{ $checkpoint.snapshotSeconds | quote }}
            - name: BYTEWAX_WORKERS_PER_PROCESS
              value: {{ .Values.processor.foundry.workersPerProcess | int | quote }}
            - name: BYTEWAX_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BYTEWAX_STATEFULSET_NAME
              value: {{ $workerName | quote }}
            - name: BYTEWAX_HOSTFILE_PATH
              value: /etc/bytewax/hostfile.txt
            - name: S2P_COORDINATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.coordination.databaseUrlSecret | quote }}
                  key: {{ .Values.coordination.databaseUrlKey | quote }}
            - name: S2P_FOUNDRY_PROVIDER_MODE
              value: live
            - name: S2P_FOUNDRY_ENABLE_ORACLES
              value: {{ ternary "1" "0" .Values.processor.foundry.enableOracles | quote }}
            - name: S2P_FOUNDRY_ORACLE_RUNTIME
              value: kubernetes
            {{- if .Values.processor.foundry.oracleRuntimeClass }}
            - name: S2P_FOUNDRY_ORACLE_RUNTIME_CLASS
              value: {{ .Values.processor.foundry.oracleRuntimeClass | quote }}
            {{- end }}
            - name: S2P_FOUNDRY_DAILY_RUN_HOUR_UTC
              value: {{ .Values.processor.foundry.dailyRunHourUtc | quote }}
            - name: S2P_FOUNDRY_DAILY_RUN_MINUTE_UTC
              value: {{ .Values.processor.foundry.dailyRunMinuteUtc | quote }}
            - name: S2P_FOUNDRY_DAILY_NOT_BEFORE_UTC
              value: {{ .Values.processor.foundry.dailyNotBeforeUtc | quote }}
            - name: S2P_FOUNDRY_TASKS_PER_PAPER
              value: {{ .Values.processor.foundry.tasksPerPaper | quote }}
            - name: S2P_FOUNDRY_ACCEPTED_TASKS_PER_PAPER
              value: {{ .Values.processor.foundry.acceptedTasksPerPaper | quote }}
            - name: S2P_FOUNDRY_QUEUE_POLL_SECONDS
              value: {{ .Values.processor.foundry.queuePollSeconds | quote }}
            - name: S2P_FOUNDRY_ICEBERG_BATCH_SIZE
              value: {{ .Values.processor.foundry.icebergBatchSize | quote }}
            - name: S2P_FOUNDRY_ICEBERG_FLUSH_INTERVAL_SECONDS
              value: {{ .Values.processor.foundry.icebergFlushIntervalSeconds | quote }}
            - name: S2P_FOUNDRY_EVENTS_TABLE
              value: {{ .Values.iceberg.foundryEventsTable | quote }}
            - name: S2P_FOUNDRY_ARTIFACTS_TABLE
              value: {{ .Values.iceberg.posttrainArtifactsTable | quote }}
            - name: S2P_HETZNER_MODELS
              value: {{ join "," .Values.processor.foundry.hetznerModels | quote }}
            - name: HETZNER_INFERENCE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.processor.foundry.providerSecret | quote }}
                  key: {{ .Values.processor.foundry.hetznerKey | quote }}
            - name: S2P_FOUNDRY_SIGNING_KEY
              value: /var/run/secrets/stream2pretrain/foundry-signing/ed25519.key
            - name: S2P_FOUNDRY_SIGNING_CERT
              value: /var/run/secrets/stream2pretrain/foundry-signing/ed25519.crt
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.processor.foundry.workerResources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/s2p/state
            - name: recovery
              mountPath: /var/lib/s2p/recovery
            - name: bytewax-hostfile
              mountPath: /etc/bytewax
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: foundry-signing
              mountPath: /var/run/secrets/stream2pretrain/foundry-signing
              readOnly: true
      volumes:
        - name: state
          emptyDir: {}
        - name: recovery
          persistentVolumeClaim:
            claimName: {{ $checkpointClaim | quote }}
        - name: bytewax-hostfile
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: foundry-signing
          secret:
            secretName: {{ .Values.processor.foundry.signingKeySecret | quote }}
            items:
              - key: {{ .Values.processor.foundry.signingKeyKey | quote }}
                path: ed25519.key
              - key: {{ .Values.processor.foundry.signingCertKey | quote }}
                path: ed25519.crt
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $workerName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $workerComponent) | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
    - name: bytewax
      port: 9999
      targetPort: bytewax
  selector:
    {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $workerComponent) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $apiName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $apiComponent) | nindent 4 }}
spec:
  replicas: {{ .Values.processor.foundry.apiReplicas }}
  selector:
    matchLabels:
      {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $apiComponent) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $apiComponent) | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.processor.foundry.apiPort | quote }}
    spec:
      serviceAccountName: {{ include "stream2pretrain.serviceAccountName" . }}
      {{- include "stream2pretrain.imagePullSecrets" . | nindent 6 }}
      {{- include "stream2pretrain.podSecurityContext" . | nindent 6 }}
      {{- include "stream2pretrain.scheduling" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "stream2pretrain.image" (dict "ctx" . "image" .Values.processor.foundry.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["s2p-entrypoint", "s2p-foundry-api"]
          {{- include "stream2pretrain.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.processor.foundry.apiPort }}
          env:
            - name: S2P_ENV
              value: {{ .Values.profile | quote }}
            - name: LOG_LEVEL
              value: "INFO"
            - name: S2P_COMPONENT
              value: {{ $apiComponent | quote }}
            - name: S2P_BIND_HOST
              value: "::"
            - name: S2P_FOUNDRY_API_PORT
              value: {{ .Values.processor.foundry.apiPort | quote }}
            - name: S2P_FOUNDRY_STATE_DIR
              value: /var/lib/s2p/state
            - name: S2P_COORDINATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.coordination.databaseUrlSecret | quote }}
                  key: {{ .Values.coordination.databaseUrlKey | quote }}
            - name: S2P_FOUNDRY_DAILY_RUN_HOUR_UTC
              value: {{ .Values.processor.foundry.dailyRunHourUtc | quote }}
            - name: S2P_FOUNDRY_DAILY_RUN_MINUTE_UTC
              value: {{ .Values.processor.foundry.dailyRunMinuteUtc | quote }}
            - name: S2P_FOUNDRY_DAILY_NOT_BEFORE_UTC
              value: {{ .Values.processor.foundry.dailyNotBeforeUtc | quote }}
            - name: S2P_FOUNDRY_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.processor.foundry.providerSecret | quote }}
                  key: {{ .Values.processor.foundry.controlTokenKey | quote }}
            - name: MINIO_ENDPOINT
              value: {{ .Values.minio.endpoint | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.minio.region | quote }}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.credentialsSecret | quote }}
                  key: accessKey
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.credentialsSecret | quote }}
                  key: secretKey
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.processor.foundry.apiResources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/s2p/state
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" . "component" $apiComponent) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.processor.foundry.apiPort }}
      targetPort: http
  selector:
    {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" . "component" $apiComponent) | nindent 4 }}
{{- end }}
