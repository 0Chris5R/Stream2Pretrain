{{- if .Values.processor.modelService.enabled }}
{{- $root := . }}
{{- $curatorComponent := "processor-curate" }}
{{- range $profile, $service := .Values.processor.modelService.profiles }}
{{- $component := printf "processor-model-service-%s" $profile }}
{{- $name := printf "%s-%s" (include "stream2pretrain.fullname" $root) $component }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" $root "component" $component) | nindent 4 }}
spec:
  {{- if not $root.Values.processor.modelService.autoscaling.enabled }}
  replicas: {{ $root.Values.processor.modelService.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" $root "component" $component) | nindent 6 }}
  strategy:
    # Model images are several GiB and the DHBW cluster has no capacity for an
    # old and a new generation at once. These services are stateless, while
    # callers retry across the short replacement window.
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" $root "component" $component) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "stream2pretrain.serviceAccountName" $root }}
      {{- include "stream2pretrain.imagePullSecrets" $root | nindent 6 }}
      {{- include "stream2pretrain.podSecurityContext" $root | nindent 6 }}
      # Prefer spreading replicas without making an optional scale-out Pod
      # permanently unschedulable on a smaller three-node teaching cluster.
      # Curator separation is also preferred: its local-path PVC fixes it to
      # one node, so model placement must never prevent recovery of that state.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" $root "component" $component) | nindent 20 }}
                topologyKey: kubernetes.io/hostname
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "stream2pretrain.componentSelectorLabels" (dict "ctx" $root "component" $curatorComponent) | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 60
      containers:
        - name: model-service
          image: {{ include "stream2pretrain.image" (dict "ctx" $root "image" $service.image "tag" $service.tag) | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: ["python", "-m", "processor.model_service"]
          {{- include "stream2pretrain.containerSecurityContext" $root | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ $root.Values.processor.modelService.port }}
          env:
            {{- include "stream2pretrain.commonEnv" $root | nindent 12 }}
            - name: S2P_COMPONENT
              value: {{ $component | quote }}
            - name: S2P_MODEL_SERVICE_PROFILE
              value: {{ default $profile $service.runtimeProfile | quote }}
            - name: S2P_MODEL_SERVICE_PORT
              value: {{ $root.Values.processor.modelService.port | quote }}
            - name: S2P_MODEL_SERVICE_MAX_BATCH_ITEMS
              value: {{ $root.Values.processor.modelService.maxBatchItems | int | quote }}
            - name: S2P_FINEPDFS_EDU_REVISION
              value: "finepdfs-edu-v2@90ddef285f67230389057c14b2f6bbfeb70d40ea"
            - name: S2P_FINEWEB_EDU_REVISION
              value: "fineweb-edu@284663cbb2dabf9bda30d8f8cc49601251ee1631"
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 90
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml $service.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" $root "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $root.Values.processor.modelService.port }}
      targetPort: http
  selector:
    {{- include "stream2pretrain.componentServiceSelectorLabels" (dict "ctx" $root "component" $component) | nindent 4 }}
{{- if $root.Values.processor.modelService.autoscaling.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "stream2pretrain.componentLabels" (dict "ctx" $root "component" $component) | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ $name }}
  pollingInterval: {{ $root.Values.processor.modelService.autoscaling.pollingIntervalSeconds }}
  cooldownPeriod: {{ $root.Values.processor.modelService.autoscaling.cooldownPeriodSeconds }}
  minReplicaCount: {{ default $root.Values.processor.modelService.autoscaling.minReplicas $service.autoscaling.minReplicas }}
  maxReplicaCount: {{ default $root.Values.processor.modelService.autoscaling.maxReplicas $service.autoscaling.maxReplicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
  triggers:
    - type: prometheus
      metadata:
        serverAddress: {{ $root.Values.processor.modelService.autoscaling.prometheusServerAddress | quote }}
        metricName: {{ printf "s2p_model_demand_%s" $profile | quote }}
        threshold: "1"
        query: {{ printf "(sum(s2p_model_active_requests{profile=\"%s\"}) or vector(0)) + (sum(s2p_model_waiting_requests{profile=\"%s\"}) or vector(0))" $profile $profile | quote }}
{{- end }}
{{- end }}
{{- end }}
