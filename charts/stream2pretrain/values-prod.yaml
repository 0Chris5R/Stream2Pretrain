---
# Production enables security-sensitive behavior but intentionally does not
# invent capacity settings. Replica counts, resource requests, KEDA thresholds,
# storage sizes, retention, and partition counts remain needs-measurement on the
# target cluster and must be supplied in an operator-owned override.
profile: prod

image:
  pullPolicy: Always

networkPolicy:
  enabled: true
  defaultDeny: true

gatekeeper:
  enabled: true
  enforcementAction: deny
