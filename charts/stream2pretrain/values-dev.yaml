---
# Generic single-replica development profile. DHBW-specific endpoints and
# scheduling live in infra/helmfile-values/stream2pretrain.dev.yaml.
profile: dev

ingest:
  rss:
    replicas: 1
  oaipmh:
    replicas: 1
  sitemap:
    replicas: 1
  githubEvents:
    replicas: 1
  githubReleases:
    replicas: 1
  hf:
    replicas: 1

processor:
  fetcher:
    replicas: 1
  curate:
    replicas: 1
  iceberg:
    replicas: 1
  duckdbApi:
    replicas: 1
  deconGate:
    replicas: 1

mixtureController:
  replicas: 1

ui:
  replicas: 1
  ingress:
    enabled: false

keda:
  enabled: false

observability:
  tracing:
    otlpEndpoint: ""
    sampleRatio: 0.0
  logs:
    lokiEndpoint: ""
