# Stream2Pretrain values - canonical configuration for every component.
#
# Image building is out of scope for this chart; produce by CI. See the README
# for the expected image refs.

# -----------------------------------------------------------------------------
# Global / image
# -----------------------------------------------------------------------------
image:
  registry: ghcr.io
  # Set tag here to override the chart appVersion for every component.
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

commonLabels: {}
commonAnnotations: {}

# Cluster profile: dev or prod. Drives default partition counts and resource
# requests via the per-component overrides below.
profile: dev

# -----------------------------------------------------------------------------
# Service account / RBAC
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

# -----------------------------------------------------------------------------
# Redpanda connection (the bus is provisioned by the platform Helmfile, not
# this chart). Stream2Pretrain only needs the bootstrap servers + auth.
# -----------------------------------------------------------------------------
redpanda:
  bootstrapServers: redpanda.redpanda.svc.cluster.local:9093
  schemaRegistry: http://redpanda.redpanda.svc.cluster.local:8081
  startingOffset: beginning
  # Processor stages retain 64 KiB of record-framing headroom below this.
  maxMessageBytes: 2097152
  saslMechanism: ""
  authSecret: ""
  topics:
    rawFetched: raw.fetched
    smokeRaw: raw.smoke
    docsNormalized: docs.normalized
    docsCurated: docs.curated
    curationDecisions: curation.decisions
    licenseAdmissions: license.admissions
    deconAttest: decon.attest
    foundryJobs: foundry.jobs
    foundryEvents: foundry.events
    foundryArtifacts: foundry.artifacts

# -----------------------------------------------------------------------------
# MinIO / object storage
# -----------------------------------------------------------------------------
minio:
  endpoint: http://minio.minio.svc.cluster.local:9000
  region: us-east-1
  buckets:
    bronze: s2p-bronze
    silver: s2p-silver
    gold: s2p-gold
    decon: s2p-decon
    posttrain: s2p-posttrain
  credentialsSecret: stream2pretrain-minio

# -----------------------------------------------------------------------------
# Iceberg / Polaris REST catalog
# -----------------------------------------------------------------------------
iceberg:
  catalog: stream2pretrain
  namespace: gold
  goldTable: curated
  decisionsTable: curation_decisions
  licenseAdmissionsTable: license_admissions
  foundryEventsTable: foundry_events
  posttrainArtifactsTable: posttrain_artifacts
  polarisUrl: http://polaris.polaris.svc.cluster.local:8181/api/catalog
  # Polaris expects the Iceberg REST "warehouse" value to be the catalog name.
  # The physical object-store base location is configured on the Polaris catalog.
  warehouse: stream2pretrain
  accessDelegation: vended-credentials
  credentialSecret: stream2pretrain-polaris
  credentialKey: credential
  scopeKey: scope
  branches:
    main: main
    shadowA: shadow-a
    shadowB: shadow-b

# -----------------------------------------------------------------------------
# Network policies
# -----------------------------------------------------------------------------
networkPolicy:
  enabled: true
  defaultDeny: true
  # Egress allow-list per ingest component. Keep this in sync with SOURCES.md.
  egressAllow:
    arxiv:
      - export.arxiv.org
      - oaipmh.arxiv.org
      - rss.arxiv.org
      - arxiv.org
    github:
      - api.github.com
      - github.com
      - raw.githubusercontent.com
      - codeload.github.com
    huggingface:
      - huggingface.co
      - cdn-lfs.huggingface.co
    openreview:
      - api2.openreview.net
      - api.openreview.net
      - openreview.net
    blogs:
      - openai.com
      - deepmind.google
      - bair.berkeley.edu
      - blog.eleuther.ai
    foundry-providers:
      - inference.hetzner.com
  # Allow DNS to kube-dns.
  dnsNamespace: kube-system

# -----------------------------------------------------------------------------
# Source feed catalog (mirrors SOURCES.md). Every entry becomes either a
# CronJob (poll cadence > 5 min) or a Deployment (steady poll loop).
# -----------------------------------------------------------------------------
sources:
  arxiv:
    enabled: true
    oaiPmh:
      name: arxiv-oai-cs
      endpoint: https://oaipmh.arxiv.org/oai
      set: cs
      pollIntervalSeconds: 7200
      licenseDefault: per-record
      kind: cronjob
      schedule: "13 */2 * * *"
    rss:
      categories:
        - cs.CL
        - cs.LG
        - cs.AI
        - cs.CV
      pollIntervalSeconds: 7200
      kind: cronjob
      schedule: "27 */2 * * *"
      licenseDefault: per-record
    # Native arXiv full-paper-HTML fetcher (v0.2.0). Subscribes to
    # ``docs.normalized`` and walks every fresh arXiv id through
    # ``arxiv.org/html/<id>`` (with ``ar5iv.labs.arxiv.org`` as fallback).
    htmlFetcher:
      enabled: true
      feedName: arxiv-html-fetcher
      licenseDefault: per-record
      backfill:
        enabled: false
        schedule: "23 4 * * *"
        deadlineSeconds: 7200
        # When non-empty, mount this ConfigMap at /etc/s2p/backfill instead
        # of the chart's default empty placeholder. Operators populate it
        # with a single ``ids.txt`` key containing one arXiv id per line.
        configMap: ""
  github:
    enabled: true
    events:
      name: github-events
      pollIntervalSeconds: 60
      respectXPollInterval: true
      kind: deployment
      tokenSecret: stream2pretrain-github
      tokenSecretKey: token
      aiOrgFilter:
        - openai
        - anthropics
        - huggingface
        - google-deepmind
        - meta-llama
        - mistralai
        - allenai
        - eleutherai
        - bytewax
        - vllm-project
    releases:
      name: github-releases
      pollIntervalSeconds: 7200
      kind: cronjob
      schedule: "37 */2 * * *"
      tokenSecret: stream2pretrain-github
      tokenSecretKey: token
      repos:
        - huggingface/transformers
        - vllm-project/vllm
        - pytorch/pytorch
        - ggerganov/llama.cpp
        - karpathy/llm.c
        - unslothai/unsloth
        - meta-llama/llama
        - openai/whisper
        - anthropics/courses
        - apple/ml-tic-lm
        - mlfoundations/dclm
        - huggingface/datatrove
        - NVIDIA-NeMo/Curator
        - allenai/dolma
        - bytewax/bytewax
        - redpanda-data/redpanda
        - apache/iceberg
        - MaterializeInc/materialize
        - risingwavelabs/risingwave
        - pathwaycom/pathway
        - unclecode/crawl4ai
        - firecrawl/firecrawl
        - microsoft/onnxruntime
        - facebookresearch/llama-stack
        - openai/triton
        - google/gemma
        - mistralai/mistral-src
        - tinygrad/tinygrad
        - rwightman/pytorch-image-models
        - pytorch/torchtitan
  huggingface:
    enabled: true
    models:
      name: hf-models
      endpoint: https://huggingface.co/api/models
      pollIntervalSeconds: 600
      kind: deployment
      tokenSecret: stream2pretrain-hf
      tokenSecretKey: token
    dailyPapers:
      name: hf-daily-papers
      endpoint: https://huggingface.co/api/daily_papers
      pollIntervalSeconds: 21600
      kind: cronjob
      schedule: "47 */6 * * *"
      tokenSecret: stream2pretrain-hf
      tokenSecretKey: token
  blogs:
    enabled: true
    pollIntervalSeconds: 21600
    kind: cronjob
    schedule: "53 */6 * * *"
    feeds:
      - name: openai-news
        url: https://openai.com/news/rss.xml
      - name: deepmind
        url: https://deepmind.google/blog/rss.xml
      - name: hf-blog
        url: https://huggingface.co/blog/feed.xml
      - name: bair
        url: https://bair.berkeley.edu/blog/feed.xml
      - name: eleuther
        url: https://blog.eleuther.ai/index.xml
  sitemap:
    enabled: false
    name: sitemap-poller
    pollIntervalSeconds: 21600
    kind: cronjob
    schedule: "11 */6 * * *"
    feeds: []

# -----------------------------------------------------------------------------
# Ingest components
# -----------------------------------------------------------------------------
ingest:
  # Small durable cursor store shared by single-replica pollers. Payloads stay
  # in object storage; this PVC only contains ETags, seen ids, and OAI
  # resumption tokens. For multi-site production, replace it with an external
  # transactional cursor store instead of scaling this RWO volume.
  state:
    existingClaim: ""
    storageClass: ""
    size: 1Gi
  rss:
    image: stream2pretrain/ingest-rss
    replicas: 1
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}
  oaipmh:
    image: stream2pretrain/ingest-oaipmh
    replicas: 1
    # Finish and checkpoint at most this many complete OAI pages per CronJob.
    # This bounds ingress to downstream capacity without skipping the rest of
    # an OAI window; the next run resumes from the persisted token.
    maxPagesPerRun: 4
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 1, memory: 512Mi}
  sitemap:
    image: stream2pretrain/ingest-sitemap
    replicas: 1
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}
  githubEvents:
    image: stream2pretrain/ingest-github-events
    replicas: 1
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}
  githubReleases:
    image: stream2pretrain/ingest-github-releases
    replicas: 1
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}
  # arXiv full-paper-HTML fetcher (v0.2.0). Long-running Deployment that
  # subscribes to docs.normalized for arXiv ids and fetches the rendered
  # HTML body (with ar5iv as fallback). Toggle via
  # ``sources.arxiv.htmlFetcher.enabled``.
  arxivHtmlFetcher:
    image: stream2pretrain/ingest-arxiv-html
    replicas: 1
    # v2 begins at the live head. Historical paper ids are handled by the
    # explicit, bounded backfill CronJob instead of blocking fresh enrichment.
    consumerGroup: s2p-arxiv-html-fetcher-v2
    autoOffsetReset: latest
    # Bound how many ids one Deployment loop drains before yielding back
    # to KEDA. Empty / 0 means unlimited. Useful for testing on small
    # clusters; production should leave this 0.
    maxRecordsPerLoop: 0
    scaling:
      minReplicas: 0
      maxReplicas: 1
      # docs.normalized lag threshold; arXiv ids form a small fraction of
      # the topic, so keep this low. needs-measurement on the real cluster.
      lagThreshold: 200
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 1, memory: 768Mi}
  # GitHub release tarball fetcher (v0.2.0). Consumes raw.fetched events
  # emitted by the github_releases poller and downloads each release's
  # source tarball, emitting one CodeFileRecord per allow-listed file.
  githubTarballFetcher:
    enabled: true
    image: stream2pretrain/ingest-github-tarball-fetcher
    replicas: 1
    consumerGroup: s2p-github-tarball-fetcher
    # File extensions retained from the tarball (lowercase, leading dot).
    # Non-listed files are skipped silently. Tune via override.
    allowedExtensions:
      - .py
      - .pyx
      - .pyi
      - .c
      - .h
      - .cpp
      - .hpp
      - .cc
      - .cu
      - .rs
      - .go
      - .js
      - .ts
      - .tsx
      - .jsx
      - .java
      - .scala
      - .kt
      - .swift
      - .rb
      - .r
      - .jl
      - .md
      - .rst
      - .txt
      - .yaml
      - .yml
      - .toml
      - .json
    # 1 MiB default per-file ceiling. Files above this are skipped without
    # being read into memory.
    maxFileSizeBytes: 1048576
    # OSI permissive default. Repos whose GitHub License API SPDX id is not
    # in this list are skipped entirely (no tarball download, no records).
    allowedLicenses:
      - Apache-2.0
      - MIT
      - BSD-2-Clause
      - BSD-3-Clause
      - ISC
      - MPL-2.0
      - Unlicense
      - CC0-1.0
    # Per-pod GitHub REST budget. With burst=4 and rate=1.0 req/s the worst
    # case is ~3600 req/h per pod, comfortably under the 5000 req/h ceiling
    # while leaving headroom for the github_releases poller. Lag-driven
    # KEDA scaling assumes a single consumer group across replicas.
    requestRatePerSecond: 1.0
    requestBurst: 4
    keda:
      minReplicas: 0
      maxReplicas: 1
      # Prometheus-backed trigger avoids raw.fetched Kafka-lag self-amplification.
      # Threshold is a count of observed release records currently being processed
      # by tarball fetcher pods.
      threshold: "1"
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 1, memory: 1Gi}
  hf:
    image: stream2pretrain/ingest-hf
    replicas: 1
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}
  # OpenReview poller (v0.2.0). The same image runs both live and backfill
  # modes; the Helm template selects via container `command`.
  openreview:
    image: stream2pretrain/ingest-openreview
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}
    # Backfill streams a multi-GB HF dataset; size up the head room.
    backfillResources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {cpu: 1, memory: 2Gi}

# -----------------------------------------------------------------------------
# OpenReview poller (v0.2.0). Live CronJob polls api2.openreview.net every 6h;
# the backfill Job is a one-shot REVIEWARENA HF dataset bridge gated behind
# ``openreviewPoller.runBackfill = true`` so an operator opts in explicitly.
# -----------------------------------------------------------------------------
openreviewPoller:
  enabled: true
  # ICLR.cc/2026/Conference, NeurIPS.cc/2025/Conference, ICML.cc/2025/Conference,
  # COLM/2025/Conference. Which years are actually open at any given time is
  # ``needs-measurement``; the live module skips venues that return zero notes.
  venues:
    - ICLR.cc/2026/Conference
    - NeurIPS.cc/2025/Conference
    - ICML.cc/2025/Conference
    - COLM/2025/Conference
  # OpenReview supports anonymous listing once a venue's submissions are
  # public. Populate ``tokenSecret`` to unlock pre-release access.
  tokenSecret: ""
  tokenSecretKey: token
  live:
    schedule: "17 */6 * * *"
    activeDeadlineSeconds: 3600
    # Cursor PVC: holds the seen_note_ids JSON written by FeedStateStore.
    # Replaces the v0.2.0 emptyDir mount that defeated idempotency. The
    # default 1Gi accommodates a 20k-id seen-set per venue across the
    # configured venue list with comfortable headroom.
    state:
      storageClass: ""
      size: 1Gi
      existingClaim: ""
  runBackfill: false
  backfill:
    # Empty means: resolve the dataset id at runtime via the HF Hub search API
    # (see ingest/openreview_poller/backfill.py). Set explicitly to pin a
    # known revision once the operator has confirmed it.
    datasetId: ""
    # Optional smoke-scale limit. Empty means "no limit".
    maxRows: ""
    activeDeadlineSeconds: 21600

# -----------------------------------------------------------------------------
# Processor components
# -----------------------------------------------------------------------------
processor:
  fetcher:
    image: stream2pretrain/processor-fetcher
    # Full Docling requires its pinned model bundle. The bounded pypdf path is
    # the resilient default for this streaming worker.
    doclingEnabled: false
    # This stateless stage commits source offsets to Redpanda only after its
    # normalized output batch is delivered, so partitions can move safely
    # between replicas.
    replicas: 1
    commitBatchSize: 16
    commitIntervalSeconds: 2
    maxPollIntervalMs: 900000
    resources:
      # The extraction process owns the language detector plus Bytewax recovery
      # state. The former 1Gi limit was observed OOM-killing the process during
      # initialization; retain headroom while real peak RSS is measured.
      requests: {cpu: 200m, memory: 1Gi}
      limits: {cpu: 1, memory: 2Gi}
  curate:
    image: stream2pretrain/processor-curate
    replicas: 1
    requireRealModels: true
    doclingEnabled: true
    usePresidio: true
    resources:
      requests: {cpu: 1, memory: 4Gi}
      limits: {cpu: 2, memory: 8Gi}
    checkpoint:
      storageClass: ""
      size: 20Gi
    onnxModel: /models/fineweb-edu/model.onnx
    minHashBands: 14
    minHashRowsPerBand: 9
    # FineWeb-Edu ONNX model bundle. Downloaded by an init container into an
    # emptyDir mounted at /models. Set ``url`` empty to disable the init
    # container (e.g. when the model is baked into the curate image).
    modelBundle:
      bootstrap: true
      url: ""
      sha256: ""
      sizeMi: 10240
      image: ghcr.io/stream2pretrain/curl-jq:1.0.0
      resources:
        requests: {cpu: 500m, memory: 512Mi}
        limits: {cpu: 2, memory: 2Gi}
  iceberg:
    image: stream2pretrain/processor-iceberg-writer
    replicas: 1
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {cpu: 1, memory: 1Gi}
    flushIntervalSeconds: 60
    flushRecords: 5000
    checkpoint:
      existingClaim: ""
      storageClass: ""
      size: 2Gi
    maintenance:
      enabled: true
      schedule: "17 * * * *"
      snapshotRetentionHours: 168
      minSnapshotsToKeep: 10
      metadataVersions: 20
      orphanMinimumAgeHours: 24
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: 1, memory: 1Gi}
  duckdbApi:
    image: stream2pretrain/processor-duckdb-api
    replicas: 1
    apiPort: 8090
    goldRelation: gold
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 1, memory: 1Gi}
  deconGate:
    image: stream2pretrain/decon-gate
    replicas: 1
    apiPort: 8081
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}
    benchmarks:
      - mmlu
      - gsm8k
      - humaneval
      - math
      - gpqa
    bloomBits: 33
    bloomHashes: 7
    signingKeySecret: stream2pretrain-decon-signing
    signingKeyKey: ed25519.key
    signingCertKey: ed25519.crt
    benchmarkSetVersion: v2026-06-01
    benchmarkCorpus:
      configMap: stream2pretrain-decon-benchmarks
      secret: ""
      kind: restricted_reserve
      fileName: corpus.json
      mountPath: /etc/stream2pretrain/decon
  foundry:
    enabled: true
    image: stream2pretrain/processor-foundry
    replicas: 1
    apiPort: 8092
    dailyRunHourUtc: 0 # needs-measurement
    tasksPerPaper: 6
    acceptedTasksPerPaper: 3
    queuePollSeconds: 10
    enableOracles: false
    oracleRuntimeClass: ""
    providerSecret: stream2pretrain-foundry-providers
    controlTokenKey: controlToken
    hetznerKey: HETZNER_INFERENCE_API_KEY
    signingKeySecret: stream2pretrain-decon-signing
    signingKeyKey: ed25519.key
    signingCertKey: ed25519.crt
    hetznerModels:
      - Qwen3.8-27B
    state:
      storageClass: ""
      size: 5Gi # needs-measurement after the first cloud pilot
    workerResources:
      requests: {cpu: 250m, memory: 512Mi} # needs-measurement
      limits: {cpu: 1, memory: 2Gi} # needs-measurement
    apiResources:
      requests: {cpu: 50m, memory: 128Mi} # needs-measurement
      limits: {cpu: 500m, memory: 512Mi} # needs-measurement

# -----------------------------------------------------------------------------
# Mixture controller (kopf)
# -----------------------------------------------------------------------------
mixtureController:
  image: stream2pretrain/mixture-controller
  replicas: 1
  apiPort: 8080
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  reconcileIntervalSeconds: 30

# -----------------------------------------------------------------------------
# Seed loader (one-shot Bytewax Job; v0.2.0)
# -----------------------------------------------------------------------------
# Streams the 5-component HuggingFace seed mixture into docs.normalized as
# Silver records. Disabled by default - kick off explicitly via the helper
# script `scripts/seed_corpus.sh`. Honest scope notes live in
# processor/seed/README.md; the headline ones:
#   - HF cache PVC default is 50Gi. Full 5-component backfill needs 1-2 TiB,
#     so the demo cluster runs only a selected subset via --components=...
#   - peS2o v3 token count and FineWeb-Edu domain-filter yield are
#     `needs-measurement` per docs/research-seed-corpus.md.
seedLoader:
  enabled: false
  image: stream2pretrain/processor-seed-loader
  # `inProcess` runs the synchronous fallback (no Bytewax workers) which is
  # the right shape for a one-shot Job on the dev cluster. Flip to false
  # only when scaling to multiple worker Pods is wanted.
  inProcess: true
  dryRun: false
  # Components to ingest, in priority order. Override on the helm CLI:
  #   --set seedLoader.components={pes2o,stack-edu}
  components:
    - pes2o
    - redpajama-arxiv
    - fineweb-edu
    - stack-edu
    - wayback
  maxDocsPerComponent: 0  # 0 means unlimited; set to N for smoke runs
  waybackMonths: 24
  stateBucket: s2p-state
  runId: ""  # filled in by scripts/seed_corpus.sh; templates default to now
  activeDeadlineSeconds: 86400
  hfTokenSecret: stream2pretrain-hf
  hfTokenSecretKey: token
  hf_cache_pvc:
    existingClaim: ""
    storageClass: ""
    size: 50Gi
  resources:
    requests: {cpu: 500m, memory: 2Gi}
    limits: {cpu: 2, memory: 6Gi}
  # FineWeb-Edu URL allowlist - hostnames matched as exact-host or suffix
  # (so `magazine.sebastianraschka.com` matches `sebastianraschka.com`).
  fineweb_url_allowlist:
    - arxiv.org
    - openai.com
    - deepmind.google
    - anthropic.com
    - ai.meta.com
    - huggingface.co
    - distill.pub
    - eleuther.ai
    - bair.berkeley.edu
    - lilianweng.github.io
    - sebastianraschka.com
    - magazine.sebastianraschka.com
    - jalammar.github.io
    - karpathy.ai
    - pytorch.org
    - tensorflow.org
    - pytorch-lightning.readthedocs.io

# -----------------------------------------------------------------------------
# UI (Next.js 14)
# -----------------------------------------------------------------------------
ui:
  image: stream2pretrain/ui
  replicas: 2
  port: 3000
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  ingress:
    enabled: true
    host: stream2pretrain.local
    ingressClassName: traefik
    tlsSecret: ""
  env:
    duckdbCacheSeconds: 30

# -----------------------------------------------------------------------------
# KEDA scaling
# -----------------------------------------------------------------------------
keda:
  # Fetcher lag is broker-visible and safe for partition-based autoscaling.
  # Curate and Iceberg remain stateful Bytewax single writers until their
  # state is moved behind an externally coordinated boundary.
  enabled: false
  pollingInterval: 15
  cooldownPeriod: 60
  prometheus:
    serverAddress: http://kps-prometheus.monitoring.svc:9090
  fetcher:
    minReplicas: 1
    maxReplicas: 4
    lagThreshold: 250
  triggerAuthSecret: stream2pretrain-keda-redpanda
  # Set ``auth.enabled: true`` only when the Redpanda profile actually has
  # SASL/TLS turned on and the secret named by ``triggerAuthSecret`` exists
  # with keys (sasl, tls, username, password).
  auth:
    enabled: false

# -----------------------------------------------------------------------------
# Observability
# -----------------------------------------------------------------------------
observability:
  prometheus:
    serverAddress: http://kps-prometheus.monitoring.svc:9090
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 30s
    scrapeTimeout: 10s
    labels:
      release: kube-prometheus-stack
  prometheusRule:
    enabled: true
    namespace: monitoring
    labels:
      release: kube-prometheus-stack
  grafana:
    dashboards:
      enabled: true
      labels:
        grafana_dashboard: "1"
      namespace: monitoring
  tracing:
    # Empty endpoints disable exporters. Do not retry against optional services
    # that are not part of the baseline deployment.
    otlpEndpoint: ""
    sampleRatio: 0.0
  logs:
    lokiEndpoint: ""

# -----------------------------------------------------------------------------
# OPA Gatekeeper constraints
# -----------------------------------------------------------------------------
gatekeeper:
  enabled: false
  enforcementAction: deny
  minPollIntervalSeconds: 30
  maxPollIntervalSeconds: 86400

# -----------------------------------------------------------------------------
# CRDs (toggle for cases where the platform installs them out-of-band)
# -----------------------------------------------------------------------------
crds:
  install: true

# -----------------------------------------------------------------------------
# Pod security defaults
# -----------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -----------------------------------------------------------------------------
# Affinity / scheduling defaults
# -----------------------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
