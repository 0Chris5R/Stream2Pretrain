# Stream2Pretrain values - canonical configuration for every component.
#
# Image building is out of scope for this chart; produce by CI. See the README
# for the expected image refs.

# -----------------------------------------------------------------------------
# Global / image
# -----------------------------------------------------------------------------
image:
  registry: ghcr.io
  # Set tag here to override the chart appVersion for every component.
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

commonLabels: {}
commonAnnotations: {}

# Cluster profile: dev or prod. Drives default partition counts and resource
# requests via the per-component overrides below.
profile: dev

# -----------------------------------------------------------------------------
# Service account / RBAC
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

# -----------------------------------------------------------------------------
# Redpanda connection (the bus is provisioned by the platform Helmfile, not
# this chart). Stream2Pretrain only needs the bootstrap servers + auth.
# -----------------------------------------------------------------------------
redpanda:
  bootstrapServers: redpanda.redpanda.svc.cluster.local:9093
  schemaRegistry: http://redpanda.redpanda.svc.cluster.local:8081
  # OFFSET_STORED imports an existing native-consumer group position on the
  # first Bytewax execution and falls back to earliest for a clean cluster.
  # Subsequent restarts resume from the Bytewax recovery database.
  startingOffset: stored
  # Processor stages retain 64 KiB of record-framing headroom below this.
  maxMessageBytes: 2097152
  saslMechanism: ""
  authSecret: ""
  topics:
    rawFetched: raw.fetched
    smokeRaw: raw.smoke
    docsNormalized: docs.normalized
    docsNormalizedSmoke: docs.normalized.smoke
    docsCurated: docs.curated
    docsCuratedSmoke: docs.curated.smoke
    curationDecisions: curation.decisions
    curationDecisionsSmoke: curation.decisions.smoke
    licenseAdmissions: license.admissions
    licenseAdmissionsSmoke: license.admissions.smoke
    foundryJobs: foundry.jobs
    foundryEvents: foundry.events
    foundryArtifacts: foundry.artifacts

# -----------------------------------------------------------------------------
# MinIO / object storage
# -----------------------------------------------------------------------------
minio:
  endpoint: http://minio.minio.svc.cluster.local:9000
  region: us-east-1
  # Source bodies and structured scientific artifacts are transient audit and
  # replay material. Gold corpus rows, Foundry packages, and state are exempt.
  transientRetentionDays: 1
  buckets:
    bronze: s2p-bronze
    silver: s2p-silver
    gold: s2p-gold
    posttrain: s2p-posttrain
    state: s2p-state
  credentialsSecret: stream2pretrain-minio

# -----------------------------------------------------------------------------
# Iceberg / Polaris REST catalog
# -----------------------------------------------------------------------------
iceberg:
  catalog: stream2pretrain
  namespace: gold
  goldTable: curated
  decisionsTable: curation_decisions
  licenseAdmissionsTable: license_admissions
  foundryEventsTable: foundry_events
  posttrainArtifactsTable: posttrain_artifacts
  polarisUrl: http://polaris.polaris.svc.cluster.local:8181/api/catalog
  # Polaris expects the Iceberg REST "warehouse" value to be the catalog name.
  # The physical object-store base location is configured on the Polaris catalog.
  warehouse: stream2pretrain
  accessDelegation: vended-credentials
  credentialSecret: stream2pretrain-polaris
  credentialKey: credential
  scopeKey: scope
  branches:
    main: main
    shadowA: shadow-a
    shadowB: shadow-b

# -----------------------------------------------------------------------------
# Network policies
# -----------------------------------------------------------------------------
networkPolicy:
  enabled: true
  defaultDeny: true
  # Egress allow-list per ingest component. Keep this in sync with SOURCES.md.
  egressAllow:
    arxiv:
      - export.arxiv.org
      - oaipmh.arxiv.org
      - rss.arxiv.org
      - arxiv.org
    huggingface:
      - huggingface.co
      - cdn-lfs.huggingface.co
    foundry-providers:
      - inference.hetzner.com
  # Allow DNS to kube-dns.
  dnsNamespace: kube-system

# -----------------------------------------------------------------------------
# Source feed catalog (mirrors SOURCES.md). Every entry becomes either a
# CronJob (poll cadence > 5 min) or a Deployment (steady poll loop).
# -----------------------------------------------------------------------------
sources:
  arxiv:
    enabled: true
    oaiPmh:
      name: oai-arxiv-cs
      endpoint: https://oaipmh.arxiv.org/oai
      set: cs
      pollIntervalSeconds: 7200
      licenseDefault: per-record
      kind: cronjob
      schedule: "13 */2 * * *"
    rss:
      categories:
        - cs.CL
        - cs.LG
        - cs.AI
        - cs.CV
      pollIntervalSeconds: 7200
      kind: cronjob
      schedule: "27 */2 * * *"
      licenseDefault: per-record
    # Native arXiv full-paper-HTML fetcher (v0.2.0). Subscribes to arXiv
    # discovery envelopes on ``raw.fetched`` and walks every fresh id through
    # ``arxiv.org/html/<id>`` (with ``ar5iv.labs.arxiv.org`` as fallback).
    htmlFetcher:
      enabled: true
      feedName: arxiv-html-fetcher
  huggingface:
    enabled: true
    models:
      name: hf-models
      endpoint: https://huggingface.co/api/models
      pollIntervalSeconds: 600
      kind: deployment
      tokenSecret: stream2pretrain-hf
      tokenSecretKey: token
    datasets:
      name: hf-datasets
      endpoint: https://huggingface.co/api/datasets
      pollIntervalSeconds: 600
      kind: deployment
      tokenSecret: stream2pretrain-hf
      tokenSecretKey: token
# -----------------------------------------------------------------------------
# Ingest components
# -----------------------------------------------------------------------------
ingest:
  # Poller cursors are tiny JSON objects in MinIO. Object storage keeps them
  # durable without pinning unrelated CronJobs and Deployments to the node
  # holding one ReadWriteOnce volume. The PVC backend remains an explicit
  # compatibility option for installations without S3-compatible storage.
  state:
    backend: s3
    prefix: ingest-cursors
    existingClaim: ""
    storageClass: ""
    size: 1Gi
  rss:
    image: stream2pretrain/ingest-rss
    replicas: 1
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}
  oaipmh:
    image: stream2pretrain/ingest-oaipmh
    replicas: 1
    # Finish and checkpoint at most this many complete OAI pages per CronJob.
    # This bounds ingress to downstream capacity without skipping the rest of
    # an OAI window; the next run resumes from the persisted token.
    maxPagesPerRun: 4
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 1, memory: 512Mi}
  # arXiv full-paper-HTML fetcher (v0.2.0). Long-running Deployment that
  # subscribes to raw.fetched for arXiv ids and fetches the rendered
  # HTML body (with ar5iv as fallback). Toggle via
  # ``sources.arxiv.htmlFetcher.enabled``.
  arxivHtmlFetcher:
    image: stream2pretrain/ingest-arxiv-html
    replicas: 1
    # The durable group starts at earliest on a clean cluster so every retained
    # discovery is handled. The one-time 2026-08-25 frontier reset deliberately
    # discards older queued ids; there is no historical backfill workload.
    consumerGroup: s2p-arxiv-html-fetcher-v2
    autoOffsetReset: earliest
    # Optional bounded drain for explicit diagnostics. Production is unlimited.
    maxRecordsPerLoop: 0
    # The shared raw.fetched topic also carries this worker's output, so its
    # Kafka lag is not a valid autoscaling signal. Keep one fixed replica until
    # a source-specific Prometheus backlog metric is implemented.
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 1, memory: 768Mi}
  hf:
    image: stream2pretrain/ingest-hf
    replicas: 1
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}
# -----------------------------------------------------------------------------
# Processor components
# -----------------------------------------------------------------------------
processor:
  fetcher:
    image: stream2pretrain/processor-fetcher-model
    # Expensive extraction must publish and checkpoint continuously instead of
    # inheriting Bytewax's 1,000-record-per-partition connector default.
    sourceBatchSize: 1
    # Production workers use the immutable fetcher model profile. It contains
    # only Docling and figure-classification artifacts and fails startup when
    # a real extraction dependency is missing.
    requireRealModels: true
    doclingEnabled: true
    # Match the fetcher's exact expanded-object ceiling. Larger PDFs receive a
    # durable record-local failure instead of crash-looping the Bytewax flow.
    doclingMaxBytes: 67108864
    # Temporary parent-enforced process deadline. The rollout observed valid
    # Docling returns through 203.95s, so 240s replaces the unsafe 180s
    # cooperative thread timeout. Tune from the emitted cloud percentile only.
    pdfHardTimeoutSeconds: 240
    # Emergency capacity switch only. False durably defers PDF records before
    # MinIO reads while every non-PDF source continues through the full path.
    # Keep true in the portable chart; deployment overrides must explain why.
    pdfProcessingEnabled: true
    # Bytewax owns source progress in a durable recovery database. Scale this
    # as one coordinated execution, never with independent Kafka-lag replicas.
    replicas: 1
    checkpoint:
      existingClaim: ""
      storageClass: ""
      size: 2Gi
      recoveryPartitions: 4
      snapshotSeconds: 1
    # A multi-minute production PDF must not starve the bounded deployment
    # health check. This fixed worker runs the identical normalization image
    # against the 24-hour canary topic but is not production capacity.
    canary:
      enabled: true
      replicas: 1
      consumerGroup: s2p-fetcher-canary
      checkpoint:
        existingClaim: ""
        storageClass: ""
        size: 1Gi
        recoveryPartitions: 1
        snapshotSeconds: 1
      resources:
        requests: {cpu: 100m, memory: 512Mi}
        limits: {cpu: 1, memory: 2Gi}
    resources:
      # The extraction process owns the language detector and document tools.
      # The former 1Gi limit was observed OOM-killing the process during
      # initialization; retain headroom while real peak RSS is measured.
      requests: {cpu: 200m, memory: 1Gi}
      limits: {cpu: 1, memory: 2Gi}
  curate:
    # Durable deduplication remains in this lightweight stateful worker. Large
    # immutable classifiers are isolated behind modelService so the local RWO
    # checkpoint never pins multi-GB model memory or image layers to one node.
    image: stream2pretrain/processor
    scoringVersion: pretrain-content-v3
    # Bytewax exposes the Kafka connector's bounded runtime batch directly to
    # the curator. Twelve one-segment documents produce six two-item requests,
    # filling the measured six-Pod FinePDFs lane while final decisions and LSH
    # observations remain serial.
    sourceBatchSize: 12
    replicas: 1
    requireRealModels: true
    doclingEnabled: false
    usePresidio: true
    # Two segments per RPC keeps request overhead bounded while the six-way
    # curator pool can distribute independent batches across all ready model
    # replicas. Increase only after the documented memory/latency benchmark.
    classifierBatchSize: 2
    resources:
      # The retained deduplication/recovery state was measured at about 1.8 GiB
      # before Python and request buffers. A 2 GiB ceiling OOM-killed the live
      # curator, so reserve its steady-state footprint and retain growth room.
      requests: {cpu: 500m, memory: 2Gi}
      limits: {cpu: 2, memory: 6Gi}
    checkpoint:
      storageClass: ""
      size: 20Gi
      recoveryPartitions: 4
      snapshotSeconds: 1
    minHashBands: 14
    minHashRowsPerBand: 9
    # Immutable component-specific images are the default. Bootstrap or URL
    # remains an explicit escape hatch for a private external model bundle.
    modelBundle:
      bootstrap: false
      sizeMi: 10240
      resources:
        requests: {cpu: 500m, memory: 512Mi}
        limits: {cpu: 2, memory: 2Gi}
  modelService:
    enabled: true
    replicas: 1
    port: 8094
    maxBatchItems: 2
    # Each real-model family has an independent image and runtime boundary.
    # This avoids a monolithic multi-GB image/process and lets Kubernetes
    # schedule or scale the resources each backend actually consumes.
    profiles:
      # FinePDFs is the sole learned document-quality model.
      finepdfs:
        runtimeProfile: finepdfs
        image: stream2pretrain/processor-quality-model
        autoscaling:
          minReplicas: 2
          # The measured three-Pod ceiling processed only about half of the
          # live normalized arrival rate. FinePDFs is stateless, so let KEDA
          # use the remaining cluster capacity without changing any score or
          # curation gate.
          maxReplicas: 6
        resources:
          requests: {cpu: 1, memory: 1Gi}
          limits: {cpu: 2, memory: 3Gi}
      kenlm:
        runtimeProfile: kenlm
        image: stream2pretrain/processor-kenlm-model
        autoscaling:
          minReplicas: 1
          maxReplicas: 3
        resources:
          requests: {cpu: 500m, memory: 1Gi}
          limits: {cpu: 2, memory: 3Gi}
      # Experimental only: these public models write independent shadow
      # scores and never change pretraining or post-training admission.
      shadow:
        enabled: false
        runtimeProfile: shadow
        image: stream2pretrain/processor-shadow-model
        autoscaling:
          minReplicas: 1
          maxReplicas: 1
        resources:
          requests: {cpu: 100m, memory: 2Gi}
          limits: {cpu: 1, memory: 5Gi}
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      pollingIntervalSeconds: 15
      cooldownPeriodSeconds: 300
      prometheusServerAddress: http://kps-prometheus.monitoring.svc.cluster.local:9090
  shadowClassifier:
    enabled: false
    image: stream2pretrain/processor
    replicas: 1
    modelTimeoutSeconds: 900
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 1Gi}
    checkpoint:
      storageClass: ""
      size: 1Gi
      recoveryPartitions: 1
      snapshotSeconds: 1
  iceberg:
    image: stream2pretrain/processor-iceberg-writer
    sourceBatchSize: 1
    replicas: 1
    resources:
      # PyIceberg must hold table metadata, Arrow buffers, and both durable
      # input frontiers while draining after a restart. The previous 1 GiB
      # ceiling was measured OOM-killing the writer during recovery.
      requests: {cpu: 200m, memory: 1Gi}
      limits: {cpu: 2, memory: 4Gi}
    flushIntervalSeconds: 60
    flushRecords: 5000
    checkpoint:
      existingClaim: ""
      storageClass: ""
      size: 2Gi
      # This single coordinated writer has one retained Bytewax recovery
      # partition. Kafka topic partitioning is independent of this state-shard
      # count, so expanding it would invalidate the durable cloud checkpoint.
      recoveryPartitions: 1
      snapshotSeconds: 1
    maintenance:
      enabled: true
      schedule: "17 * * * *"
      snapshotRetentionHours: 168
      minSnapshotsToKeep: 10
      metadataVersions: 20
      orphanMinimumAgeHours: 24
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: 1, memory: 1Gi}
  duckdbApi:
    image: stream2pretrain/processor-duckdb-api
    replicas: 1
    apiPort: 8090
    goldRelation: gold
    activeScoringVersion: pretrain-content-v3
    # Bound catalog staleness while avoiding one Polaris metadata reload for
    # every aggregate in a single dashboard request.
    catalogRefreshSeconds: 30
    # DuckDB otherwise assumes most host memory is available and Kubernetes
    # kills the API during whole-table sorts. Spill bounded scans to emptyDir.
    memoryLimit: 512MB
    threads: 1
    maxTempDirectorySize: 3GB
    tempStorageSizeLimit: 4Gi
    # Kafka-backed current-state read model. Iceberg remains authoritative;
    # this retained index prevents interactive pages from scanning history.
    servingIndex:
      existingClaim: ""
      storageClass: local-path
      size: 10Gi
      batchSize: 250
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {cpu: 1, memory: 1Gi}
  foundry:
    enabled: true
    image: stream2pretrain/processor-foundry
    replicas: 1
    apiPort: 8092
    dailyRunHourUtc: 8
    dailyRunMinuteUtc: 30 # 10:30 Europe/Berlin while CEST is active
    dailyNotBeforeUtc: "2026-08-28T08:30:00Z"
    tasksPerPaper: 6
    acceptedTasksPerPaper: 3
    queuePollSeconds: 10
    enableOracles: false
    oracleRuntimeClass: ""
    providerSecret: stream2pretrain-foundry-providers
    controlTokenKey: controlToken
    hetznerKey: HETZNER_INFERENCE_API_KEY
    signingKeySecret: stream2pretrain-foundry-signing
    signingKeyKey: ed25519.key
    signingCertKey: ed25519.crt
    hetznerModels:
      - Qwen3.8-27B
    state:
      storageClass: ""
      size: 5Gi # needs-measurement after the first cloud pilot
    workerResources:
      requests: {cpu: 250m, memory: 512Mi} # needs-measurement
      limits: {cpu: 1, memory: 2Gi} # needs-measurement
    apiResources:
      requests: {cpu: 50m, memory: 128Mi} # needs-measurement
      limits: {cpu: 500m, memory: 512Mi} # needs-measurement

# -----------------------------------------------------------------------------
# Mixture controller (kopf)
# -----------------------------------------------------------------------------
mixtureController:
  image: stream2pretrain/mixture-controller
  replicas: 1
  apiPort: 8080
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  reconcileIntervalSeconds: 30

# -----------------------------------------------------------------------------
# Seed loader (one-shot Bytewax Job; v0.2.0)
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# UI (Next.js 14)
# -----------------------------------------------------------------------------
ui:
  image: stream2pretrain/ui
  replicas: 2
  port: 3000
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  ingress:
    enabled: true
    host: stream2pretrain.local
    ingressClassName: traefik
    tlsSecret: ""
# -----------------------------------------------------------------------------
# KEDA scaling
# -----------------------------------------------------------------------------
keda:
  # Core Bytewax fetcher and curator progress is not represented by Kafka
  # consumer-group commits and is intentionally excluded from Kafka-lag KEDA.
  # KEDA remains available to independently committing ingest/model workers.
  enabled: false
  pollingInterval: 15
  cooldownPeriod: 60
  prometheus:
    serverAddress: http://kps-prometheus.monitoring.svc:9090
  triggerAuthSecret: stream2pretrain-keda-redpanda
  # Set ``auth.enabled: true`` only when the Redpanda profile actually has
  # SASL/TLS turned on and the secret named by ``triggerAuthSecret`` exists
  # with keys (sasl, tls, username, password).
  auth:
    enabled: false

# -----------------------------------------------------------------------------
# Observability
# -----------------------------------------------------------------------------
observability:
  prometheus:
    serverAddress: http://kps-prometheus.monitoring.svc:9090
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 30s
    scrapeTimeout: 10s
    labels:
      release: kube-prometheus-stack
  prometheusRule:
    enabled: true
    namespace: monitoring
    labels:
      release: kube-prometheus-stack
  grafana:
    dashboards:
      enabled: true
      labels:
        grafana_dashboard: "1"
      namespace: monitoring
  tracing:
    # Empty endpoints disable exporters. Do not retry against optional services
    # that are not part of the baseline deployment.
    otlpEndpoint: ""
    sampleRatio: 0.0
  logs:
    lokiEndpoint: ""

# -----------------------------------------------------------------------------
# OPA Gatekeeper constraints
# -----------------------------------------------------------------------------
gatekeeper:
  enabled: false
  enforcementAction: deny
  minPollIntervalSeconds: 30
  maxPollIntervalSeconds: 86400

# -----------------------------------------------------------------------------
# CRDs (toggle for cases where the platform installs them out-of-band)
# -----------------------------------------------------------------------------
crds:
  install: true

# -----------------------------------------------------------------------------
# Pod security defaults
# -----------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -----------------------------------------------------------------------------
# Affinity / scheduling defaults
# -----------------------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
