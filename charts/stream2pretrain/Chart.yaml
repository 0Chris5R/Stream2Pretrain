apiVersion: v2
name: stream2pretrain
description: |
  Stream2Pretrain - streaming-first LLM pretraining data curator on Kubernetes.
  Bundles every Stream2Pretrain Deployment, StatefulSet, CronJob, CRD, KEDA
  ScaledObject, NetworkPolicy, ServiceMonitor, and Grafana dashboard.

  Tech stack (frozen, see CLAUDE.md): Redpanda, Bytewax, MinIO, Iceberg V3,
  Polaris, Resiliparse, Rensa, LSHBloom, FineWeb-Edu (ONNX INT8), Next.js 14,
  DuckDB API, KEDA, kube-prometheus-stack, Loki, Alloy, Tempo, Traefik,
  cert-manager, OPA Gatekeeper.
type: application
version: 0.2.0
appVersion: "0.2.0"
kubeVersion: ">=1.28.0-0"
home: https://github.com/stream2pretrain/stream2pretrain
sources:
  - https://github.com/stream2pretrain/stream2pretrain
maintainers:
  - name: stream2pretrain
keywords:
  - streaming
  - llm
  - pretraining
  - data-curation
  - kappa
  - iceberg
  - bytewax
  - redpanda
annotations:
