fullnameOverride: minio

replicas: 4

image:
  repository: quay.io/minio/minio
  tag: RELEASE.2025-04-08T15-41-24Z
  pullPolicy: IfNotPresent

clientImage:
  repository: quay.io/minio/mc
  tag: RELEASE.2025-04-08T15-39-49Z
  pullPolicy: IfNotPresent

credentialsSecret: minio-root

persistence:
  storageClass: local-path
  # This is the request for each MinIO member. Aggregate cluster capacity and
  # migration time must be measured before changing an existing installation.
  size: 64Gi

buckets:
  - s2p-bronze
  - s2p-silver
  - s2p-gold
  - s2p-posttrain
  - s2p-state

bucketBootstrap:
  enabled: true

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

serviceMonitor:
  enabled: true
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
