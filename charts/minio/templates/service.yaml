apiVersion: v1
kind: Service
metadata:
  name: {{ include "stream2pretrain-minio.name" . }}
  labels:
    {{- include "stream2pretrain-minio.labels" . | nindent 4 }}
    stream2pretrain.io/service-role: client
spec:
  selector:
    app.kubernetes.io/name: {{ include "stream2pretrain-minio.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-headless" (include "stream2pretrain-minio.name" .) }}
  labels:
    {{- include "stream2pretrain-minio.labels" . | nindent 4 }}
    stream2pretrain.io/service-role: peer
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: {{ include "stream2pretrain-minio.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
