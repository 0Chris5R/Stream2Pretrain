instances: 3

credentialsSecret: polaris-persistence

database:
  name: polaris
  owner: polaris
  coordinationName: stream2pretrain

persistence:
  storageClass: local-path
  size: 5Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

monitoring:
  enabled: true
