[project]
name = "stream2pretrain-processor"
version = "0.1.0"
description = "Bytewax dataflows + curation operators for Stream2Pretrain."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Heavy ML dependencies (onnxruntime, transformers, kenlm, rensa, plyvel) are
# kept under extras so unit tests can run on a cheap CI image. Production
# Dockerfiles install the [runtime] extra.
dependencies = [
    "stream2pretrain",
    "pydantic>=2.7,<3",
    "structlog>=24.1",
    "orjson>=3.10",
    "defusedxml>=0.7",
    "httpx>=0.27",
    "boto3>=1.34",
    "botocore>=1.34",
    "pypdf>=5,<7",
    "cryptography>=42.0",
    "prometheus-client>=0.20",
    "sympy==1.13.3",
    "lark>=1.1,<2",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
]

[project.optional-dependencies]
# The fetcher needs HTML/PDF extraction, MinHash, language identification, and
# its small figure-classifier only. Keep Iceberg, seed loading, curation,
# controller, and model-service dependencies out of this worker image.
fetcher-service = [
    "bytewax>=0.21",
    "resiliparse>=0.14",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pillow>=10.4",
    "pytesseract>=0.3.13",
    # fastlangid's bundled FastText wrapper still relies on NumPy 1.x
    # ``copy=False`` semantics. NumPy 2 raises before real LID inference.
    "numpy>=1.26,<2",
    "fastlangid>=1.0",
    "onnxruntime>=1.18",
    "transformers>=4.40",
    "tokenizers>=0.19",
    "torch>=2.3,<3",
    "torchvision>=0.18,<1",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "tiktoken>=0.7",
    "datasketch>=1.6",
    "rensa>=0.2",
    "docling==2.114.0",
]
runtime = [
    # Local SourceFeed execution imports the shared MinIO/Kafka writers.
    # Keep this explicit so processor-only installs are complete as well.
    "stream2pretrain-ingest-common",
    # The in-cluster SourceFeed API invokes the RSS module directly.
    "feedparser>=6.0.11",
    "bytewax>=0.21",
    "confluent-kafka>=2.5",
    "cramjam>=2.11",
    "zstandard>=0.23",
    "resiliparse>=0.14",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pillow>=10.4",
    "pytesseract>=0.3.13",
    # fastlangid's bundled FastText wrapper still relies on NumPy 1.x
    # ``copy=False`` semantics. NumPy 2 raises before real LID inference.
    "numpy>=1.26,<2",
    "fastlangid>=1.0",
    "onnxruntime>=1.18",
    "transformers>=4.40",
    "tokenizers>=0.19",
    "torch>=2.3,<3",
    # Keep Torchvision as a direct dependency so uv applies the workspace's
    # official PyTorch CPU index override. Docling imports its compiled vision
    # operators and cannot use the generic PyPI wheel beside torch+cpu.
    "torchvision>=0.18,<1",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "tiktoken>=0.7",
    "datasketch>=1.6",
    "rensa>=0.2",
    "kenlm>=0.2",
    "plyvel>=1.5",
    "sqlitedict>=2.1",
    "presidio-analyzer>=2.2",
    "spacy>=3.8,<3.9",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "kopf>=1.37",
    "kubernetes>=29.0",
    "pyiceberg[sql-sqlite,pyiceberg-core]>=0.7",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "aiohttp>=3.9",
    "docling==2.114.0",
    "pandas>=2.1,<4",
    "sympy==1.13.3",
]
# Stateless model services are intentionally split so neither CI nor a worker
# node must materialize every large artifact in one image or process. Keep
# these separate from ``runtime`` so they omit Docling, PyArrow, Kubernetes
# clients, Iceberg, OCR, and unrelated worker dependencies.
quality-service = [
    "transformers>=4.40",
    "tokenizers>=0.19",
    "torch>=2.3,<3",
    "safetensors>=0.4",
]
embedding-service = [
    "onnxruntime>=1.18",
    "transformers>=4.40",
    "tokenizers>=0.19",
]
kenlm-service = [
    "huggingface-hub>=0.24",
    "sentencepiece>=0.2",
    "kenlm>=0.2",
]
# Containerized laptop pilot profile. It includes every classifier used in the
# curate path while omitting only Kubernetes controller dependencies and the
# production-only alternative state backends.
local = [
    "stream2pretrain-ingest-common",
    "bytewax>=0.21",
    "confluent-kafka>=2.5",
    "cramjam>=2.11",
    "zstandard>=0.23",
    "resiliparse>=0.14",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pillow>=10.4",
    "pytesseract>=0.3.13",
    "numpy>=1.26,<2",
    "fastlangid>=1.0",
    "onnxruntime>=1.18,<2",
    "transformers>=4.40,<5",
    "tokenizers>=0.19",
    "torch>=2.3,<3",
    "torchvision>=0.18,<1",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "kenlm>=0.2",
    "tiktoken>=0.7",
    "datasketch>=1.6",
    "rensa>=0.2",
    "plyvel>=1.5",
    "sqlitedict>=2.1",
    "presidio-analyzer>=2.2",
    "spacy>=3.8,<3.9",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "pyiceberg[sql-sqlite,pyiceberg-core]>=0.7",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "aiohttp>=3.9",
    "docling==2.114.0",
    "pandas>=2.1,<4",
    "feedparser>=6.0.11",
    "sympy==1.13.3",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
s2p-fetcher = "processor.fetcher:main"
s2p-curate = "processor.curate:main"
s2p-curator-model-service = "processor.model_service:main"
s2p-iceberg-writer = "processor.iceberg_writer:main"
s2p-iceberg-maintenance = "processor.iceberg_maintenance:main"
s2p-decon-api = "processor.decon_api:main"
s2p-duckdb-api = "processor.duckdb_api:main"
s2p-local-sources-api = "processor.local_sources_api:main"
s2p-mixture-controller = "processor.mixture_controller.controller:main"
s2p-foundry = "processor.foundry.worker:main"
s2p-foundry-api = "processor.foundry.api:main"
s2p-foundry-export-replay = "processor.foundry.export_replay:main"
s2p-foundry-build-oracle = "processor.foundry.oracle_build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true
