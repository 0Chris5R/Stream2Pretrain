# Stream2Pretrain - dev SourceFeed catalogue.
#
# Loaded by every ingest pod when ``S2P_FEED_CONFIG`` is set (the default in
# docker-compose.dev.yml). In cluster, the same shape is installed as
# SourceFeed CRDs and read via the Kubernetes API.
#
# Phase-1 demo set per SOURCES.md.
feeds:
  - name: rss-arxiv-cs-cl
    protocol: rss
    endpoint: https://rss.arxiv.org/rss/cs.CL
    poll_interval_seconds: 7200
    rate_limit:
      requests_per_second: 1.0
      burst: 4
    license_default: per-record
    egress_allow: ["rss.arxiv.org", "arxiv.org", "export.arxiv.org"]

  - name: rss-arxiv-cs-lg
    protocol: rss
    endpoint: https://rss.arxiv.org/rss/cs.LG
    poll_interval_seconds: 7200
    rate_limit:
      requests_per_second: 1.0
      burst: 4
    license_default: per-record
    egress_allow: ["rss.arxiv.org", "arxiv.org", "export.arxiv.org"]

  - name: rss-arxiv-cs-ai
    protocol: rss
    endpoint: https://rss.arxiv.org/rss/cs.AI
    poll_interval_seconds: 7200
    rate_limit:
      requests_per_second: 1.0
      burst: 4
    license_default: per-record
    egress_allow: ["rss.arxiv.org", "arxiv.org", "export.arxiv.org"]

  - name: rss-arxiv-cs-cv
    protocol: rss
    endpoint: https://rss.arxiv.org/rss/cs.CV
    poll_interval_seconds: 7200
    rate_limit:
      requests_per_second: 1.0
      burst: 4
    license_default: per-record
    egress_allow: ["rss.arxiv.org", "arxiv.org", "export.arxiv.org"]

  - name: oai-arxiv-cs
    protocol: oai-pmh
    endpoint: https://oaipmh.arxiv.org/oai
    poll_interval_seconds: 7200
    rate_limit:
      requests_per_second: 4.0
      burst: 4
    license_default: per-record
    egress_allow: ["oaipmh.arxiv.org", "export.arxiv.org"]

  - name: hf-models
    protocol: rest-json
    endpoint: https://huggingface.co/api/models
    poll_interval_seconds: 900
    rate_limit:
      requests_per_second: 1.0
      burst: 2
    license_default: per-record
    auth:
      type: bearer
      secret_name: hf-token
      secret_key: token
    egress_allow: ["huggingface.co", "hf.co"]

  - name: hf-datasets
    protocol: rest-json
    endpoint: https://huggingface.co/api/datasets
    poll_interval_seconds: 600
    rate_limit:
      requests_per_second: 1.0
      burst: 2
    license_default: per-record
    auth:
      type: bearer
      secret_name: hf-token
      secret_key: token
    egress_allow: ["huggingface.co", "hf.co"]
