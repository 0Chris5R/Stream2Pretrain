[project]
name = "stream2pretrain-github-events"
version = "0.1.0"
description = "GitHub Events long-running poller for Stream2Pretrain."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "stream2pretrain",
    "stream2pretrain-ingest-common",
]

[project.scripts]
s2p-github-events = "ingest.github_events.poller:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
