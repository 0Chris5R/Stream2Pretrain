[project]
name = "stream2pretrain-ingest-common"
version = "0.1.0"
description = "Shared HTTP, Kafka, MinIO, structlog, and OTel utilities for ingest pollers."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "stream2pretrain",
    "httpx[http2]>=0.27",
    "h2>=4.1",
    "aiokafka>=0.11",
    "aiobotocore>=2.13",
    "boto3>=1.34",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "structlog>=24.1",
    "orjson>=3.10",
    "cramjam>=2.11.0",
    # aiokafka checks this module directly before enabling zstd compression.
    "zstandard>=0.23",
    "PyYAML>=6.0",
    "kubernetes>=30.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
