[project]
name = "stream2pretrain-github-release-tarball-fetcher"
version = "0.2.0"
description = "GitHub release tarball fetcher for Stream2Pretrain (consumes raw.fetched, emits CodeFileRecord)."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "stream2pretrain",
    "stream2pretrain-ingest-common",
    "Pygments>=2.17",
]

[project.scripts]
s2p-github-tarball-fetcher = "ingest.github_release_tarball_fetcher.fetcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
