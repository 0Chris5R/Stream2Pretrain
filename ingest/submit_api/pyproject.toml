[project]
name = "stream2pretrain-submit-api"
version = "0.1.0"
description = "FastAPI submit endpoint for Stream2Pretrain."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "stream2pretrain",
    "stream2pretrain-ingest-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
]

[project.scripts]
s2p-submit-api = "ingest.submit_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
