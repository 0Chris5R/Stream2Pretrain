[project]
name = "stream2pretrain-oaipmh-poller"
version = "0.1.0"
description = "OAI-PMH 2.0 CronJob poller for Stream2Pretrain (arXiv default)."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "stream2pretrain",
    "stream2pretrain-ingest-common",
]

[project.scripts]
s2p-oaipmh-poller = "ingest.oaipmh_poller.poller:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
