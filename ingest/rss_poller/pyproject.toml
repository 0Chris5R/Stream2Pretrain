[project]
name = "stream2pretrain-rss-poller"
version = "0.1.0"
description = "RSS/Atom CronJob poller for Stream2Pretrain."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "stream2pretrain",
    "stream2pretrain-ingest-common",
    "feedparser>=6.0.11",
]

[project.scripts]
s2p-rss-poller = "ingest.rss_poller.poller:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
