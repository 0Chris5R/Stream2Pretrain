# Local dev stack for Stream2Pretrain.
#
# This is the laptop-side counterpart to the in-cluster Helm release. It boots:
#   - Redpanda single-node dev mode (Kafka API on :9092, Admin on :9644)
#   - Redpanda Console (web UI on :8080)
#   - MinIO single-node S3 (API on :9000, Console on :9001)
#
# Polaris (Iceberg REST catalog) is intentionally NOT in this compose stack.
# The official polaris-catalog container image is published only on the OCI
# registry of the Apache Polaris project and assumes a Postgres backend wired
# via Helm. For local dev we either:
#   - run pyiceberg with a SQLite-backed `pyiceberg.catalog.sql.SqlCatalog`, or
#   - port-forward the in-cluster Polaris service.
# See charts/stream2pretrain/templates/polaris.yaml for the cluster path.

name: stream2pretrain-dev

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: s2p-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
    ports:
      - "9092:9092"
      - "9644:9644"
      - "8082:8082"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: s2p-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      CONFIG_FILEPATH: ""
    ports:
      - "8080:8080"
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: s2p-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  minio-bootstrap:
    image: quay.io/minio/mc:RELEASE.2025-04-08T15-39-49Z
    container_name: s2p-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/bronze local/silver local/gold local/decon-attestations local/checkpoints || true &&
      echo 'buckets ready' &&
      exit 0
      "
    restart: "no"

volumes:
  redpanda-data:
    name: s2p-redpanda-data
  minio-data:
    name: s2p-minio-data
