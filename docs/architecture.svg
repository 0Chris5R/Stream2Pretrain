<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">Stream2Pretrain Kappa architecture</title>
  <desc id="desc">Continuous source ingestion through Redpanda and Bytewax into MinIO-backed Iceberg tables, then DuckDB and the user interface, with a post-training branch and Kubernetes operations.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 34px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px system-ui, sans-serif; fill: #475569; }
      .label { font: 700 18px system-ui, sans-serif; fill: #0f172a; }
      .small { font: 500 14px system-ui, sans-serif; fill: #334155; }
      .flow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .event { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .process { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
      .store { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .serve { fill: #f3e8ff; stroke: #9333ea; stroke-width: 2; }
      .ops { fill: #f8fafc; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 6; }
    </style>
  </defs>
  <rect width="1600" height="860" fill="#ffffff"/>
  <text x="60" y="58" class="title">Stream2Pretrain Kappa data flow</text>
  <text x="60" y="88" class="subtitle">One streaming path for live input and replay, deployed declaratively on Kubernetes</text>

  <rect x="60" y="160" width="180" height="90" rx="12" class="event"/>
  <text x="150" y="197" text-anchor="middle" class="label">Sources</text>
  <text x="150" y="222" text-anchor="middle" class="small">arXiv and HF cards</text>

  <rect x="290" y="160" width="190" height="90" rx="12" class="process"/>
  <text x="385" y="197" text-anchor="middle" class="label">Ingestion</text>
  <text x="385" y="222" text-anchor="middle" class="small">Poll, license, fetch</text>

  <rect x="530" y="145" width="210" height="120" rx="12" class="event"/>
  <text x="635" y="183" text-anchor="middle" class="label">Redpanda</text>
  <text x="635" y="210" text-anchor="middle" class="small">admissions, raw,</text>
  <text x="635" y="232" text-anchor="middle" class="small">normalized, decisions</text>

  <rect x="790" y="145" width="210" height="120" rx="12" class="process"/>
  <text x="895" y="183" text-anchor="middle" class="label">Bytewax</text>
  <text x="895" y="210" text-anchor="middle" class="small">Extract, score, redact,</text>
  <text x="895" y="232" text-anchor="middle" class="small">deduplicate, route</text>

  <rect x="1050" y="145" width="210" height="120" rx="12" class="store"/>
  <text x="1155" y="183" text-anchor="middle" class="label">Iceberg V2</text>
  <text x="1155" y="210" text-anchor="middle" class="small">Parquet tables in MinIO</text>
  <text x="1155" y="232" text-anchor="middle" class="small">Polaris catalog</text>

  <rect x="1310" y="160" width="220" height="90" rx="12" class="serve"/>
  <text x="1420" y="197" text-anchor="middle" class="label">DuckDB API</text>
  <text x="1420" y="222" text-anchor="middle" class="small">Queries and exports</text>

  <path d="M240 205 H290" class="flow"/>
  <path d="M480 205 H530" class="flow"/>
  <path d="M740 205 H790" class="flow"/>
  <path d="M1000 205 H1050" class="flow"/>
  <path d="M1260 205 H1310" class="flow"/>

  <rect x="360" y="350" width="260" height="105" rx="12" class="store"/>
  <text x="490" y="390" text-anchor="middle" class="label">MinIO object storage</text>
  <text x="490" y="417" text-anchor="middle" class="small">Bronze, Silver, Gold,</text>
  <text x="490" y="439" text-anchor="middle" class="small">state and packages</text>
  <path d="M385 250 V320 H490 V350" class="flow"/>
  <path d="M1155 265 V320 H620 V380" class="flow"/>

  <rect x="760" y="350" width="260" height="105" rx="12" class="process"/>
  <text x="890" y="390" text-anchor="middle" class="label">Model services</text>
  <text x="890" y="417" text-anchor="middle" class="small">Four ModernBERT heads</text>
  <text x="890" y="439" text-anchor="middle" class="small">and KenLM API</text>
  <path d="M895 265 V350" class="flow"/>

  <rect x="1090" y="350" width="250" height="105" rx="12" class="serve"/>
  <text x="1215" y="390" text-anchor="middle" class="label">Next.js cockpit</text>
  <text x="1215" y="417" text-anchor="middle" class="small">Monitor, inspect, export,</text>
  <text x="1215" y="439" text-anchor="middle" class="small">approve artifacts</text>
  <path d="M1420 250 V310 H1215 V350" class="flow"/>

  <rect x="1370" y="350" width="170" height="105" rx="12" class="process"/>
  <text x="1455" y="390" text-anchor="middle" class="label">Foundry</text>
  <text x="1455" y="417" text-anchor="middle" class="small">SFT and RL</text>
  <text x="1455" y="439" text-anchor="middle" class="small">derived artifacts</text>
  <path d="M1455 455 V500 H1215 V455" class="flow"/>

  <rect x="60" y="585" width="1480" height="190" rx="16" class="ops"/>
  <text x="90" y="625" class="label">Kubernetes and operational plane</text>
  <text x="90" y="660" class="small">Helmfile tiers: edge, platform, storage, catalog, application</text>
  <text x="90" y="690" class="small">State: PVC-backed Bytewax recovery, deduplication, DuckDB index, PostgreSQL catalog and MinIO objects</text>
  <text x="90" y="720" class="small">Scaling: independent pollers and model APIs scale by replicas; Bytewax stages rescale as coordinated executions</text>
  <text x="90" y="750" class="small">Observability: Prometheus metrics, ServiceMonitors, alerts and the live cockpit</text>
</svg>
