name: Publish pinned classifier weights

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download pinned public inference archives
        env:
          TRANSFER_BASE_URL: ${{ vars.S2P_CLASSIFIER_TRANSFER_BASE_URL }}
        run: |
          set -euo pipefail
          [[ "$TRANSFER_BASE_URL" == https://huggingface.co/*/resolve/* ]]
          mkdir -p "$RUNNER_TEMP/release"
          for task in arxiv-math-reasoning arxiv-posttrain-suitability; do
            archive="$RUNNER_TEMP/release/$task.tar"
            curl --fail --silent --show-error --location --retry 2 \
              --connect-timeout 20 --max-time 600 \
              "$TRANSFER_BASE_URL/$task.tar" --output "$archive"
            expected="$(jq -er --arg task "$task" '.models[$task].archive_sha256' processor/source-classifiers.json)"
            echo "$expected  $archive" | sha256sum --check
          done
      - name: Publish inference archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload source-classifiers-2026-09-04 \
            "$RUNNER_TEMP/release/arxiv-math-reasoning.tar" \
            "$RUNNER_TEMP/release/arxiv-posttrain-suitability.tar"
          gh release edit source-classifiers-2026-09-04 --draft=false --latest=false
