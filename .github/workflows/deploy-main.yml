name: Build and deploy main

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Deploy, diagnose, audit UI, validate sources/foundry, inspect storage, or recover storage
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - diagnose
          - audit-ui
          - repair-monitoring
          - validate-sources
          - validate-foundry
          - inspect-storage
          - recover-storage

concurrency:
  group: stream2pretrain-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  HELM_VERSION: v3.15.4
  HELMFILE_VERSION: v1.7.3

jobs:
  changes:
    name: Plan changed release scopes
    if: inputs.mode == '' || inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
      python: ${{ steps.scope.outputs.python }}
      helm: ${{ steps.scope.outputs.helm }}
      core: ${{ steps.scope.outputs.core }}
      sources: ${{ steps.scope.outputs.sources }}
      monitoring: ${{ steps.scope.outputs.monitoring }}
      redpanda: ${{ steps.scope.outputs.redpanda }}
      foundry_package: ${{ steps.scope.outputs.foundry_package }}
      dns_infra: ${{ steps.scope.outputs.dns_infra }}
      model_runtime: ${{ steps.scope.outputs.model_runtime }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          # A queued push can contain several commits. The planner must retain
          # github.event.before or it can silently miss changed components.
          fetch-depth: 0

      - name: Resolve changed scopes
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "python=false" >> "$GITHUB_OUTPUT"
            echo "helm=false" >> "$GITHUB_OUTPUT"
            echo "core=false" >> "$GITHUB_OUTPUT"
            echo "sources=false" >> "$GITHUB_OUTPUT"
            echo "monitoring=false" >> "$GITHUB_OUTPUT"
            echo "redpanda=false" >> "$GITHUB_OUTPUT"
            echo "foundry_package=false" >> "$GITHUB_OUTPUT"
            echo "dns_infra=false" >> "$GITHUB_OUTPUT"
            echo "model_runtime=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]] \
             || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            before="$(git rev-parse HEAD^)"
          fi
          changed="$RUNNER_TEMP/changed-files.txt"
          git diff --name-only "$before" HEAD > "$changed"
          python=false
          helm=false
          deploy=false
          core=false
          sources=false
          monitoring=false
          redpanda=false
          foundry_package=false
          dns_infra=false
          model_runtime=false
          if grep -Eq \
            '^(schemas/|ingest/|processor/|tests/|scripts/.*\.py$|pyproject\.toml$|uv\.lock$|[^/]+/pyproject\.toml$)' \
            "$changed"; then
            python=true
          fi
          if grep -Eq \
            '^(\.github/workflows/deploy-main\.yml$|charts/|infra/helmfile-values/|infra/kubernetes/|helmfile\.yaml$|scripts/)' \
            "$changed"; then
            helm=true
          fi
          if grep -Eq \
            '^(\.github/workflows/deploy-main\.yml$|schemas/|ingest/|processor/|ui/|charts/|infra/helmfile-values/|infra/kubernetes/|scripts/|pyproject\.toml$|uv\.lock$|\.dockerignore$|helmfile\.yaml$)' \
            "$changed"; then
            deploy=true
          fi
          if grep -Eq \
            '^(\.github/workflows/deploy-main\.yml$|schemas/|charts/stream2pretrain/|infra/helmfile-values/|scripts/(cluster_smoke|reconcile_topic_partitions|bytewax_cutover_marker|migrate_fetcher_offsets)\.)' \
            "$changed"; then
            core=true
          fi
          if grep -E '^processor/' "$changed" \
             | grep -Ev '^processor/foundry/' >/dev/null; then
            core=true
          fi
          if grep -Eq \
            '^(\.github/workflows/deploy-main\.yml$|ingest/|schemas/(sourcefeed|license_admission|bronze)\.py$|charts/stream2pretrain/(files/feeds|templates/ingest-|templates/sourcefeed|values)|infra/helmfile-values/|scripts/load_seed_feeds\.sh$|processor/mixture_controller/)' \
            "$changed"; then
            sources=true
          fi
          if grep -Eq \
            '^(infra/helmfile-values/kube-prometheus-stack\.dev\.yaml|helmfile\.yaml)$' \
            "$changed"; then
            monitoring=true
          fi
          if grep -Eq \
            '^(infra/helmfile-values/redpanda\.dev\.yaml|helmfile\.yaml)$' \
            "$changed"; then
            redpanda=true
          fi
          if grep -Eq \
            '^(processor/foundry/(packaging|standalone_verifier)\.py|schemas/foundry\.py)$' \
            "$changed"; then
            foundry_package=true
          fi
          if grep -Eq \
            '^(infra/kubernetes/coredns-(ha-patch|pdb)\.yaml|scripts/validate_storage_dns\.py)$' \
            "$changed"; then
            dns_infra=true
          fi
          if grep -Eq \
            '^(processor/(curate|model_client|model_service)\.py|processor/operators/quality\.py|charts/stream2pretrain/templates/(processor-curate|processor-model-service|servicemonitors)\.yaml|charts/stream2pretrain/values\.yaml|scripts/benchmark_model_service\.py)$' \
            "$changed"; then
            model_runtime=true
          fi
          echo "Changed files:"
          sed 's/^/  /' "$changed"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "helm=$helm" >> "$GITHUB_OUTPUT"
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "sources=$sources" >> "$GITHUB_OUTPUT"
          echo "monitoring=$monitoring" >> "$GITHUB_OUTPUT"
          echo "redpanda=$redpanda" >> "$GITHUB_OUTPUT"
          echo "foundry_package=$foundry_package" >> "$GITHUB_OUTPUT"
          echo "dns_infra=$dns_infra" >> "$GITHUB_OUTPUT"
          echo "model_runtime=$model_runtime" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate repository
    if: >-
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.helm == 'true'
    needs:
      - changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install uv
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.helm == 'true'
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.8.17"
          enable-cache: true

      - name: Install Helm 3
        if: needs.changes.outputs.helm == 'true'
        uses: azure/setup-helm@v5.0.1
        with:
          version: "${{ env.HELM_VERSION }}"

      - name: Install Helmfile
        if: needs.changes.outputs.helm == 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive_version="${HELMFILE_VERSION#v}"
          archive="$RUNNER_TEMP/helmfile.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/helmfile/helmfile/releases/download/${HELMFILE_VERSION}/helmfile_${archive_version}_linux_amd64.tar.gz" \
            --output "$archive"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/helmfile" /usr/local/bin/helmfile
          helmfile version

      - name: Install Python dependencies
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.helm == 'true'
        run: uv sync --all-packages --all-groups --locked

      - name: Run Python checks
        if: needs.changes.outputs.python == 'true'
        run: |
          uv run ruff check schemas ingest processor tests scripts
          uv run ruff format --check schemas ingest processor tests scripts
          uv run pytest

      - name: Execute generated Prime Verifiers package
        if: needs.changes.outputs.foundry_package == 'true'
        run: >-
          uv run --with verifiers==0.3.1 pytest
          processor/tests/test_foundry.py
          -k acceptance_suite_and_signed_package_are_reproducible

      - name: Lint Helm chart and release graph
        if: needs.changes.outputs.helm == 'true'
        shell: bash
        run: |
          set -euo pipefail
          helm lint charts/stream2pretrain \
            -f charts/stream2pretrain/values-dev.yaml \
            -f infra/helmfile-values/stream2pretrain.dev.yaml
          rendered_chart="$RUNNER_TEMP/stream2pretrain-rendered.yaml"
          helm template stream2pretrain charts/stream2pretrain \
            --namespace stream2pretrain \
            -f charts/stream2pretrain/values-dev.yaml \
            -f infra/helmfile-values/stream2pretrain.dev.yaml \
            > "$rendered_chart"
          message_limits="$(
            awk '/- name: S2P_KAFKA_MESSAGE_MAX_BYTES/ {getline; print $2}' \
              "$rendered_chart" | sort -u
          )"
          if [[ "$message_limits" != '"2097152"' ]]; then
            echo "Rendered Kafka message limit is not an integer string: $message_limits" >&2
            exit 1
          fi
          uv run python - "$rendered_chart" <<'PY'
          import sys

          import yaml

          resources = [item for item in yaml.safe_load_all(open(sys.argv[1])) if item]
          by_name = {
              (item.get("kind"), item.get("metadata", {}).get("name")): item
              for item in resources
          }
          for name in (
              "stream2pretrain-ingest-rss",
              "stream2pretrain-ingest-oaipmh",
          ):
              resource = by_name.get(("CronJob", name))
              if resource is None:
                  raise SystemExit(f"SourceFeed clone template must be rendered: {name}")
              if resource.get("spec", {}).get("suspend") is not True:
                  raise SystemExit(f"SourceFeed clone template must be suspended: {name}")
          if ("CronJob", "stream2pretrain-ingest-blogs") in by_name:
              raise SystemExit("aggregate ingest-blogs CronJob must not be rendered")
          for kind, name in (
              ("Deployment", "stream2pretrain-processor-fetcher"),
              ("StatefulSet", "stream2pretrain-processor-curate"),
              ("Deployment", "stream2pretrain-processor-iceberg-writer"),
              ("Deployment", "stream2pretrain-ingest-arxiv-html"),
          ):
              resource = by_name.get((kind, name))
              if resource is None or resource.get("spec", {}).get("replicas") != 1:
                  raise SystemExit(f"core workload must render exactly one replica: {name}")

          for profile in ("finepdfs", "fineweb"):
              name = f"stream2pretrain-processor-model-service-{profile}"
              deployment = by_name.get(("Deployment", name))
              service = by_name.get(("Service", name))
              scaler = by_name.get(("ScaledObject", name))
              monitor = by_name.get(("ServiceMonitor", name))
              if any(value is None for value in (deployment, service, scaler, monitor)):
                  raise SystemExit(f"classifier runtime contract is incomplete: {name}")
              if scaler.get("spec", {}).get("minReplicaCount") != 2:
                  raise SystemExit(f"classifier must retain two baseline replicas: {name}")
              trigger = scaler.get("spec", {}).get("triggers", [{}])[0]
              query = trigger.get("metadata", {}).get("query", "")
              if "s2p_model_active_requests" not in query or "s2p_model_waiting_requests" not in query:
                  raise SystemExit(f"classifier queue autoscaling drifted: {name}")
              runtime_profile = next(
                  item.get("value")
                  for item in deployment["spec"]["template"]["spec"]["containers"][0]["env"]
                  if item.get("name") == "S2P_MODEL_SERVICE_PROFILE"
              )
              if runtime_profile != profile:
                  raise SystemExit(f"classifier runtime profile drifted: {name}")
              endpoint = monitor.get("spec", {}).get("endpoints", [{}])[0]
              if endpoint.get("port") != "http" or endpoint.get("path") != "/metrics":
                  raise SystemExit(f"classifier metrics endpoint drifted: {name}")

          def container_env(kind, workload_name, container_name):
              resource = by_name[(kind, workload_name)]
              containers = resource["spec"]["template"]["spec"]["containers"]
              container = next(
                  item for item in containers if item.get("name") == container_name
              )
              return {
                  item["name"]: item.get("value")
                  for item in container.get("env", [])
                  if "name" in item and "value" in item
              }

          runtime_contracts = (
              (
                  "Deployment",
                  "stream2pretrain-processor-fetcher",
                  "fetcher",
                  {
                      "S2P_KAFKA_START_OFFSET": "stored",
                      "S2P_BYTEWAX_FLOW_NAME": "s2p-fetcher-live-v5",
                      "S2P_BYTEWAX_RECOVERY_NAME": "fetcher-live-v5",
                      "S2P_BYTEWAX_RECOVERY_PARTITIONS": "4",
                  },
              ),
              (
                  "StatefulSet",
                  "stream2pretrain-processor-curate",
                  "curate",
                  {
                      "S2P_KAFKA_START_OFFSET": "stored",
                      "S2P_BYTEWAX_FLOW_NAME": "s2p-curate-live-v5",
                      "S2P_BYTEWAX_RECOVERY_NAME": "curate-live-v5",
                      "S2P_BYTEWAX_RECOVERY_PARTITIONS": "4",
                  },
              ),
              (
                  "Deployment",
                  "stream2pretrain-processor-iceberg-writer",
                  "iceberg-writer",
                  {
                      "S2P_KAFKA_START_OFFSET": "stored",
                      "S2P_BYTEWAX_FLOW_NAME": "s2p-iceberg-writer-live-v2",
                      "S2P_BYTEWAX_RECOVERY_NAME": "iceberg-writer-live-v2",
                      "S2P_BYTEWAX_RECOVERY_PARTITIONS": "1",
                  },
              ),
          )
          for kind, workload_name, container_name, expected in runtime_contracts:
              env = container_env(kind, workload_name, container_name)
              mismatches = {
                  key: {"expected": value, "rendered": env.get(key)}
                  for key, value in expected.items()
                  if env.get(key) != value
              }
              if mismatches:
                  raise SystemExit(
                      f"Bytewax runtime contract drift for {workload_name}: {mismatches}"
                  )
          forbidden_scalers = {
              "stream2pretrain-processor-fetcher",
              "stream2pretrain-processor-curate",
              "stream2pretrain-processor-iceberg-writer",
              "stream2pretrain-ingest-arxiv-html",
          }
          rendered_scalers = {
              item.get("metadata", {}).get("name")
              for item in resources
              if item.get("kind") == "ScaledObject"
          }
          overlap = sorted(forbidden_scalers & rendered_scalers)
          if overlap:
              raise SystemExit(f"invalid Kafka-lag ScaledObject rendered: {overlap}")
          PY
          helmfile \
            --helm-binary "$(command -v helm)" \
            --file helmfile.yaml \
            --environment dev \
            lint
          redpanda_rendered="$RUNNER_TEMP/redpanda-rendered.yaml"
          monitoring_rendered="$RUNNER_TEMP/monitoring-rendered.yaml"
          helmfile \
            --helm-binary "$(command -v helm)" \
            --file helmfile.yaml \
            --environment dev \
            --selector name=redpanda \
            template > "$redpanda_rendered"
          helmfile \
            --helm-binary "$(command -v helm)" \
            --file helmfile.yaml \
            --environment dev \
            --selector name=kube-prometheus-stack \
            template > "$monitoring_rendered"
          uv run python - "$redpanda_rendered" "$monitoring_rendered" <<'PY'
          import sys

          import yaml


          def resources(path):
              with open(path) as stream:
                  return [item for item in yaml.safe_load_all(stream) if item]


          redpanda = resources(sys.argv[1])
          monitor = next(
              item
              for item in redpanda
              if item.get("kind") == "ServiceMonitor"
              and item.get("metadata", {}).get("name") == "redpanda"
          )
          endpoint = monitor["spec"]["endpoints"][0]
          if monitor["metadata"].get("namespace") != "redpanda":
              raise SystemExit("Redpanda ServiceMonitor must live in redpanda")
          if endpoint.get("path") != "/public_metrics" or endpoint.get("port") != "admin":
              raise SystemExit("Redpanda ServiceMonitor must scrape admin/public_metrics")

          monitoring = resources(sys.argv[2])
          prometheus = next(
              item
              for item in monitoring
              if item.get("kind") == "Prometheus"
              and item.get("metadata", {}).get("name") == "kps-prometheus"
          )
          if prometheus["spec"].get("serviceMonitorNamespaceSelector") != {}:
              raise SystemExit("Prometheus must discover cross-namespace ServiceMonitors")
          grafana_secret = next(
              item
              for item in monitoring
              if item.get("kind") == "Secret"
              and item.get("metadata", {}).get("name")
              == "kube-prometheus-stack-grafana"
          )
          if not {"admin-user", "admin-password"} <= set(grafana_secret.get("data", {})):
              raise SystemExit("Grafana chart-owned Secret keys are incomplete")
          grafana = next(
              item
              for item in monitoring
              if item.get("kind") == "Deployment"
              and item.get("metadata", {}).get("name")
              == "kube-prometheus-stack-grafana"
          )
          if grafana["spec"].get("strategy", {}).get("type") != "Recreate":
              raise SystemExit("Single-replica Grafana must use Recreate")
          PY

  processor-base:
    name: Build processor base (${{ matrix.profile }})
    if: needs.changes.outputs.deploy == 'true'
    needs:
      - changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - profile: none
            repository: processor-base
            extra: runtime
          - profile: quality
            repository: processor-base-quality
            extra: quality-service
          - profile: kenlm
            repository: processor-base-kenlm
            extra: kenlm-service
          - profile: fetcher
            repository: processor-base-fetcher
            extra: fetcher-service
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install uv for dependency fingerprinting
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.8.17"
          enable-cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable ${{ matrix.profile }} base image
        id: base
        shell: bash
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          dependency_key="$(
            uv export \
              --frozen \
              --package stream2pretrain-processor \
              --extra "${{ matrix.extra }}" \
              --no-dev \
              --no-header \
              --no-annotate \
              --no-emit-workspace \
              | sha256sum | cut -c1-24
          )"
          base_key="$(
            {
              sed '/^FROM runtime-base AS runtime$/,$d' processor/Dockerfile
              printf '%s\n' "resolved-dependencies=$dependency_key"
              printf '%s\n' "model-profile=${{ matrix.profile }}"
              printf '%s\n' "install-extra=${{ matrix.extra }}"
            } | sha256sum | cut -c1-24
          )"
          image="ghcr.io/${owner}/stream2pretrain/${{ matrix.repository }}:${base_key}"
          exists=false
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            exists=true
            echo "Reusing immutable ${{ matrix.profile }} processor base $image"
          else
            echo "Building new immutable ${{ matrix.profile }} processor base $image"
          fi
          echo "registry=ghcr.io/${owner}" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

      - name: Build and publish dependency base
        if: matrix.profile == 'none' && steps.base.outputs.exists != 'true'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: processor/Dockerfile
          target: runtime-base
          platforms: linux/amd64
          push: true
          tags: ${{ steps.base.outputs.image }}
          build-args: S2P_MODEL_PROFILE=none
          cache-from: |
            type=gha,scope=processor-base
            type=registry,ref=${{ steps.base.outputs.registry }}/stream2pretrain/processor:buildcache
          cache-to: type=gha,scope=processor-base,mode=max

      - name: Build and publish ${{ matrix.profile }} model base
        if: matrix.profile != 'none' && steps.base.outputs.exists != 'true'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: processor/Dockerfile
          target: runtime-base
          platforms: linux/amd64
          push: true
          tags: ${{ steps.base.outputs.image }}
          build-args: |
            S2P_MODEL_PROFILE=${{ matrix.profile }}
            S2P_INSTALL_EXTRA=${{ matrix.extra }}
          cache-from: type=gha,scope=processor-base

  processor-base-pin:
    name: Pin processor bases by digest
    if: needs.changes.outputs.deploy == 'true'
    needs:
      - changes
      - processor-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.pin.outputs.image }}
      quality_image: ${{ steps.pin.outputs.quality_image }}
      kenlm_image: ${{ steps.pin.outputs.kenlm_image }}
      fetcher_image: ${{ steps.pin.outputs.fetcher_image }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install uv for dependency fingerprinting
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.8.17"
          enable-cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin dependency and model bases by digest
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          resolve_image() {
            local profile="$1"
            local repository="$2"
            local extra="$3"
            local base_key
            local dependency_key
            dependency_key="$(
              uv export \
                --frozen \
                --package stream2pretrain-processor \
                --extra "$extra" \
                --no-dev \
                --no-header \
                --no-annotate \
                --no-emit-workspace \
                | sha256sum | cut -c1-24
            )"
            base_key="$(
              {
                sed '/^FROM runtime-base AS runtime$/,$d' processor/Dockerfile
                printf '%s\n' "resolved-dependencies=$dependency_key"
                printf '%s\n' "model-profile=$profile"
                printf '%s\n' "install-extra=$extra"
              } | sha256sum | cut -c1-24
            )"
            printf 'ghcr.io/%s/stream2pretrain/%s:%s' "$owner" "$repository" "$base_key"
          }
          pin_image() {
            local output_name="$1"
            local image="$2"
            local digest
            digest="sha256:$(
              docker buildx imagetools inspect "$image" --raw \
                | sha256sum | cut -d ' ' -f1
            )"
            [[ "$digest" == sha256:* ]] || {
              echo "Could not resolve the processor base digest for $image" >&2
              exit 1
            }
            echo "${output_name}=${image}@${digest}" >> "$GITHUB_OUTPUT"
            echo "Pinned processor base ${image}@${digest}"
          }
          pin_image image "$(resolve_image none processor-base runtime)"
          pin_image quality_image "$(resolve_image quality processor-base-quality quality-service)"
          pin_image kenlm_image "$(resolve_image kenlm processor-base-kenlm kenlm-service)"
          pin_image fetcher_image "$(resolve_image fetcher processor-base-fetcher fetcher-service)"

  build:
    name: Build ${{ matrix.image }}
    if: needs.changes.outputs.deploy == 'true'
    needs:
      - changes
      - processor-base-pin
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: ingest-rss
            context: .
            dockerfile: ingest/rss_poller/Dockerfile
            inputs: .dockerignore pyproject.toml README.md schemas ingest/__init__.py ingest/common ingest/rss_poller
          - image: ingest-oaipmh
            context: .
            dockerfile: ingest/oaipmh_poller/Dockerfile
            inputs: .dockerignore pyproject.toml README.md schemas ingest/__init__.py ingest/common ingest/oaipmh_poller
          - image: ingest-hf
            context: .
            dockerfile: ingest/hf_poller/Dockerfile
            inputs: .dockerignore pyproject.toml README.md schemas ingest/__init__.py ingest/common ingest/hf_poller
          - image: ingest-arxiv-html
            context: .
            dockerfile: ingest/arxiv_html_fetcher/Dockerfile
            inputs: .dockerignore pyproject.toml README.md schemas ingest/__init__.py ingest/common ingest/arxiv_html_fetcher
          - image: processor
            context: .
            dockerfile: processor/Dockerfile.app
            inputs: .dockerignore schemas ingest/__init__.py ingest/common ingest/arxiv_html_fetcher ingest/oaipmh_poller ingest/rss_poller processor/*.py processor/Dockerfile.app processor/container_entrypoint.sh processor/mixture_controller processor/operators docs/provider-terms
          - image: processor-foundry
            context: .
            dockerfile: processor/Dockerfile.foundry.app
            inputs: .dockerignore schemas processor/Dockerfile.foundry.app processor/__init__.py processor/common.py processor/container_entrypoint.sh processor/iceberg_catalog.py processor/probes.py processor/sign.py processor/source_policy.py processor/foundry docs/provider-terms
          - image: processor-quality-model
            model_profile: quality
            context: .
            dockerfile: processor/Dockerfile.model-service.app
            inputs: .dockerignore schemas processor/Dockerfile.model-service.app processor/__init__.py processor/common.py processor/model_service.py processor/operators/__init__.py processor/operators/quality.py processor/operators/kenlm_score.py
          - image: processor-kenlm-model
            model_profile: kenlm
            context: .
            dockerfile: processor/Dockerfile.model-service.app
            inputs: .dockerignore schemas processor/Dockerfile.model-service.app processor/__init__.py processor/common.py processor/model_service.py processor/operators/__init__.py processor/operators/quality.py processor/operators/kenlm_score.py
          - image: processor-fetcher-model
            context: .
            dockerfile: processor/Dockerfile.fetcher.app
            inputs: .dockerignore schemas ingest/__init__.py ingest/common processor/Dockerfile.fetcher.app processor/__init__.py processor/common.py processor/container_entrypoint.sh processor/fetcher.py processor/metrics.py processor/operators/__init__.py processor/operators/extract.py processor/operators/langid.py processor/operators/minhash.py processor/operators/validity.py processor/probes.py processor/scientific.py processor/source_policy.py
          - image: ui
            context: ui
            dockerfile: Dockerfile
            inputs: ui
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image registry
        id: image
        shell: bash
        env:
          IMAGE_INPUTS: ${{ matrix.inputs }}
          PROCESSOR_BASE_IMAGE: ${{ needs.processor-base-pin.outputs.image }}
          PROCESSOR_QUALITY_IMAGE: ${{ needs.processor-base-pin.outputs.quality_image }}
          PROCESSOR_KENLM_IMAGE: ${{ needs.processor-base-pin.outputs.kenlm_image }}
          PROCESSOR_FETCHER_IMAGE: ${{ needs.processor-base-pin.outputs.fetcher_image }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          registry="ghcr.io/${owner}"
          selected_processor_base="$PROCESSOR_BASE_IMAGE"
          case "${{ matrix.image }}" in
            processor-quality-model) selected_processor_base="$PROCESSOR_QUALITY_IMAGE" ;;
            processor-kenlm-model) selected_processor_base="$PROCESSOR_KENLM_IMAGE" ;;
            processor-fetcher-model) selected_processor_base="$PROCESSOR_FETCHER_IMAGE" ;;
          esac
          component_tree_hash() {
            local revision="$1"
            {
              git ls-tree -r -z "$revision" -- $IMAGE_INPUTS | sort -z
              if [[ "${{ matrix.image }}" == processor* ]]; then
                printf '%s\n' "processor-base=$selected_processor_base"
              fi
            } | sha256sum | cut -c1-24
          }
          content_hash="$(component_tree_hash HEAD)"
          content_ref="${registry}/stream2pretrain/${{ matrix.image }}:content-${content_hash}"
          revision_ref="${registry}/stream2pretrain/${{ matrix.image }}:${GITHUB_SHA}"
          exists=false
          validated=false
          reuse_ref=""
          if docker buildx imagetools inspect "$content_ref" >/dev/null 2>&1; then
            exists=true
            validated=true
            reuse_ref="$content_ref"
            echo "Reusing immutable component image $content_ref"
          elif parent="$(git rev-parse HEAD^ 2>/dev/null)" \
            && [[ "$(component_tree_hash "$parent")" == "$content_hash" ]]; then
            parent_ref="${registry}/stream2pretrain/${{ matrix.image }}:${parent}"
            if docker buildx imagetools inspect "$parent_ref" >/dev/null 2>&1; then
              exists=true
              reuse_ref="$parent_ref"
              echo "Reusing unchanged parent image $parent_ref"
            fi
          fi
          if [[ "$exists" != true ]]; then
            echo "Building new component content $content_ref"
          fi
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "content_ref=$content_ref" >> "$GITHUB_OUTPUT"
          echo "revision_ref=$revision_ref" >> "$GITHUB_OUTPUT"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "validated=$validated" >> "$GITHUB_OUTPUT"
          echo "reuse_ref=$reuse_ref" >> "$GITHUB_OUTPUT"
          echo "processor_base=$selected_processor_base" >> "$GITHUB_OUTPUT"

      - name: Reuse unchanged component image
        if: steps.image.outputs.exists == 'true'
        shell: bash
        env:
          REUSE_REF: ${{ steps.image.outputs.reuse_ref }}
          REVISION_REF: ${{ steps.image.outputs.revision_ref }}
        run: docker buildx imagetools create --tag "$REVISION_REF" "$REUSE_REF"

      - name: Build and publish cached image
        if: >-
          steps.image.outputs.exists != 'true' &&
          !startsWith(matrix.image, 'processor')
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.revision_ref }}
          build-args: |
            PROCESSOR_BASE_IMAGE=${{ steps.image.outputs.processor_base }}
            S2P_MODEL_SERVICE_PROFILE=${{ matrix.model_profile }}
          # GHCR can garbage-collect blobs referenced only by a mutable
          # BuildKit cache manifest. GitHub's cache backend keeps ordinary
          # component layers; the processor's large dependencies live in the
          # immutable base image resolved above.
          cache-from: |
            type=gha,scope=${{ matrix.image }}
            type=registry,ref=${{ steps.image.outputs.registry }}/stream2pretrain/${{ matrix.image }}:buildcache
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Build and publish thin processor image
        if: >-
          steps.image.outputs.exists != 'true' &&
          startsWith(matrix.image, 'processor')
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.revision_ref }}
          build-args: |
            PROCESSOR_BASE_IMAGE=${{ steps.image.outputs.processor_base }}
            S2P_MODEL_SERVICE_PROFILE=${{ matrix.model_profile }}

      - name: Smoke-test Python runtime imports
        # Ingest images use relocated console entrypoints and need this guard.
        # The processor image is multi-GB and its import path is already
        # exercised by cluster_smoke.py; pulling it again would dominate CI.
        if: startsWith(matrix.image, 'ingest-') && steps.image.outputs.validated != 'true'
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.registry }}/stream2pretrain/${{ matrix.image }}:${GITHUB_SHA}"
          docker pull "$image"
          docker run --rm --entrypoint python "$image" -c \
            'import ingest, schemas; print("runtime imports ready")'

      - name: Publish validated content alias
        if: steps.image.outputs.validated != 'true'
        shell: bash
        env:
          CONTENT_REF: ${{ steps.image.outputs.content_ref }}
          REVISION_REF: ${{ steps.image.outputs.revision_ref }}
        run: docker buildx imagetools create --tag "$CONTENT_REF" "$REVISION_REF"

  image-pin:
    name: Pin release images by digest
    if: needs.changes.outputs.deploy == 'true'
    needs:
      - changes
      - build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      ingest_rss: ${{ steps.pin.outputs.ingest_rss }}
      ingest_oaipmh: ${{ steps.pin.outputs.ingest_oaipmh }}
      ingest_hf: ${{ steps.pin.outputs.ingest_hf }}
      ingest_arxiv_html: ${{ steps.pin.outputs.ingest_arxiv_html }}
      processor: ${{ steps.pin.outputs.processor }}
      processor_foundry: ${{ steps.pin.outputs.processor_foundry }}
      processor_quality_model: ${{ steps.pin.outputs.processor_quality_model }}
      processor_kenlm_model: ${{ steps.pin.outputs.processor_kenlm_model }}
      processor_fetcher_model: ${{ steps.pin.outputs.processor_fetcher_model }}
      ui: ${{ steps.pin.outputs.ui }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable component manifests
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          pin_component() {
            local output_name="$1"
            local repository="$2"
            local image="ghcr.io/${owner}/stream2pretrain/${repository}:${GITHUB_SHA}"
            local digest
            digest="sha256:$(
              docker buildx imagetools inspect "$image" --raw \
                | sha256sum | cut -d ' ' -f1
            )"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Could not resolve an immutable digest for $image" >&2
              exit 1
            fi
            echo "${output_name}=${digest}" >> "$GITHUB_OUTPUT"
            echo "Pinned ${repository}@${digest}"
          }
          pin_component ingest_rss ingest-rss
          pin_component ingest_oaipmh ingest-oaipmh
          pin_component ingest_hf ingest-hf
          pin_component ingest_arxiv_html ingest-arxiv-html
          pin_component processor processor
          pin_component processor_foundry processor-foundry
          pin_component processor_quality_model processor-quality-model
          pin_component processor_kenlm_model processor-kenlm-model
          pin_component processor_fetcher_model processor-fetcher-model
          pin_component ui ui

  deploy:
    name: Deploy application release
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && inputs.mode != 'deploy') ||
      (needs.changes.outputs.deploy == 'true' &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped') &&
      needs.build.result == 'success' &&
      needs.image-pin.result == 'success'))
    needs:
      - changes
      - validate
      - build
      - image-pin
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CISCO_VPN_SERVER: ${{ vars.CISCO_VPN_SERVER }}
      CISCO_VPN_USERNAME: ${{ vars.CISCO_VPN_USERNAME }}
      CISCO_VPN_PASSWORD: ${{ secrets.CISCO_VPN_PASSWORD }}
      CISCO_VPN_AUTHGROUP: ${{ vars.CISCO_VPN_AUTHGROUP }}
      CISCO_VPN_SERVERCERT: ${{ vars.CISCO_VPN_SERVERCERT }}
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      GHCR_PULL_USERNAME: ${{ vars.GHCR_PULL_USERNAME }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      DEPLOY_MODE: ${{ inputs.mode || 'deploy' }}
      CORE_CHANGED: ${{ needs.changes.outputs.core }}
      SOURCES_CHANGED: ${{ needs.changes.outputs.sources }}
      MONITORING_CHANGED: ${{ needs.changes.outputs.monitoring }}
      REDPANDA_CHANGED: ${{ needs.changes.outputs.redpanda }}
      DNS_INFRA_CHANGED: ${{ needs.changes.outputs.dns_infra }}
      MODEL_RUNTIME_CHANGED: ${{ needs.changes.outputs.model_runtime }}
      IMAGE_DIGEST_INGEST_RSS: ${{ needs.image-pin.outputs.ingest_rss }}
      IMAGE_DIGEST_INGEST_OAIPMH: ${{ needs.image-pin.outputs.ingest_oaipmh }}
      IMAGE_DIGEST_INGEST_HF: ${{ needs.image-pin.outputs.ingest_hf }}
      IMAGE_DIGEST_INGEST_ARXIV_HTML: ${{ needs.image-pin.outputs.ingest_arxiv_html }}
      IMAGE_DIGEST_PROCESSOR: ${{ needs.image-pin.outputs.processor }}
      IMAGE_DIGEST_PROCESSOR_FOUNDRY: ${{ needs.image-pin.outputs.processor_foundry }}
      IMAGE_DIGEST_PROCESSOR_QUALITY: ${{ needs.image-pin.outputs.processor_quality_model }}
      IMAGE_DIGEST_PROCESSOR_KENLM: ${{ needs.image-pin.outputs.processor_kenlm_model }}
      IMAGE_DIGEST_PROCESSOR_FETCHER: ${{ needs.image-pin.outputs.processor_fetcher_model }}
      IMAGE_DIGEST_UI: ${{ needs.image-pin.outputs.ui }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install Helm 3
        uses: azure/setup-helm@v5.0.1
        with:
          version: "${{ env.HELM_VERSION }}"

      - name: Install Helmfile
        shell: bash
        run: |
          set -euo pipefail
          archive_version="${HELMFILE_VERSION#v}"
          archive="$RUNNER_TEMP/helmfile.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/helmfile/helmfile/releases/download/${HELMFILE_VERSION}/helmfile_${archive_version}_linux_amd64.tar.gz" \
            --output "$archive"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/helmfile" /usr/local/bin/helmfile

      - name: Install Cisco AnyConnect-compatible VPN client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openconnect vpnc-scripts jq

      - name: Connect to VPN and deploy
        shell: bash
        run: |
          set -Eeuo pipefail

          deploy_started_at="$(date +%s)"
          phase_started_at="$deploy_started_at"
          finish_phase() {
            local name="$1"
            local now
            now="$(date +%s)"
            echo "::notice title=Deployment phase::${name}: $((now - phase_started_at))s"
            phase_started_at="$now"
          }

          : "${CISCO_VPN_SERVER:?Missing CISCO_VPN_SERVER}"
          : "${CISCO_VPN_USERNAME:?Missing CISCO_VPN_USERNAME}"
          : "${CISCO_VPN_PASSWORD:?Missing CISCO_VPN_PASSWORD}"
          : "${KUBECONFIG_B64:?Missing KUBECONFIG_B64}"

          kubeconfig="$RUNNER_TEMP/stream2pretrain-kubeconfig"
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$kubeconfig"
          chmod 600 "$kubeconfig"
          export KUBECONFIG="$kubeconfig"

          api_server="$(kubectl config view --raw -o jsonpath='{.clusters[0].cluster.server}')"
          api_host="${api_server#https://}"
          if [[ "$api_host" == \[*\]* ]]; then
            api_host="${api_host#\[}"
            api_host="${api_host%%\]*}"
          else
            api_host="${api_host%%:*}"
          fi

          vpnc_script="$(dpkg -L vpnc-scripts | awk '/\/vpnc-script$/ {print; exit}')"
          if [[ -z "$vpnc_script" || ! -x "$vpnc_script" ]]; then
            echo "The vpnc-scripts package did not provide an executable vpnc-script." >&2
            dpkg -L vpnc-scripts >&2 || true
            exit 1
          fi

          vpn_log="$RUNNER_TEMP/openconnect.log"
          vpn_pid=""
          ui_port_forward_pid=""
          foundry_port_forward_pid=""
          prometheus_port_forward_pid=""
          curator_canary_job=""
          curator_migration_pod=""
          vpn_args=(
            --protocol=anyconnect
            --user="$CISCO_VPN_USERNAME"
            --passwd-on-stdin
            --script="$vpnc_script"
          )
          if [[ -n "${CISCO_VPN_AUTHGROUP:-}" ]]; then
            vpn_args+=(--authgroup="$CISCO_VPN_AUTHGROUP")
          fi
          if [[ -n "${CISCO_VPN_SERVERCERT:-}" ]]; then
            vpn_args+=(--servercert="$CISCO_VPN_SERVERCERT")
          fi

          start_vpn() {
            : > "$vpn_log"
            printf '%s\n' "$CISCO_VPN_PASSWORD" \
              | sudo -n openconnect "${vpn_args[@]}" "$CISCO_VPN_SERVER" \
                  >"$vpn_log" 2>&1 &
            vpn_pid=$!
          }
          stop_vpn() {
            if [[ -n "$vpn_pid" ]]; then
              sudo -n kill "$vpn_pid" 2>/dev/null || true
              wait "$vpn_pid" 2>/dev/null || true
              vpn_pid=""
            fi
          }
          cleanup() {
            if [[ -n "$curator_canary_job" ]]; then
              kubectl -n stream2pretrain delete "job/$curator_canary_job" \
                --ignore-not-found --wait=false >/dev/null 2>&1 || true
            fi
            if [[ -n "$curator_migration_pod" ]]; then
              kubectl -n stream2pretrain delete "pod/$curator_migration_pod" \
                --ignore-not-found --wait=false >/dev/null 2>&1 || true
            fi
            if [[ -n "$ui_port_forward_pid" ]]; then
              kill "$ui_port_forward_pid" 2>/dev/null || true
            fi
            if [[ -n "$foundry_port_forward_pid" ]]; then
              kill "$foundry_port_forward_pid" 2>/dev/null || true
            fi
            if [[ -n "$prometheus_port_forward_pid" ]]; then
              kill "$prometheus_port_forward_pid" 2>/dev/null || true
            fi
            stop_vpn
            sudo -n pkill -TERM -x openconnect 2>/dev/null || true
          }
          trap cleanup EXIT

          tunnel_ready=false
          vpn_interface=""
          for connection_attempt in $(seq 1 3); do
            start_vpn
            for _ in $(seq 1 15); do
              if ! kill -0 "$vpn_pid" 2>/dev/null; then
                break
              fi
              vpn_interface="$(
                ip -o link show up \
                  | awk -F': ' '$2 ~ /^tun[0-9]+$/ {print $2; exit}'
              )"
              if [[ -n "$vpn_interface" ]]; then
                if [[ "$api_host" != *:* ]] \
                  || ip -6 -o addr show dev "$vpn_interface" scope global \
                    | grep -q 'inet6'; then
                  tunnel_ready=true
                  break 2
                fi
              fi
              sleep 2
            done
            echo "VPN attempt ${connection_attempt} did not provide a usable tunnel; reconnecting." >&2
            tail -n 40 "$vpn_log" >&2 || true
            stop_vpn
            for _ in $(seq 1 10); do
              if ! ip -o link show up \
                | awk -F': ' '$2 ~ /^tun[0-9]+$/ {found=1} END {exit found ? 0 : 1}'; then
                break
              fi
              sleep 1
            done
          done
          if [[ "$tunnel_ready" != true ]]; then
            tail -n 80 "$vpn_log" >&2 || true
            echo "Cisco VPN tunnel did not become ready." >&2
            exit 1
          fi

          if [[ -z "$vpn_interface" ]]; then
            echo "Cisco VPN tunnel interface was not found." >&2
            ip -br link >&2 || true
            exit 1
          fi
          ip -o link show dev "$vpn_interface" >&2 || true
          ip -6 -o addr show dev "$vpn_interface" >&2 || true

          if [[ "$api_host" == *:* ]] && ! ip -6 route get "$api_host" >/dev/null 2>&1; then
            route_ready=false
            for _ in $(seq 1 30); do
              vpn_interface="$(
                ip -o link show up \
                  | awk -F': ' '$2 ~ /^tun[0-9]+$/ {print $2; exit}'
              )"
              if [[ -z "$vpn_interface" ]] \
                || ! ip -6 -o addr show dev "$vpn_interface" scope global \
                  | grep -q 'inet6'; then
                sleep 1
                continue
              fi
              vpn_peer="$(ip -6 -o addr show dev "$vpn_interface" scope global \
                | sed -n 's/.* peer \([^ ]*\)\/[0-9][0-9]*.*/\1/p' \
                | head -n 1)"
              if [[ -n "$vpn_peer" ]]; then
                route_args=("$api_host/128" via "$vpn_peer" dev "$vpn_interface" onlink)
              else
                route_args=("$api_host/128" dev "$vpn_interface")
              fi
              if sudo -n ip -6 route replace "${route_args[@]}"; then
                route_ready=true
                break
              fi
              sleep 1
            done
            if [[ "$route_ready" != true ]]; then
              ip -br link >&2 || true
              ip -6 route >&2 || true
              echo "Could not install an IPv6 route to the Kubernetes API through the VPN." >&2
              exit 1
            fi
          fi
          ip -6 route get "$api_host" >&2 || true

          kubectl --request-timeout=20s get nodes
          finish_phase "VPN and cluster connection"

          if [[ "$DNS_INFRA_CHANGED" == "true" ]]; then
            kubectl -n kube-system patch deployment/coredns \
              --type=strategic \
              --patch-file=infra/kubernetes/coredns-ha-patch.yaml
            kubectl apply -f infra/kubernetes/coredns-pdb.yaml
            kubectl -n kube-system rollout status deployment/coredns --timeout=180s
          else
            coredns_replicas="$(
              kubectl -n kube-system get deployment/coredns \
                -o jsonpath='{.spec.replicas}'
            )"
            if [[ "$coredns_replicas" -lt 2 ]] \
               || ! kubectl -n kube-system get poddisruptionbudget/coredns >/dev/null; then
              echo "CoreDNS HA drifted; apply infra/kubernetes/coredns-* before deploying." >&2
              exit 1
            fi
          fi
          finish_phase "CoreDNS availability preflight"

          # One explicitly approved reset discards only the historical Kafka
          # backlog. Existing Iceberg data and dedup state remain intact. Core
          # Bytewax flows switch to new durable recovery identities and import
          # the broker frontier committed here. The marker makes this action
          # impossible to repeat accidentally on later deployments.
          frontier_reset_applied=false
          curator_frontier_reset_active=false
          github_removal_applied=false
          github_removal_marker=stream2pretrain-github-source-removed-20260825
          if [[ "$DEPLOY_MODE" == "deploy" ]] \
             && ! kubectl -n stream2pretrain get "configmap/$github_removal_marker" \
                  >/dev/null 2>&1; then
            echo "::group::Remove GitHub source and discard its shared-topic backlog"
            kubectl -n stream2pretrain patch \
              cronjob/stream2pretrain-ingest-github-releases \
              --type=merge -p '{"spec":{"suspend":true}}' 2>/dev/null || true
            kubectl -n stream2pretrain annotate \
              scaledobject/stream2pretrain-ingest-github-tarball-fetcher \
              autoscaling.keda.sh/paused=true --overwrite 2>/dev/null || true
            for target in \
              deployment/stream2pretrain-ingest-github-tarball-fetcher \
              deployment/stream2pretrain-ingest-github-events \
              deployment/stream2pretrain-processor-fetcher \
              statefulset/stream2pretrain-processor-curate; do
              if kubectl -n stream2pretrain get "$target" >/dev/null 2>&1; then
                kubectl -n stream2pretrain scale "$target" --replicas=0 --timeout=180s
              fi
            done
            for selector in \
              app.kubernetes.io/component=ingest-github-tarball-fetcher \
              app.kubernetes.io/component=processor-fetcher \
              app.kubernetes.io/component=processor-curate; do
              if kubectl -n stream2pretrain get pod -l "$selector" -o name | grep -q .; then
                kubectl -n stream2pretrain wait --for=delete pod \
                  -l "$selector" --timeout=240s
              fi
            done
            kubectl -n redpanda exec statefulset/redpanda -- \
              rpk group seek s2p-fetcher --to end --topics raw.fetched --allow-new-topics
            kubectl -n redpanda exec statefulset/redpanda -- \
              rpk group seek s2p-arxiv-html-fetcher-v2 --to end \
                --topics raw.fetched --allow-new-topics
            kubectl -n redpanda exec statefulset/redpanda -- \
              rpk group seek s2p-curate --to end --topics docs.normalized --allow-new-topics
            if kubectl -n redpanda exec statefulset/redpanda -- \
              rpk topic list | awk 'NR > 1 {print $1}' | grep -Fxq github.release.jobs; then
              kubectl -n redpanda exec statefulset/redpanda -- \
                rpk topic delete github.release.jobs
            fi
            kubectl -n stream2pretrain exec -i deployment/stream2pretrain-duckdb -- \
              python - < scripts/remove_github_source_objects.py
            kubectl -n stream2pretrain delete \
              deployment/stream2pretrain-ingest-github-tarball-fetcher \
              deployment/stream2pretrain-ingest-github-events \
              service/stream2pretrain-ingest-github-tarball-fetcher \
              scaledobject/stream2pretrain-ingest-github-tarball-fetcher \
              cronjob/stream2pretrain-ingest-github-releases \
              secret/stream2pretrain-github \
              --ignore-not-found --wait=true
            kubectl -n stream2pretrain create configmap "$github_removal_marker" \
              --from-literal=removed-at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --from-literal=git-sha="$GITHUB_SHA" \
              --from-literal=policy="remove-github-source-and-shared-backlog" \
              --dry-run=client -o yaml | kubectl apply -f -
            github_removal_applied=true
            curator_frontier_reset_active=true
            echo "::endgroup::"
          fi
          frontier_reset_marker=stream2pretrain-live-frontier-20260825
          if [[ "$DEPLOY_MODE" == "deploy" ]] \
             && ! kubectl -n stream2pretrain get "configmap/$frontier_reset_marker" \
                  >/dev/null 2>&1; then
            echo "::group::Reset historical backlog to the current live frontier"
            scale_to_zero_if_present() {
              local kind="$1"
              local name="$2"
              if kubectl -n stream2pretrain get "$kind/$name" >/dev/null 2>&1; then
                kubectl -n stream2pretrain scale "$kind/$name" \
                  --replicas=0 --timeout=180s
              else
                echo "$kind/$name is already absent"
              fi
            }
            scale_to_zero_if_present deployment stream2pretrain-processor-fetcher
            scale_to_zero_if_present deployment stream2pretrain-processor-iceberg-writer
            scale_to_zero_if_present deployment stream2pretrain-ingest-arxiv-html
            scale_to_zero_if_present statefulset stream2pretrain-processor-curate
            for selector in \
              app.kubernetes.io/component=processor-fetcher \
              app.kubernetes.io/component=processor-curate \
              app.kubernetes.io/component=processor-iceberg-writer \
              app.kubernetes.io/component=ingest-arxiv-html; do
              if kubectl -n stream2pretrain get pod -l "$selector" -o name \
                | grep -q .; then
                kubectl -n stream2pretrain wait --for=delete pod \
                  -l "$selector" --timeout=240s
              fi
              # `kubectl wait -l` snapshots matching objects. A terminating
              # ReplicaSet Pod can disappear from that snapshot while the API
              # list cache still exposes it briefly. Require the selector to
              # converge to an empty set before touching broker offsets.
              for _ in $(seq 1 60); do
                if ! kubectl -n stream2pretrain get pod -l "$selector" -o name \
                  | grep -q .; then
                  break
                fi
                sleep 2
              done
              if kubectl -n stream2pretrain get pod -l "$selector" -o name \
                | grep -q .; then
                kubectl -n stream2pretrain get pod -l "$selector" \
                  -o wide >&2 || true
                echo "A reset-target consumer is still running: $selector" >&2
                exit 1
              fi
            done
            seek_to_live_frontier() {
              local group="$1"
              local topics="$2"
              kubectl -n redpanda exec statefulset/redpanda -- \
                rpk group seek "$group" --to end --topics "$topics" \
                  --allow-new-topics
              kubectl -n redpanda exec statefulset/redpanda -- \
                rpk group describe "$group"
            }
            seek_to_live_frontier s2p-fetcher raw.fetched
            seek_to_live_frontier s2p-curate docs.normalized
            seek_to_live_frontier s2p-iceberg-writer curation.decisions
            seek_to_live_frontier s2p-iceberg-writer-licenses license.admissions
            seek_to_live_frontier s2p-arxiv-html-fetcher-v2 raw.fetched
            kubectl -n stream2pretrain create configmap "$frontier_reset_marker" \
              --from-literal=reset-at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --from-literal=git-sha="$GITHUB_SHA" \
              --from-literal=policy="discard-historical-backlog-start-live" \
              --dry-run=client -o yaml \
              | kubectl apply -f -
            frontier_reset_applied=true
            echo "::endgroup::"
          fi

          # The source-noise reset moved the raw fetcher frontier but retained
          # the already-normalized GitHub catch-up behind the curator. Discard
          # that explicitly approved one-time backlog before measuring whether
          # one correctly running live worker can keep pace. The v3 recovery
          # directory and its global dedup state remain retained on the PVC;
          # the v5 flow starts from the broker frontier recorded here.
          curator_frontier_reset_marker=stream2pretrain-curator-live-frontier-20260825
          if [[ "$DEPLOY_MODE" == "deploy" ]]; then
            if kubectl -n stream2pretrain get \
              "configmap/$curator_frontier_reset_marker" >/dev/null 2>&1; then
              curator_frontier_reset_active=true
            else
              echo "::group::Discard normalized historical source catch-up"
              if kubectl -n stream2pretrain get \
                statefulset/stream2pretrain-processor-curate >/dev/null 2>&1; then
                kubectl -n stream2pretrain scale \
                  statefulset/stream2pretrain-processor-curate \
                  --replicas=0 --timeout=180s
                if kubectl -n stream2pretrain get pod \
                  -l app.kubernetes.io/component=processor-curate -o name \
                  | grep -q .; then
                  kubectl -n stream2pretrain wait --for=delete pod \
                    -l app.kubernetes.io/component=processor-curate --timeout=240s
                fi
              fi
              kubectl -n redpanda exec statefulset/redpanda -- \
                rpk group seek s2p-curate --to end --topics docs.normalized \
                  --allow-new-topics
              kubectl -n redpanda exec statefulset/redpanda -- \
                rpk group describe s2p-curate
              kubectl -n stream2pretrain create configmap \
                "$curator_frontier_reset_marker" \
                --from-literal=reset-at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --from-literal=git-sha="$GITHUB_SHA" \
                --from-literal=policy="discard-normalized-historical-source-catch-up" \
                --dry-run=client -o yaml \
                | kubectl apply -f -
              curator_frontier_reset_active=true
              echo "::endgroup::"
            fi
          fi

          if [[ "$DEPLOY_MODE" == "repair-monitoring" ]]; then
            monitoring_diagnostics() {
              kubectl -n monitoring get deployment,statefulset,pod,service,endpoints \
                -o wide >&2 || true
              kubectl -n monitoring get events \
                --sort-by=.metadata.creationTimestamp >&2 || true
              kubectl -n monitoring describe pod/prometheus-kps-prometheus-0 >&2 || true
              kubectl -n monitoring logs prometheus-kps-prometheus-0 \
                -c prometheus --tail=200 >&2 || true
              kubectl -n monitoring logs prometheus-kps-prometheus-0 \
                -c prometheus --previous --tail=200 >&2 || true
              kubectl top pods -A --containers >&2 || true
            }
            if ! helmfile \
              --helm-binary "$(command -v helm)" \
              --file helmfile.yaml \
              --environment dev \
              --selector name=kube-prometheus-stack \
              apply \
              --reset-values \
              --wait=false \
              --timeout 600 \
              --suppress-secrets; then
              monitoring_diagnostics
              exit 1
            fi
            if ! kubectl -n monitoring wait \
              --for=condition=Ready pod/prometheus-kps-prometheus-0 \
              --timeout=600s; then
              monitoring_diagnostics
              exit 1
            fi
            kubectl -n monitoring port-forward \
              service/kps-prometheus 19090:9090 \
              >"$RUNNER_TEMP/prometheus-port-forward.log" 2>&1 &
            prometheus_port_forward_pid=$!
            for _ in $(seq 1 60); do
              if curl --fail --silent --show-error \
                http://127.0.0.1:19090/-/ready; then
                exit 0
              fi
              if ! kill -0 "$prometheus_port_forward_pid" 2>/dev/null; then
                cat "$RUNNER_TEMP/prometheus-port-forward.log" >&2
                exit 1
              fi
              sleep 2
            done
            monitoring_diagnostics
            exit 1
          fi

          if [[ "$DEPLOY_MODE" == "audit-ui" ]]; then
            echo "::group::Rendered browser audit"
            audit_dir="$RUNNER_TEMP/ui-audit"
          mkdir -p "$audit_dir"
          kubectl -n stream2pretrain port-forward \
            service/stream2pretrain-ui 18080:http \
            >"$RUNNER_TEMP/ui-port-forward.log" 2>&1 &
            ui_port_forward_pid=$!
            for _ in $(seq 1 30); do
              curl --fail --silent http://127.0.0.1:18080/api/health >/dev/null && break
              if ! kill -0 "$ui_port_forward_pid" 2>/dev/null; then
                cat "$RUNNER_TEMP/ui-port-forward.log" >&2
                exit 1
              fi
              sleep 1
            done
            curl --fail --silent --show-error http://127.0.0.1:18080/api/health
            google-chrome --version
            npm install \
              --prefix "$RUNNER_TEMP/browser-runtime" \
              --no-audit --no-fund --silent \
              playwright@1.55.0
            NODE_PATH="$RUNNER_TEMP/browser-runtime/node_modules" \
              CHROME_BIN="$(command -v google-chrome)" \
              node scripts/browser_audit.cjs http://127.0.0.1:18080 "$audit_dir"
            echo "::endgroup::"
            exit 0
          fi

          if [[ "$DEPLOY_MODE" == "validate-foundry" ]]; then
            echo "::group::Bounded live foundry validation"
            kubectl -n stream2pretrain rollout status \
              statefulset/stream2pretrain-foundry --timeout=180s
            # The headless Service publishes not-ready addresses so the worker
            # and API sidecars can discover each other during startup. Wait on
            # the concrete Pod before asking port-forward to select a target.
            kubectl -n stream2pretrain wait \
              --for=condition=Ready \
              pod/stream2pretrain-foundry-0 --timeout=180s
            # Run inside the API sidecar so the Foundry bearer token is never
            # consumed by the Kubernetes API server or printed by the runner.
            validation_status=0
            kubectl -n stream2pretrain exec -i \
              statefulset/stream2pretrain-foundry -c api -- python - \
              < scripts/validate_foundry_live.py || validation_status=$?
            kubectl -n stream2pretrain exec -i \
              statefulset/stream2pretrain-foundry -c api -- python - \
              < scripts/foundry_diagnostics.py || true
            echo "::endgroup::"
            if [[ "$validation_status" -ne 0 ]]; then
              exit "$validation_status"
            fi
            exit 0
          fi

          if [[ "$DEPLOY_MODE" == "validate-sources" ]]; then
            echo "::group::Bounded live source validation"
            kubectl -n stream2pretrain get sourcefeeds.stream2pretrain.io -o wide || true
            source_count="$(
              kubectl -n stream2pretrain get sourcefeeds.stream2pretrain.io \
                -o name | wc -l
            )"
            if [[ "$source_count" -ne 5 ]]; then
              echo "Expected exactly five internal arXiv discovery SourceFeeds, found $source_count" >&2
              exit 1
            fi
            kubectl -n stream2pretrain rollout status \
              deployment/stream2pretrain-ingest-hf-cards --timeout=180s
            kubectl -n stream2pretrain rollout status \
              deployment/stream2pretrain-ingest-arxiv-html --timeout=180s

            cronjobs=(stream2pretrain-iceberg-maintenance)
            while read -r cronjob; do
              [[ -n "$cronjob" ]] || continue
              cronjobs+=("${cronjob#cronjob.batch/}")
            done < <(
              kubectl -n stream2pretrain get cronjob \
                -l stream2pretrain.io/source-feed \
                -o name
            )

            dump_source_job() {
              local job="$1"
              echo "Diagnostics for source validation job: $job" >&2
              kubectl -n stream2pretrain get "job/$job" -o wide || true
              kubectl -n stream2pretrain describe "job/$job" || true
              local pods=()
              mapfile -t pods < <(
                kubectl -n stream2pretrain get pods \
                  -l "job-name=$job" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' \
                  2>/dev/null || true
              )
              if (( ${#pods[@]} == 0 )); then
                echo "No Pod was created for $job" >&2
                return
              fi
              kubectl -n stream2pretrain get pods "${pods[@]}" -o wide || true
              for pod in "${pods[@]}"; do
                kubectl -n stream2pretrain describe "pod/$pod" || true
                kubectl -n stream2pretrain logs "pod/$pod" \
                  --all-containers --prefix --ignore-errors || true
                kubectl -n stream2pretrain logs "pod/$pod" \
                  --all-containers --prefix --previous --ignore-errors || true
              done
            }

            wait_for_source_job() {
              local job="$1"
              local deadline=$((SECONDS + 1800))
              local progress_iteration=0
              while (( SECONDS < deadline )); do
                local succeeded failed
                succeeded="$(
                  kubectl -n stream2pretrain get "job/$job" \
                    -o jsonpath='{.status.succeeded}' 2>/dev/null || true
                )"
                failed="$(
                  kubectl -n stream2pretrain get "job/$job" \
                    -o jsonpath='{.status.failed}' 2>/dev/null || true
                )"
                if [[ "$succeeded" == "1" ]]; then
                  kubectl -n stream2pretrain logs "job/$job" \
                    --all-containers --prefix --ignore-errors || true
                  return 0
                fi
                if [[ -n "$failed" && "$failed" != "0" ]]; then
                  dump_source_job "$job"
                  echo "Source validation job failed: $job" >&2
                  return 1
                fi
                progress_iteration=$((progress_iteration + 1))
                if (( progress_iteration == 1 || progress_iteration % 6 == 0 )); then
                  echo "Waiting for source validation job: $job"
                  kubectl -n stream2pretrain get "job/$job" \
                    -o custom-columns='NAME:.metadata.name,ACTIVE:.status.active,SUCCEEDED:.status.succeeded,FAILED:.status.failed,STARTED:.status.startTime' \
                    || true
                  kubectl -n stream2pretrain get pods \
                    -l "job-name=$job" -o wide || true
                fi
                sleep 10
              done
              dump_source_job "$job"
              echo "Source validation timed out: $job" >&2
              return 1
            }

            validation_jobs=()
            for cronjob in "${cronjobs[@]}"; do
              if ! kubectl -n stream2pretrain get "cronjob/$cronjob" >/dev/null 2>&1; then
                echo "Required source CronJob is missing: $cronjob" >&2
                exit 1
              fi
              suffix="${GITHUB_RUN_ID: -8}${GITHUB_RUN_ATTEMPT}"
              base="${cronjob#stream2pretrain-}"
              job="s2p-val-${base:0:42}-${suffix}"
              kubectl -n stream2pretrain delete "job/$job" --ignore-not-found --wait=true
              kubectl -n stream2pretrain create job "$job" \
                --from="cronjob/$cronjob" --dry-run=client -o json \
                | jq '
                    .spec.backoffLimit = 0
                    | .spec.ttlSecondsAfterFinished = 900
                    | .spec.template.spec.restartPolicy = "Never"
                  ' \
                | kubectl -n stream2pretrain apply -f -
              validation_jobs+=("$job")
              if ! wait_for_source_job "$job"; then
                exit 1
              fi
            done

            hf_logs="$(
              kubectl -n stream2pretrain logs \
                deployment/stream2pretrain-ingest-hf-cards --tail=240
            )"
            printf '%s\n' "$hf_logs"
            grep -Eq 'hf_poller.pass_done.*models=[1-9][0-9]*' <<<"$hf_logs" || {
              echo "HF model source completed but admitted no licensed model" >&2
              exit 1
            }
            kubectl -n stream2pretrain logs \
              deployment/stream2pretrain-ingest-arxiv-html --tail=240
            kubectl -n stream2pretrain rollout status \
              deployment/stream2pretrain-duckdb --timeout=180s
            kubectl -n stream2pretrain exec -i deployment/stream2pretrain-duckdb -- \
              python - < scripts/validate_corpus_live.py
            echo "::endgroup::"
            exit 0
          fi

          if [[ "$DEPLOY_MODE" == "recover-storage" ]]; then
            echo "::group::Pause storage writers"
            kubectl -n stream2pretrain annotate scaledobject --all \
              autoscaling.keda.sh/paused=true --overwrite || true
            kubectl -n stream2pretrain scale \
              deployment/stream2pretrain-processor-iceberg-writer \
              --replicas=0
            while read -r cronjob; do
              [[ -n "$cronjob" ]] || continue
              kubectl -n stream2pretrain patch "$cronjob" \
                --type=merge -p '{"spec":{"suspend":true}}'
            done < <(kubectl -n stream2pretrain get cronjob -o name)
            echo "::endgroup::"

            echo "::group::Compact durable curator LevelDB state"
            curator_statefulset=stream2pretrain-processor-curate
            curator_compactor=stream2pretrain-curator-state-compactor
            curator_replicas="$(
              kubectl -n stream2pretrain get "statefulset/$curator_statefulset" \
                -o jsonpath='{.spec.replicas}'
            )"
            curator_image="$(
              kubectl -n stream2pretrain get "statefulset/$curator_statefulset" -o json \
                | jq -r '
                    .spec.template.spec.containers[]
                    | select(.name == "curate")
                    | .image
                  '
            )"
            curator_claim="$(
              kubectl -n stream2pretrain get pvc \
                -l app.kubernetes.io/component=processor-curate -o json \
                | jq -r 'first(.items[].metadata.name) // empty'
            )"
            : "${curator_image:?Curator image was not found}"
            : "${curator_claim:?Curator checkpoint PVC was not found}"

            kubectl -n stream2pretrain scale \
              "statefulset/$curator_statefulset" --replicas=0
            kubectl -n stream2pretrain wait --for=delete \
              "pod/${curator_statefulset}-0" --timeout=180s \
              || ! kubectl -n stream2pretrain get \
                "pod/${curator_statefulset}-0" >/dev/null 2>&1
            kubectl -n stream2pretrain delete "job/$curator_compactor" \
              --ignore-not-found --wait=true

            compaction_script="$(< scripts/compact_lsh_state.py)"
            compactor_json="$(
              kubectl -n stream2pretrain create job "$curator_compactor" \
                --image="$curator_image" --dry-run=client -o json
            )"
            compaction_ok=true
            if ! jq \
              --arg claim "$curator_claim" \
              --arg script "$compaction_script" '
                .spec.backoffLimit = 0
                | .spec.activeDeadlineSeconds = 1800
                | .spec.ttlSecondsAfterFinished = 300
                | .spec.template.spec.priorityClassName = "system-node-critical"
                | .spec.template.spec.tolerations = [{
                    key: "node.kubernetes.io/disk-pressure",
                    operator: "Exists",
                    effect: "NoSchedule"
                  }]
                | .spec.template.spec.containers[0].name = "compactor"
                | .spec.template.spec.containers[0].command = ["python", "-c", $script]
                | .spec.template.spec.containers[0].imagePullPolicy = "IfNotPresent"
                | .spec.template.spec.containers[0].resources = {
                    requests: {
                      cpu: "50m",
                      memory: "128Mi",
                      "ephemeral-storage": "16Mi"
                    },
                    limits: {
                      cpu: "500m",
                      memory: "512Mi",
                      "ephemeral-storage": "128Mi"
                    }
                  }
                | .spec.template.spec.containers[0].volumeMounts = [{
                    name: "checkpoint",
                    mountPath: "/var/lib/s2p/checkpoint"
                  }]
                | .spec.template.spec.volumes = [{
                    name: "checkpoint",
                    persistentVolumeClaim: {claimName: $claim}
                  }]
              ' <<<"$compactor_json" \
              | kubectl -n stream2pretrain apply -f -; then
              compaction_ok=false
            elif ! kubectl -n stream2pretrain wait \
              --for=condition=Complete "job/$curator_compactor" --timeout=1800s; then
              compaction_ok=false
            fi
            kubectl -n stream2pretrain logs "job/$curator_compactor" \
              --all-containers --prefix --ignore-errors || true
            if [[ "$compaction_ok" != true ]]; then
              kubectl -n stream2pretrain describe "job/$curator_compactor" || true
            fi
            kubectl -n stream2pretrain delete "job/$curator_compactor" \
              --ignore-not-found --wait=false
            kubectl -n stream2pretrain scale \
              "statefulset/$curator_statefulset" --replicas="$curator_replicas"
            kubectl -n stream2pretrain get \
              "statefulset/$curator_statefulset" pod -o wide || true
            if [[ "$compaction_ok" != true ]]; then
              echo "Curator state compaction failed; the original PVC was preserved." >&2
              exit 1
            fi
            echo "::endgroup::"

            echo "::group::Start MinIO for API-level recovery"
            kubectl -n minio patch deployment/minio --type=merge -p '
              {"spec":{"template":{"spec":{
                "priorityClassName":"system-node-critical",
                "tolerations":[{
                  "key":"node.kubernetes.io/disk-pressure",
                  "operator":"Exists",
                  "effect":"NoSchedule"
                }]
              }}}}'
            kubectl -n minio rollout status deployment/minio --timeout=180s
            minio_ready=false
            for _ in $(seq 1 60); do
              ready_addresses="$(
                kubectl -n minio get endpointslice \
                  -l kubernetes.io/service-name=minio -o json \
                  | jq '[
                      .items[].endpoints[]?
                      | select(.conditions.ready != false)
                      | .addresses[]?
                    ] | length'
              )"
              if [[ "$ready_addresses" -gt 0 ]]; then
                minio_ready=true
                break
              fi
              sleep 2
            done
            if [[ "$minio_ready" != true ]]; then
              kubectl -n minio get deployment,pod,endpointslice -o wide
              exit 1
            fi
            kubectl -n polaris rollout status deployment/polaris --timeout=180s
            kubectl -n stream2pretrain rollout status \
              deployment/stream2pretrain-duckdb --timeout=180s
            echo "::endgroup::"

            echo "::group::Restore the Polaris catalog and plan cleanup"
            kubectl -n stream2pretrain exec -i \
              deployment/stream2pretrain-duckdb -- python - \
              < scripts/bootstrap_polaris.py
            kubectl -n stream2pretrain exec -i \
              deployment/stream2pretrain-duckdb -- python - \
              < processor/iceberg_maintenance.py
            echo "::endgroup::"

            echo "::group::Apply bounded Iceberg cleanup"
            kubectl -n stream2pretrain exec -i \
              deployment/stream2pretrain-duckdb -- \
              python - --apply --register-missing \
              < processor/iceberg_maintenance.py
            echo "::endgroup::"

            echo "::group::Wait for node pressure to clear"
            for _ in $(seq 1 60); do
              pressure="$(kubectl get node stream2pretrain-worker-2 \
                -o jsonpath='{.status.conditions[?(@.type=="DiskPressure")].status}')"
              [[ "$pressure" == "False" ]] && break
              sleep 5
            done
            pressure="$(kubectl get node stream2pretrain-worker-2 \
              -o jsonpath='{.status.conditions[?(@.type=="DiskPressure")].status}')"
            if [[ "$pressure" != "False" ]]; then
              kubectl describe node stream2pretrain-worker-2
              exit 1
            fi
            kubectl get --raw \
              /api/v1/nodes/stream2pretrain-worker-2/proxy/stats/summary \
              | jq '{node: .node.nodeName, rootFs: .node.fs}'
            echo "::endgroup::"

            echo "::group::Remove recovery scheduling override"
            kubectl -n minio patch deployment/minio --type=json -p '[
              {"op":"remove","path":"/spec/template/spec/priorityClassName"},
              {"op":"remove","path":"/spec/template/spec/tolerations"}
            ]'
            kubectl -n minio rollout status deployment/minio --timeout=180s
            while read -r cronjob; do
              [[ -n "$cronjob" ]] || continue
              kubectl -n stream2pretrain patch "$cronjob" \
                --type=merge -p '{"spec":{"suspend":false}}'
            done < <(kubectl -n stream2pretrain get cronjob -o name)
            echo "The writer remains paused until a normal deployment installs the fixed image."
            echo "::endgroup::"
            exit 0
          fi

          if [[ "$DEPLOY_MODE" == "inspect-storage" ]]; then
            # Query the S3 API instead of recursively walking the MinIO PVC.
            # The latter took longer than ten minutes once the object count
            # grew, while this reports the logical retained bytes we need for
            # lifecycle sizing and does not depend on a node-local PVC path.
            kubectl -n stream2pretrain exec -i \
              deployment/stream2pretrain-duckdb -- \
              python - < scripts/inspect_object_store.py
            exit 0
          fi

          if [[ "$DEPLOY_MODE" == "diagnose" ]]; then
            echo "::group::Read-only cluster diagnostics"
            echo "::group::Helm release state"
            helm list --all --all-namespaces || true
            helm history stream2pretrain -n stream2pretrain || true
            helm status stream2pretrain -n stream2pretrain --show-desc || true
            echo "::endgroup::"
            kubectl get nodes -o json | jq -r '
              .items[]
              | {
                  name: .metadata.name,
                  addresses: .status.addresses,
                  taints: (.spec.taints // []),
                  conditions: [
                    .status.conditions[]
                    | select(
                        .type == "Ready"
                        or .type == "DiskPressure"
                        or .type == "MemoryPressure"
                        or .type == "PIDPressure"
                      )
                    | {type, status, reason, message, lastTransitionTime}
                  ],
                  capacity: .status.capacity,
                  allocatable: .status.allocatable
                }
            '
            kubectl top nodes || true
            kubectl -n stream2pretrain top pods --containers || true
            for node in $(kubectl get nodes -o name); do
              node="${node#node/}"
              kubectl get --raw "/api/v1/nodes/${node}/proxy/stats/summary" \
                | jq '{
                    node: .node.nodeName,
                    rootFs: .node.fs,
                    imageFs: .node.runtime.imageFs,
                    containerFs: .node.runtime.containerFs
                  }' \
                || true
            done
            kubectl get persistentvolume,persistentvolumeclaim -A -o wide || true
            kubectl get storageclass -o json | jq -r '
              .items[]
              | {
                  name: .metadata.name,
                  provisioner: .provisioner,
                  allowVolumeExpansion: (.allowVolumeExpansion // false),
                  reclaimPolicy: .reclaimPolicy,
                  volumeBindingMode: .volumeBindingMode
                }
            '
            kubectl get persistentvolume -o json | jq -r '
              .items[]
              | {
                  volume: .metadata.name,
                  claim: (
                    (.spec.claimRef.namespace // "")
                    + "/"
                    + (.spec.claimRef.name // "")
                  ),
                  capacity: .spec.capacity.storage,
                  localPath: .spec.local.path,
                  nodeAffinity: .spec.nodeAffinity
                }
            '
            for node in $(kubectl get nodes -o name); do
              node="${node#node/}"
              echo "::group::Volume metrics: $node"
              kubectl get --raw "/api/v1/nodes/${node}/proxy/metrics" \
                | grep -E '^kubelet_volume_stats_(used|available|capacity)_bytes' \
                || true
              echo "::endgroup::"
            done
            kubectl get pods -A --field-selector spec.nodeName=stream2pretrain-worker-2 \
              -o wide || true
            kubectl get pods -A -o json | jq -r '
              [.items[] | {
                node: (.spec.nodeName // "unscheduled"),
                phase: .status.phase
              }]
              | group_by([.node, .phase])
              | map({
                  node: .[0].node,
                  phase: .[0].phase,
                  count: length
              })
            '
            kubectl get pods -A -o json | jq -r '
              .items[]
              | .metadata as $metadata
              | .status.containerStatuses[]?
              | select(.restartCount > 0 or .lastState.terminated != null)
              | {
                  namespace: $metadata.namespace,
                  pod: $metadata.name,
                  container: .name,
                  restarts: .restartCount,
                  lastTermination: .lastState.terminated
                }
            '
            kubectl -n stream2pretrain get ingress stream2pretrain-ui -o yaml || true
            kubectl get clusterissuer -o wide || true
            kubectl get certificate,certificaterequest,challenge -A -o wide || true
            echo "::group::Redpanda topic and consumer-group state"
            kubectl -n redpanda get pod,statefulset -o wide || true
            for topic in \
              raw.fetched \
              raw.smoke \
              docs.normalized \
              docs.normalized.smoke \
              docs.curated \
              docs.curated.smoke \
              curation.decisions \
              curation.decisions.smoke \
              license.admissions \
              license.admissions.smoke; do
              kubectl -n redpanda exec statefulset/redpanda -- \
                rpk topic describe "$topic" -p || true
            done
            for group in \
              s2p-fetcher \
              s2p-fetcher-canary \
              s2p-curate \
              s2p-iceberg-writer \
              s2p-iceberg-writer-licenses \
              s2p-arxiv-html-fetcher; do
              kubectl -n redpanda exec statefulset/redpanda -- \
                rpk group describe "$group" || true
            done
            echo "::endgroup::"

            echo "::group::Processor recovery and metrics"
            for component in processor-fetcher processor-curate processor-iceberg-writer; do
              pod="$(
                kubectl -n stream2pretrain get pod \
                  -l "app.kubernetes.io/component=${component}" \
                  -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true
              )"
              [[ -n "$pod" ]] || continue
              kubectl -n stream2pretrain exec -i "$pod" -- python - \
                < scripts/processor_runtime_diagnostics.py || true
            done
            echo "::endgroup::"

            echo "::group::Durable pretraining audit"
            kubectl -n stream2pretrain exec -i \
              deployment/stream2pretrain-duckdb -- python - <<'PY' || true
          from __future__ import annotations

          import json
          import urllib.parse
          import urllib.request
          from datetime import UTC, datetime, timedelta

          base = "http://[::1]:8090"
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))

          def request(path: str, params: list[tuple[str, str]] | None = None) -> dict:
              query = urllib.parse.urlencode(params or [])
              url = f"{base}{path}" + (f"?{query}" if query else "")
              with opener.open(url, timeout=60) as response:
                  payload = json.load(response)
              if not isinstance(payload, dict):
                  raise RuntimeError(f"non-object response from {path}")
              return payload

          now = datetime.now(UTC)
          start = now - timedelta(hours=24)
          date_from = start.isoformat()
          date_to = now.isoformat()
          accepted_routes = (
              "pretrain",
              "broad_pretraining",
              "posttrain_candidate",
              "reasoning_candidate",
          )
          overview = request("/corpus-overview")
          activity = request("/source-activity", [("window_hours", "24")])
          admissions = request("/license-admissions", [("recent_limit", "100")])
          facets = request("/document-facets")
          cumulative = {
              str(row["source"]): row
              for row in overview.get("per_source_acceptance", [])
              if isinstance(row, dict) and row.get("source")
          }
          activity_by_source = {
              str(row["source_feed"]): row
              for row in activity.get("sources", [])
              if isinstance(row, dict) and row.get("source_feed")
          }
          source_rows = []
          for source in facets.get("sources", []):
              common = [
                  ("page", "1"),
                  ("page_size", "1"),
                  ("source", str(source)),
                  ("date_from", date_from),
                  ("date_to", date_to),
              ]
              observed = request("/documents", common)
              route_counts = {}
              for route in (*accepted_routes, "quarantine", "retry"):
                  payload = request("/documents", [*common, ("route", route)])
                  route_counts[route] = int(payload.get("total", 0))
              selection = [
                  ("date_from", date_from),
                  ("date_to", date_to),
                  ("source", str(source)),
                  ("include_structured", "true"),
                  *[("route", route) for route in accepted_routes],
              ]
              export = request("/datasets/summary", selection)
              source_rows.append(
                  {
                      "source": source,
                      "last_24h": {
                          "observed": int(observed.get("total", 0)),
                          "strict_training_exports": int(export.get("documents", 0)),
                          "routes": route_counts,
                          "license": activity_by_source.get(str(source)),
                          "accepted_revisions": export.get("manifest", {}).get("revisions", {}),
                      },
                      "cumulative": cumulative.get(str(source), {"accepted": 0, "total": 0}),
                  }
              )

          print(
              json.dumps(
                  {
                      "window": {"from": date_from, "to": date_to},
                      "overview": overview,
                      "license_totals": {
                          "admitted": admissions.get("admitted", 0),
                          "posttrain_transform_only": admissions.get(
                              "posttrain_transform_only", 0
                          ),
                          "quarantined": admissions.get("quarantined", 0),
                          "by_license": admissions.get("by_license", []),
                          "recent": admissions.get("recent", []),
                      },
                      "sources": source_rows,
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY
            echo "::endgroup::"

            echo "::group::Live activity metric audit"
            kubectl -n monitoring get service,pod,servicemonitor -o wide || true
            kubectl -n monitoring port-forward \
              service/kps-prometheus 19090:9090 \
              >"$RUNNER_TEMP/prometheus-diagnose-port-forward.log" 2>&1 &
            prometheus_port_forward_pid=$!
            prometheus_ready=false
            for _ in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:19090/-/ready >/dev/null; then
                prometheus_ready=true
                break
              fi
              if ! kill -0 "$prometheus_port_forward_pid" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            if [[ "$prometheus_ready" == true ]]; then
              curl --fail --silent --show-error \
                http://127.0.0.1:19090/api/v1/label/__name__/values \
                | jq '{
                    redpanda_metric_count: ([
                      .data[] | select(startswith("redpanda_"))
                    ] | length),
                    activity_metric_present: any(
                      .data[]; . == "redpanda_kafka_max_offset"
                    )
                  }' \
                || true
              for query in \
                'up{namespace="redpanda"}' \
                'redpanda_application_uptime_seconds_total' \
                'redpanda_kafka_max_offset{redpanda_namespace="kafka"}' \
                's2p_processor_ingested_total' \
                's2p_processor_routed_total'; do
                echo "Prometheus query: $query"
                curl --fail --silent --show-error --get \
                  --data-urlencode "query=$query" \
                  http://127.0.0.1:19090/api/v1/query | jq . || true
              done
            else
              cat "$RUNNER_TEMP/prometheus-diagnose-port-forward.log" >&2 || true
            fi
            kill "$prometheus_port_forward_pid" 2>/dev/null || true
            wait "$prometheus_port_forward_pid" 2>/dev/null || true
            prometheus_port_forward_pid=""
            echo "::endgroup::"

            for namespace in minio polaris traefik stream2pretrain; do
              echo "::group::Namespace: $namespace"
              kubectl -n "$namespace" get \
                deployment,statefulset,pod,service,ingress,endpoints,endpointslice,pvc \
                -o wide || true
              kubectl -n "$namespace" get events \
                --sort-by=.metadata.creationTimestamp | tail -n 160 || true

              while read -r pod; do
                [[ -n "$pod" ]] || continue
                echo "::group::Recent logs: $namespace/$pod"
                kubectl -n "$namespace" logs "$pod" \
                  --all-containers --prefix --tail=160 || true
                kubectl -n "$namespace" logs "$pod" \
                  --all-containers --previous --prefix --tail=160 || true
                echo "::endgroup::"
              done < <(
                kubectl -n "$namespace" get pods -o json 2>/dev/null \
                  | jq -r '
                      .items[]
                      | select(.status.phase != "Succeeded")
                      | .metadata.name
                    ' \
                  || true
              )
              echo "::endgroup::"
            done
            echo "::group::Durable post-training diagnosis"
            kubectl -n stream2pretrain exec -i \
              statefulset/stream2pretrain-foundry -c api -- python - \
              < scripts/foundry_diagnostics.py || true
            echo "::endgroup::"
            echo "::endgroup::"
            exit 0
          fi

          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          registry="ghcr.io/${owner}"

          kubectl create namespace stream2pretrain --dry-run=client -o yaml | kubectl apply -f -

          cleanup_stale_monitoring_pods() {
            local pod
            local -a stale_pods
            mapfile -t stale_pods < <(
              kubectl -n monitoring get pods -o json 2>/dev/null \
                | jq -r '
                    .items[]
                    | select(
                        .metadata.deletionTimestamp != null
                        or .status.phase == "Failed"
                        or .status.phase == "Succeeded"
                        or any(
                          .status.containerStatuses[]?;
                          .state.terminated.reason == "ContainerStatusUnknown"
                        )
                      )
                    | .metadata.name
                  ' \
                || true
            )
            for pod in "${stale_pods[@]}"; do
              [[ -n "$pod" ]] || continue
              echo "Deleting terminal monitoring Pod: $pod"
              kubectl -n monitoring delete "pod/$pod" \
                --ignore-not-found --wait=false
            done
          }

          if [[ "$MONITORING_CHANGED" == "true" ]]; then
            echo "::group::Reconcile kube-prometheus-stack"
            cleanup_stale_monitoring_pods
            helmfile \
              --helm-binary "$(command -v helm)" \
              --file helmfile.yaml \
              --environment dev \
              --selector name=kube-prometheus-stack \
              sync \
              --reset-values \
              --wait=false \
              --timeout 600 \
              --suppress-secrets

            # Recreate marks the superseded, unavailable ReplicaSet Pods for
            # deletion. Remove only those terminal objects so they cannot keep
            # polluting health reports after the worker has recovered.
            sleep 2
            cleanup_stale_monitoring_pods
            grafana_secret_keys="$(
              kubectl -n monitoring get secret kube-prometheus-stack-grafana \
                -o json | jq -c '.data | keys | sort'
            )"
            echo "Grafana administrator Secret keys: $grafana_secret_keys"
            for required_key in admin-user admin-password; do
              if ! jq -e --arg key "$required_key" \
                '.data | has($key)' \
                < <(kubectl -n monitoring get secret \
                  kube-prometheus-stack-grafana -o json) >/dev/null; then
                echo "Grafana chart-owned Secret is missing key: $required_key" >&2
                exit 1
              fi
            done
            kubectl -n monitoring rollout status \
              deployment/kube-prometheus-stack-grafana --timeout=300s
            kubectl -n monitoring wait \
              --for=condition=Ready pod/prometheus-kps-prometheus-0 \
              --timeout=300s
            grafana_addresses="$(
              kubectl -n monitoring get endpointslice \
                -l kubernetes.io/service-name=kube-prometheus-stack-grafana \
                -o json \
                | jq '[
                    .items[].endpoints[]?
                    | select(.conditions.ready == true)
                    | .addresses[]?
                  ] | length'
            )"
            if [[ "$grafana_addresses" -lt 1 ]]; then
              echo "Grafana has no Ready service endpoint." >&2
              exit 1
            fi
            kubectl get --raw \
              '/api/v1/namespaces/monitoring/services/http:kube-prometheus-stack-grafana:80/proxy/api/health' \
              | jq -e '.database == "ok"' >/dev/null
            cleanup_stale_monitoring_pods
            echo "::endgroup::"
            finish_phase "Monitoring reconciliation"
          else
            echo "Keeping kube-prometheus-stack unchanged."
          fi

          if [[ "$REDPANDA_CHANGED" == "true" ]]; then
            echo "::group::Reconcile Redpanda monitoring"
            helmfile \
              --helm-binary "$(command -v helm)" \
              --file helmfile.yaml \
              --environment dev \
              --selector name=redpanda \
              sync \
              --reset-values \
              --wait=false \
              --timeout 600 \
              --suppress-secrets
            kubectl -n redpanda rollout status statefulset/redpanda --timeout=300s
            kubectl -n redpanda wait --for=condition=Ready pod/redpanda-0 \
              --timeout=300s
            kubectl -n redpanda get servicemonitor redpanda -o name
            echo "::endgroup::"
            finish_phase "Redpanda reconciliation"
          else
            echo "Keeping Redpanda unchanged."
          fi

          if [[ "$MONITORING_CHANGED" == "true" \
             || "$REDPANDA_CHANGED" == "true" ]]; then
            echo "::group::Verify Redpanda Prometheus target"
            kubectl -n monitoring port-forward \
              service/kps-prometheus 19090:9090 \
              >"$RUNNER_TEMP/prometheus-platform-port-forward.log" 2>&1 &
            prometheus_port_forward_pid=$!
            prometheus_ready=false
            for _ in $(seq 1 60); do
              if curl --fail --silent http://127.0.0.1:19090/-/ready >/dev/null; then
                prometheus_ready=true
                break
              fi
              if ! kill -0 "$prometheus_port_forward_pid" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            if [[ "$prometheus_ready" != "true" ]]; then
              cat "$RUNNER_TEMP/prometheus-platform-port-forward.log" >&2 || true
              exit 1
            fi

            redpanda_target_ready=false
            for _ in $(seq 1 60); do
              active_targets="$(
                curl --fail --silent --show-error \
                  'http://127.0.0.1:19090/api/v1/targets?state=active'
              )"
              if jq -e '
                  any(
                    .data.activeTargets[]?;
                    .health == "up"
                    and (
                      .labels.namespace == "redpanda"
                      or .discoveredLabels.__meta_kubernetes_namespace == "redpanda"
                    )
                    and (
                      (.labels.job // "" | test("redpanda"))
                      or .discoveredLabels.__meta_kubernetes_service_name == "redpanda"
                    )
                  )
                ' <<<"$active_targets" >/dev/null; then
                redpanda_target_ready=true
                break
              fi
              sleep 2
            done
            if [[ "$redpanda_target_ready" != "true" ]]; then
              jq '{
                  activeRedpandaTargets: [
                    .data.activeTargets[]?
                    | select(
                        .labels.namespace == "redpanda"
                        or .discoveredLabels.__meta_kubernetes_namespace == "redpanda"
                      )
                    | {labels, health, lastError, scrapeUrl}
                  ]
                }' <<<"$active_targets" >&2
              exit 1
            fi
            redpanda_metric_count="$(
              curl --fail --silent --show-error \
                http://127.0.0.1:19090/api/v1/label/__name__/values \
                | jq '[.data[] | select(startswith("redpanda_"))] | length'
            )"
            if [[ "$redpanda_metric_count" -lt 1 ]]; then
              echo "Prometheus target is up but exposes no redpanda_* series." >&2
              exit 1
            fi
            echo "Redpanda Prometheus target is up with $redpanda_metric_count metric names."
            kill "$prometheus_port_forward_pid" 2>/dev/null || true
            wait "$prometheus_port_forward_pid" 2>/dev/null || true
            prometheus_port_forward_pid=""
            echo "::endgroup::"
            finish_phase "Redpanda metrics verification"
          fi

          report_deploy_failure() {
            echo "::group::Kubernetes deployment diagnostics"
            kubectl -n stream2pretrain get \
              deployment,statefulset,pod,service,ingress,endpoints,endpointslice \
              -o wide || true
            kubectl -n stream2pretrain get \
              issuer,certificate,certificaterequest,order,challenge \
              -o wide || true
            kubectl -n stream2pretrain get events \
              --sort-by=.metadata.creationTimestamp | tail -n 160 || true

            for namespace in minio polaris traefik; do
              echo "::group::Dependency namespace: $namespace"
              kubectl -n "$namespace" get \
                deployment,statefulset,pod,service,endpoints,endpointslice,pvc \
                -o wide || true
              kubectl -n "$namespace" get events \
                --sort-by=.metadata.creationTimestamp | tail -n 80 || true
              echo "::endgroup::"
            done

            while read -r pod; do
              [[ -n "$pod" ]] || continue
              echo "::group::Pod description: $pod"
              kubectl -n stream2pretrain describe pod "$pod" || true
              echo "Recent container logs:"
              kubectl -n stream2pretrain logs "$pod" \
                --all-containers --prefix --tail=120 || true
              echo "Previous container logs:"
              kubectl -n stream2pretrain logs "$pod" \
                --all-containers --previous --prefix --tail=120 || true
              echo "::endgroup::"
            done < <(
              kubectl -n stream2pretrain get pods -o json \
                | jq -r '
                    .items[]
                    | select(
                        any(
                          .metadata.ownerReferences[]?;
                          .kind == "ReplicaSet" or .kind == "StatefulSet"
                        )
                      )
                    | select(
                        .status.phase == "Pending"
                        or .status.phase == "Failed"
                        or any(.status.containerStatuses[]?; (.ready // false) | not)
                      )
                    | .metadata.name
                  ' \
                || true
            )
            echo "::endgroup::"
          }

          echo "::group::Release capacity preflight"
          unschedulable_pods="$(
            kubectl -n stream2pretrain get pods -o json \
              | jq -r '
                  .items[]
                  | select(.status.phase == "Pending")
                  | select(any(
                      .status.conditions[]?;
                      .type == "PodScheduled"
                      and .status == "False"
                      and .reason == "Unschedulable"
                    ))
                  | .metadata.name
                '
          )"
          if [[ -n "$unschedulable_pods" ]]; then
            echo "Existing unschedulable Pods will be reconciled by this release:" >&2
            printf '%s\n' "$unschedulable_pods" >&2
            # Do not reject a repair release because the previous Pod template
            # is unschedulable. Node health and free-space checks below prevent
            # unsafe expansion; Helm's bounded wait verifies the replacement.
          fi

          worker_nodes="$(
            kubectl get nodes -o json \
              | jq -r '
                  .items[]
                  | select((.spec.unschedulable // false) | not)
                  | select(
                      (.metadata.labels | has("node-role.kubernetes.io/control-plane") | not)
                      and (.metadata.labels | has("node-role.kubernetes.io/master") | not)
                    )
                  | .metadata.name
                '
          )"
          if [[ -z "$worker_nodes" ]]; then
            worker_nodes="$(
              kubectl get nodes -o json \
                | jq -r '
                    .items[]
                    | select((.spec.unschedulable // false) | not)
                    | .metadata.name
                  '
            )"
          fi
          minimum_rootfs_available=$((6 * 1024 * 1024 * 1024))
          capacity_ok=true
          while read -r node; do
            [[ -n "$node" ]] || continue
            node_json="$(kubectl get "node/$node" -o json)"
            ready="$(
              jq -r '
                  first(.status.conditions[] | select(.type == "Ready") | .status)
                  // "Unknown"
                ' <<<"$node_json"
            )"
            pressure="$(
              jq -r '
                  [
                    .status.conditions[]
                    | select(
                        (.type == "DiskPressure"
                          or .type == "MemoryPressure"
                          or .type == "PIDPressure")
                        and .status == "True"
                      )
                    | .type
                  ]
                  | join(",")
                ' <<<"$node_json"
            )"
            summary="$(
              kubectl get --raw "/api/v1/nodes/${node}/proxy/stats/summary"
            )"
            available="$(jq -r '.node.fs.availableBytes // 0' <<<"$summary")"
            capacity="$(jq -r '.node.fs.capacityBytes // 0' <<<"$summary")"
            jq -n \
              --arg node "$node" \
              --arg ready "$ready" \
              --arg pressure "$pressure" \
              --argjson available "$available" \
              --argjson capacity "$capacity" \
              '{
                node: $node,
                ready: $ready,
                pressure: $pressure,
                rootfsAvailableBytes: $available,
                rootfsCapacityBytes: $capacity
              }'
            if [[ "$ready" != "True" \
               || -n "$pressure" \
               || "$available" -lt "$minimum_rootfs_available" ]]; then
              capacity_ok=false
            fi
          done <<<"$worker_nodes"
          if [[ "$capacity_ok" != true ]]; then
            echo "Release preflight requires every schedulable worker to be Ready," >&2
            echo "pressure-free, and have at least 6 GiB rootfs available." >&2
            echo "The threshold covers the observed 2.54 GB kubelet reserve plus" >&2
            echo "the 2.30 GB largest application image and a safety margin." >&2
            report_deploy_failure
            exit 1
          fi
          echo "::endgroup::"

          minio_ready_addresses="$(
            kubectl -n minio get endpointslice \
              -l kubernetes.io/service-name=minio -o json \
              | jq '[
                  .items[].endpoints[]?
                  | select(.conditions.ready != false)
                  | .addresses[]?
                ] | length'
          )"
          if [[ "$minio_ready_addresses" -eq 0 ]]; then
            echo "MinIO has no Ready service endpoints; refusing to roll application workloads." >&2
            report_deploy_failure
            exit 1
          fi
          finish_phase "Capacity preflight"

          # Artifact signing is an internal cluster identity, not an external
          # provider credential. Create it once when absent and reuse it on
          # every later release; malformed existing Secrets fail closed.
          bash scripts/ensure_foundry_signing_secret.sh \
            stream2pretrain stream2pretrain-foundry-signing
          finish_phase "Foundry signing identity"

          # Preserve any pre-native Bytewax progress in the broker group before
          # the native-consumer-to-Bytewax cutback. The durable marker makes
          # this a one-time handoff even when the workflow or Helm deployment
          # is retried. Marker identity must match the stable live flow and
          # recovery names or the release fails closed.
          if [[ ("$CORE_CHANGED" == "true" || "$SOURCES_CHANGED" == "true") \
             && "$frontier_reset_applied" != "true" \
             && "$github_removal_applied" != "true" ]]; then
          legacy_fetcher_checkpoint="$(
            kubectl -n stream2pretrain get deployment \
              stream2pretrain-processor-fetcher -o json 2>/dev/null \
              | jq -r '
                  any(
                    .spec.template.spec.containers[]?.volumeMounts[]?;
                    .name == "checkpoint"
                  )
                ' \
              || true
          )"
          existing_fetcher_flow="$(
            kubectl -n stream2pretrain get deployment \
              stream2pretrain-processor-fetcher -o json 2>/dev/null \
              | jq -r '
                  first(
                    .spec.template.spec.containers[]?
                    | select(.name == "fetcher")
                    | .env[]?
                    | select(.name == "S2P_BYTEWAX_FLOW_NAME")
                    | .value
                  ) // empty
                ' \
              || true
          )"
          if [[ "$existing_fetcher_flow" == "s2p-fetcher-live-v5" ]]; then
            echo "Fetcher already declares the stable live Bytewax identity."
          elif [[ "$legacy_fetcher_checkpoint" == "true" ]]; then
            fetcher_pod="$(
              kubectl -n stream2pretrain get pod \
                -l app.kubernetes.io/component=processor-fetcher \
                -o json \
                | jq -r '
                    first(
                      .items[]
                      | select(.status.phase == "Running")
                      | .metadata.name
                    ) // empty
                  '
            )"
            if [[ -z "$fetcher_pod" ]]; then
              echo "Legacy fetcher checkpoint exists but no running Pod can read it." >&2
              exit 1
            fi
            fetcher_cutover_env=(
              S2P_STATE_DIR=/var/lib/s2p/checkpoint
              S2P_KAFKA_START_OFFSET=stored
              S2P_CUTOVER_COMPONENT=fetcher
              S2P_CUTOVER_TOPIC=raw.fetched
              S2P_CONSUMER_GROUP=s2p-fetcher
              S2P_BYTEWAX_FLOW_NAME=s2p-fetcher-live-v5
              S2P_BYTEWAX_RECOVERY_NAME=fetcher-live-v5
              S2P_BYTEWAX_RECOVERY_PARTITIONS=4
            )
            set +e
            kubectl -n stream2pretrain exec -i "$fetcher_pod" -- \
              env "${fetcher_cutover_env[@]}" S2P_CUTOVER_MARKER_MODE=check \
              python - < scripts/bytewax_cutover_marker.py
            fetcher_marker_status=$?
            set -e
            if [[ "$fetcher_marker_status" -eq 0 ]]; then
              echo "Fetcher cutover marker already exists; offset migration is complete."
            elif [[ "$fetcher_marker_status" -eq 3 ]]; then
              echo "Migrating legacy fetcher recovery offsets from $fetcher_pod"
              kubectl -n stream2pretrain exec -i "$fetcher_pod" -- \
                env \
                  S2P_STATE_DIR=/var/lib/s2p/checkpoint \
                  S2P_RAW_TOPIC=raw.fetched \
                  S2P_CONSUMER_GROUP=s2p-fetcher \
                  S2P_BYTEWAX_STEP_ID=s2p-fetcher.raw_fetched \
                python - < scripts/migrate_fetcher_offsets.py
              kubectl -n stream2pretrain exec -i "$fetcher_pod" -- \
                env "${fetcher_cutover_env[@]}" S2P_CUTOVER_MARKER_MODE=ensure \
                python - < scripts/bytewax_cutover_marker.py
            else
              echo "Fetcher cutover marker validation failed; refusing migration." >&2
              exit "$fetcher_marker_status"
            fi
            kubectl -n redpanda exec statefulset/redpanda -- \
              rpk group describe s2p-fetcher
          fi

          # Advance the broker bridge to any legacy curator recovery progress
          # before replacing the native consumer. Retaining the PVC preserves
          # the global dedup index and deterministic decision cache. The
          # explicitly marked live-frontier reset bypasses legacy offset import
          # so the new recovery identity starts at the selected broker frontier.
          if [[ "$curator_frontier_reset_active" == "true" ]]; then
            echo "Curator live-frontier reset is authoritative; skipping legacy offset import."
          else
          curator_exists="$(
            kubectl -n stream2pretrain get statefulset \
              stream2pretrain-processor-curate -o name 2>/dev/null || true
          )"
          existing_curator_flow="$(
            kubectl -n stream2pretrain get statefulset \
              stream2pretrain-processor-curate -o json 2>/dev/null \
              | jq -r '
                  first(
                    .spec.template.spec.containers[]?
                    | select(.name == "curate")
                    | .env[]?
                    | select(.name == "S2P_BYTEWAX_FLOW_NAME")
                    | .value
                  ) // empty
                ' \
              || true
          )"
          curator_pod="$(
            kubectl -n stream2pretrain get pod \
              -l app.kubernetes.io/component=processor-curate \
              -o json 2>/dev/null \
              | jq -r '
                  first(
                    .items[]
                    | select(.status.phase == "Running")
                    | select(any(
                        .status.containerStatuses[]?;
                        .name == "curate" and .ready == true
                      ))
                    | .metadata.name
                  ) // empty
                ' \
              || true
          )"
          if [[ "$existing_curator_flow" != "s2p-curate-live-v5" \
             && -n "$curator_exists" \
             && -z "$curator_pod" ]]; then
            curator_claim="checkpoint-stream2pretrain-processor-curate-0"
            if ! kubectl -n stream2pretrain get "pvc/$curator_claim" >/dev/null; then
              echo "Legacy curator exists but its retained recovery PVC is missing." >&2
              exit 1
            fi
            curator_migration_pod="s2p-curate-cutover-${GITHUB_RUN_ID}"
            kubectl -n stream2pretrain delete "pod/$curator_migration_pod" \
              --ignore-not-found --wait=true
            kubectl -n stream2pretrain get \
              statefulset/stream2pretrain-processor-curate -o json \
              | jq \
                --arg name "$curator_migration_pod" \
                --arg claim "$curator_claim" '
                  .spec.template as $template
                  | {
                      apiVersion: "v1",
                      kind: "Pod",
                      metadata: {
                        name: $name,
                        namespace: "stream2pretrain",
                        labels: (
                          $template.metadata.labels
                          + {"app.kubernetes.io/component": "processor-curate-cutover"}
                        )
                      },
                      spec: (
                        $template.spec
                        | .restartPolicy = "Never"
                        | del(.initContainers)
                        | .containers = [
                            .containers[]
                            | select(.name == "curate")
                            | .name = "migration"
                            | .command = ["sh", "-ec"]
                            | .args = [
                                "trap '\''exit 0'\'' TERM INT; while true; do sleep 30; done"
                              ]
                            | del(
                                .ports,
                                .startupProbe,
                                .livenessProbe,
                                .readinessProbe
                              )
                            | .resources = {
                                requests: {cpu: "10m", memory: "128Mi"},
                                limits: {cpu: "200m", memory: "256Mi"}
                              }
                          ]
                        | .volumes = (
                            [
                              (.volumes // [])[]
                              | select(.name != "checkpoint")
                            ]
                            + [{
                                name: "checkpoint",
                                persistentVolumeClaim: {claimName: $claim}
                              }]
                          )
                      )
                    }
                ' \
              | kubectl apply -f -
            if ! kubectl -n stream2pretrain wait \
              --for=condition=Ready "pod/$curator_migration_pod" --timeout=180s; then
              kubectl -n stream2pretrain describe "pod/$curator_migration_pod" || true
              kubectl -n stream2pretrain logs "pod/$curator_migration_pod" \
                --all-containers --prefix || true
              exit 1
            fi
            curator_pod="$curator_migration_pod"
            echo "Mounted the scaled-zero curator recovery PVC in $curator_migration_pod."
          fi
          if [[ "$existing_curator_flow" == "s2p-curate-live-v5" ]]; then
            echo "Curator already declares the stable live Bytewax identity."
          elif [[ -n "$curator_pod" ]]; then
            curator_cutover_env=(
              S2P_STATE_DIR=/var/lib/s2p/checkpoint
              S2P_KAFKA_START_OFFSET=stored
              S2P_CUTOVER_COMPONENT=curate
              S2P_CUTOVER_TOPIC=docs.normalized
              S2P_CONSUMER_GROUP=s2p-curate
              S2P_BYTEWAX_FLOW_NAME=s2p-curate-live-v5
              S2P_BYTEWAX_RECOVERY_NAME=curate-live-v5
              S2P_BYTEWAX_RECOVERY_PARTITIONS=4
            )
            set +e
            kubectl -n stream2pretrain exec -i "$curator_pod" -- \
              env "${curator_cutover_env[@]}" S2P_CUTOVER_MARKER_MODE=check \
              python - < scripts/bytewax_cutover_marker.py
            curator_marker_status=$?
            set -e
            if [[ "$curator_marker_status" -eq 0 ]]; then
              echo "Curator cutover marker already exists; offset migration is complete."
            elif [[ "$curator_marker_status" -eq 3 ]]; then
              echo "Migrating legacy curator recovery offsets from $curator_pod"
              kubectl -n stream2pretrain exec -i "$curator_pod" -- \
                env \
                  S2P_STATE_DIR=/var/lib/s2p/checkpoint \
                  S2P_RAW_TOPIC=docs.normalized \
                  S2P_CONSUMER_GROUP=s2p-curate \
                  S2P_BYTEWAX_STEP_ID=s2p-curate.docs_normalized \
                python - < scripts/migrate_fetcher_offsets.py
              kubectl -n stream2pretrain exec -i "$curator_pod" -- \
                env "${curator_cutover_env[@]}" S2P_CUTOVER_MARKER_MODE=ensure \
                python - < scripts/bytewax_cutover_marker.py
            else
              echo "Curator cutover marker validation failed; refusing migration." >&2
              exit "$curator_marker_status"
            fi
            kubectl -n redpanda exec statefulset/redpanda -- \
              rpk group describe s2p-curate
            if [[ -n "$curator_migration_pod" ]]; then
              kubectl -n stream2pretrain delete "pod/$curator_migration_pod" --wait=true
              curator_migration_pod=""
            fi
          elif [[ -z "$curator_exists" ]]; then
            echo "No legacy curator exists; the first Bytewax execution will use OFFSET_STORED."
          fi
          fi

          # Migrate the existing partition set before expanding it. Otherwise a
          # producer could write a new partition that has neither a legacy
          # recovery snapshot nor a broker commit, making the one-time bridge
          # ambiguous. New partitions added here safely bootstrap at earliest.
          # Four remains a bounded DHBW dev setting; prod is needs-measurement.
          S2P_CORE_TOPIC_PARTITIONS=4 bash scripts/reconcile_topic_partitions.sh
          else
            echo "Skipping Bytewax cutover and topic reconciliation: core and source contracts are unchanged."
          fi
          finish_phase "Bytewax and Redpanda reconciliation"

          : "${IMAGE_DIGEST_INGEST_RSS:?Missing pinned ingest-rss digest}"
          : "${IMAGE_DIGEST_INGEST_OAIPMH:?Missing pinned ingest-oaipmh digest}"
          : "${IMAGE_DIGEST_INGEST_HF:?Missing pinned HF digest}"
          : "${IMAGE_DIGEST_INGEST_ARXIV_HTML:?Missing pinned arXiv HTML digest}"
          : "${IMAGE_DIGEST_PROCESSOR:?Missing pinned processor digest}"
          : "${IMAGE_DIGEST_PROCESSOR_FOUNDRY:?Missing pinned Foundry digest}"
          : "${IMAGE_DIGEST_PROCESSOR_QUALITY:?Missing pinned quality digest}"
          : "${IMAGE_DIGEST_PROCESSOR_KENLM:?Missing pinned KenLM digest}"
          : "${IMAGE_DIGEST_PROCESSOR_FETCHER:?Missing pinned fetcher digest}"
          : "${IMAGE_DIGEST_UI:?Missing pinned UI digest}"

          helm_overrides=(
            --set "image.registry=${registry}"
            --set "image.tag=${GITHUB_SHA}"
            --set "image.pullPolicy=IfNotPresent"
            --set "ingest.rss.image=stream2pretrain/ingest-rss@${IMAGE_DIGEST_INGEST_RSS}"
            --set "ingest.oaipmh.image=stream2pretrain/ingest-oaipmh@${IMAGE_DIGEST_INGEST_OAIPMH}"
            --set "ingest.hf.image=stream2pretrain/ingest-hf@${IMAGE_DIGEST_INGEST_HF}"
            --set "ingest.arxivHtmlFetcher.image=stream2pretrain/ingest-arxiv-html@${IMAGE_DIGEST_INGEST_ARXIV_HTML}"
            --set "processor.fetcher.image=stream2pretrain/processor-fetcher-model@${IMAGE_DIGEST_PROCESSOR_FETCHER}"
            --set "processor.curate.image=stream2pretrain/processor@${IMAGE_DIGEST_PROCESSOR}"
            --set "processor.modelService.profiles.finepdfs.image=stream2pretrain/processor-quality-model@${IMAGE_DIGEST_PROCESSOR_QUALITY}"
            --set "processor.modelService.profiles.fineweb.image=stream2pretrain/processor-quality-model@${IMAGE_DIGEST_PROCESSOR_QUALITY}"
            --set "processor.modelService.profiles.kenlm.image=stream2pretrain/processor-kenlm-model@${IMAGE_DIGEST_PROCESSOR_KENLM}"
            --set "processor.iceberg.image=stream2pretrain/processor@${IMAGE_DIGEST_PROCESSOR}"
            --set "processor.duckdbApi.image=stream2pretrain/processor@${IMAGE_DIGEST_PROCESSOR}"
            --set "processor.foundry.image=stream2pretrain/processor-foundry@${IMAGE_DIGEST_PROCESSOR_FOUNDRY}"
            --set "mixtureController.image=stream2pretrain/processor@${IMAGE_DIGEST_PROCESSOR}"
            --set "ui.image=stream2pretrain/ui@${IMAGE_DIGEST_UI}"
          )

          if [[ -n "${GHCR_PULL_TOKEN:-}" ]]; then
            : "${GHCR_PULL_USERNAME:?GHCR_PULL_USERNAME is required with GHCR_PULL_TOKEN}"
            auth="$(printf '%s:%s' "$GHCR_PULL_USERNAME" "$GHCR_PULL_TOKEN" | base64 --wrap=0)"
            jq -n --arg auth "$auth" \
              '{auths: {"ghcr.io": {auth: $auth}}}' \
              > "$RUNNER_TEMP/dockerconfig.json"
            kubectl -n stream2pretrain create secret generic stream2pretrain-ghcr \
              --type kubernetes.io/dockerconfigjson \
              --from-file=.dockerconfigjson="$RUNNER_TEMP/dockerconfig.json" \
              --dry-run=client -o yaml | kubectl apply -f -
            helm_overrides+=(--set "image.pullSecrets[0]=stream2pretrain-ghcr")
          else
            echo "GHCR_PULL_TOKEN is empty. The published images must be public."
          fi

          # Only quiesce a multi-GiB model service when its immutable image
          # digest actually changes. Unchanged services keep their Pods, model
          # memory, HPA state, and readiness throughout the release.
          model_image_changed=false
          for profile in finepdfs fineweb kenlm; do
            model="stream2pretrain-processor-model-service-${profile}"
            case "$profile" in
              finepdfs|fineweb) digest="$IMAGE_DIGEST_PROCESSOR_QUALITY" ;;
              kenlm) digest="$IMAGE_DIGEST_PROCESSOR_KENLM" ;;
            esac
            case "$profile" in
              finepdfs|fineweb) repository="processor-quality-model" ;;
              *) repository="processor-${profile}-model" ;;
            esac
            target_image="${registry}/stream2pretrain/${repository}@${digest}"
            current_image="$(
              kubectl -n stream2pretrain get "deployment/$model" -o json 2>/dev/null \
                | jq -r '
                    first(
                      .spec.template.spec.containers[]?
                      | select(.name == "model-service")
                      | .image
                    ) // empty
                  ' \
                || true
            )"
            if [[ "$current_image" == "$target_image" ]]; then
              echo "Keeping loaded ${profile} model Pod: image digest is unchanged."
              continue
            fi
            echo "Quiescing ${profile} model service for an actual image change."
            model_image_changed=true
            kubectl -n stream2pretrain delete "scaledobject/$model" \
              --ignore-not-found --wait=true
            kubectl -n stream2pretrain delete \
              "horizontalpodautoscaler/$model" \
              "horizontalpodautoscaler/keda-hpa-$model" \
              --ignore-not-found --wait=true
            if kubectl -n stream2pretrain get "deployment/$model" >/dev/null 2>&1; then
              kubectl -n stream2pretrain scale "deployment/$model" --replicas=1
            fi
          done
          kubectl -n stream2pretrain delete pod \
            --field-selector=status.phase=Failed \
            --ignore-not-found --wait=true

          # A single-replica StatefulSet cannot replace a crash-looping Pod
          # during a wait-based Helm upgrade: the unhealthy old Pod keeps the
          # rollout blocked until Helm times out. If Foundry is already down,
          # remove only its Pod before the upgrade. Scaling the controller to
          # zero preserves its PVC; Helm immediately restores the declared
          # replica count using the new image and configuration.
          foundry_ready="$(
            kubectl -n stream2pretrain get pod stream2pretrain-foundry-0 \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' \
              2>/dev/null || true
          )"
          foundry_target_image="${registry}/stream2pretrain/processor-foundry@${IMAGE_DIGEST_PROCESSOR_FOUNDRY}"
          foundry_current_image="$(
            kubectl -n stream2pretrain get statefulset stream2pretrain-foundry -o json \
              2>/dev/null \
              | jq -r '
                  first(
                    .spec.template.spec.containers[]?
                    | select(.name == "worker")
                    | .image
                  ) // empty
                ' \
              || true
          )"
          if kubectl -n stream2pretrain get statefulset stream2pretrain-foundry \
               >/dev/null 2>&1 \
             && [[ "$foundry_ready" != "True" ]] \
             && [[ "$foundry_current_image" != "$foundry_target_image" ]]; then
            echo "Replacing unhealthy Foundry Pod while preserving its PVC."
            kubectl -n stream2pretrain scale \
              statefulset/stream2pretrain-foundry --replicas=0
            kubectl -n stream2pretrain wait --for=delete \
              pod/stream2pretrain-foundry-0 --timeout=180s \
              || ! kubectl -n stream2pretrain get pod stream2pretrain-foundry-0 \
                >/dev/null 2>&1
          elif [[ "$foundry_ready" != "True" ]]; then
            echo "Leaving the unchanged Foundry Pod untouched; it cannot delay this release."
          fi

          # GitHub serialises this workflow, but a teammate can still start a
          # manual Helm upgrade against the same release. Helm may complete
          # that competing revision and return `release: already exists` to
          # this invocation. Retry only this explicit storage/operation race;
          # every application, hook, readiness, and timeout failure remains
          # fail-closed on the first attempt.
          release_applied=false
          helm_apply_log="$RUNNER_TEMP/stream2pretrain-helm-apply.log"
          workloads_before="$RUNNER_TEMP/stream2pretrain-workloads-before.json"
          kubectl -n stream2pretrain get deployment,statefulset -o json \
            > "$workloads_before"
          helm_timeout=120
          if [[ "$model_image_changed" == "true" ]]; then
            helm_timeout=600
          fi
          for attempt in 1 2 3; do
            set +e
            helmfile \
              --helm-binary "$(command -v helm)" \
              --file helmfile.yaml \
              --environment dev \
              --selector name=stream2pretrain \
              sync \
              --reset-values \
              --wait=false \
              --wait-for-jobs=false \
              --timeout "$helm_timeout" \
              --description "github-actions ${GITHUB_SHA}" \
              --suppress-secrets \
              "${helm_overrides[@]}" \
              2>&1 | tee "$helm_apply_log"
            helm_apply_status=${PIPESTATUS[0]}
            set -e
            if [[ "$helm_apply_status" -eq 0 ]]; then
              release_applied=true
              break
            fi
            if ! grep -Eq \
              'release: already exists|another operation .* is in progress' \
              "$helm_apply_log"; then
              break
            fi
            echo "Concurrent Helm release mutation detected (attempt $attempt)."
            helm history stream2pretrain -n stream2pretrain || true
            helm status stream2pretrain -n stream2pretrain --show-desc || true
            sleep 15
          done
          if [[ "$release_applied" != true ]]; then
            report_deploy_failure
            exit 1
          fi
          finish_phase "Helm sync"

          kubectl -n stream2pretrain annotate scaledobject --all \
            autoscaling.keda.sh/paused- || true

          # Wait only for resources whose generation this release changed.
          # Helm's global --wait blocks on every historical workload in the
          # release, including an unrelated unhealthy component. The parallel
          # waits preserve fail-closed readiness without serial timeout cost.
          mapfile -t changed_workloads < <(
            kubectl -n stream2pretrain get deployment,statefulset -o json \
              | jq -r --slurpfile before "$workloads_before" '
                  .items[]
                  | . as $current
                  | (
                      first(
                        $before[0].items[]
                        | select(
                            .kind == $current.kind
                            and .metadata.name == $current.metadata.name
                          )
                      ) // null
                    ) as $previous
                  | select(
                      $previous == null
                      or .metadata.generation > $previous.metadata.generation
                    )
                  | (.kind | ascii_downcase) + "/" + .metadata.name
                '
          )
          rollout_pids=()
          rollout_logs=()
          rollout_workloads=()
          for workload in "${changed_workloads[@]}"; do
            [[ -n "$workload" ]] || continue
            workload_timeout=60
            if [[ "$workload" == deployment/stream2pretrain-processor-fetcher* ]]; then
              # The fetcher image includes the full CPU scientific extraction
              # stack and is about 1.7 GB. A cold node pull was measured at 48s,
              # leaving no time for process startup under the old 60s bound.
              workload_timeout=180
            elif [[ "$workload" == deployment/stream2pretrain-processor-model-service-* ]]; then
              workload_timeout=600
            elif [[ "$workload" == statefulset/* ]]; then
              # Stateful workers flush durable state before exiting. Foundry's
              # declared termination grace alone is 120 seconds, so the old
              # 60-second generic deadline could fail a healthy replacement.
              workload_timeout=300
            fi
            log="$RUNNER_TEMP/rollout-${workload//\//-}.log"
            (
              kubectl -n stream2pretrain rollout status \
                "$workload" --timeout="${workload_timeout}s"
            ) >"$log" 2>&1 &
            rollout_pids+=("$!")
            rollout_logs+=("$log")
            rollout_workloads+=("$workload")
          done
          rollout_failed=false
          for index in "${!rollout_pids[@]}"; do
            if ! wait "${rollout_pids[$index]}"; then
              rollout_failed=true
              echo "::error title=Rollout failed::${rollout_workloads[$index]} did not become ready before its deployment timeout"
            fi
            cat "${rollout_logs[$index]}"
          done
          if [[ "$rollout_failed" == "true" ]]; then
            report_deploy_failure
            exit 1
          fi
          finish_phase "Changed workload readiness"

          if [[ "$MODEL_RUNTIME_CHANGED" == "true" ]]; then
            for profile_and_family in \
              "finepdfs finepdfs-edu-v2" \
              "fineweb fineweb-edu"; do
              read -r profile family <<< "$profile_and_family"
              model="stream2pretrain-processor-model-service-${profile}"
              expected_backends="$(
                kubectl -n stream2pretrain get "deployment/$model" \
                  -o jsonpath='{.status.readyReplicas}'
              )"
              if [[ -z "$expected_backends" || "$expected_backends" -lt 2 ]]; then
                echo "$model did not expose both baseline classifier replicas." >&2
                exit 1
              fi
              kubectl -n stream2pretrain exec -i \
                statefulset/stream2pretrain-processor-curate -c curate -- \
                python - \
                  --base-url "http://${model}:8094" \
                  --model-family "$family" \
                  --expected-backends "$expected_backends" \
                  < scripts/benchmark_model_service.py
            done
          else
            echo "Skipping model distribution benchmark: classifier runtime is unchanged."
          fi
          finish_phase "Classifier distribution gate"

          if [[ "$DNS_INFRA_CHANGED" == "true" ]]; then
            kubectl -n stream2pretrain exec -i \
              deployment/stream2pretrain-duckdb -- \
              python - < scripts/validate_storage_dns.py
          else
            echo "Skipping repeated DNS/MinIO probe: CoreDNS infrastructure is unchanged."
          fi
          finish_phase "DNS and MinIO rollout gate"

          # The running stable live workloads must persist a marker whose identity is
          # derived from their effective environment. This closes the clean
          # install path (where there was no legacy PVC to mark) and rejects a
          # chart/workflow drift away from OFFSET_STORED or the stable names.
          if [[ "$CORE_CHANGED" == "true" ]]; then
          fetcher_ready_pod="$(
            kubectl -n stream2pretrain get pod \
              -l app.kubernetes.io/component=processor-fetcher -o json \
              | jq -r '
                  [
                    .items[]
                    | select(.metadata.deletionTimestamp == null)
                    | select(.status.phase == "Running")
                    | select(any(
                        .status.conditions[]?;
                        .type == "Ready" and .status == "True"
                      ))
                  ]
                  | sort_by(.metadata.creationTimestamp)
                  | last
                  | .metadata.name // empty
                '
          )"
          if [[ -z "$fetcher_ready_pod" ]]; then
            echo "No Ready production fetcher Pod is available for cutover marking." >&2
            report_deploy_failure
            exit 1
          fi
          kubectl -n stream2pretrain exec -i \
            "pod/$fetcher_ready_pod" -c fetcher -- \
            env \
              S2P_CUTOVER_COMPONENT=fetcher \
              S2P_CUTOVER_TOPIC=raw.fetched \
              S2P_CUTOVER_MARKER_MODE=ensure \
            python - < scripts/bytewax_cutover_marker.py
          kubectl -n stream2pretrain exec -i \
            statefulset/stream2pretrain-processor-curate -c curate -- \
            env \
              S2P_CUTOVER_COMPONENT=curate \
              S2P_CUTOVER_TOPIC=docs.normalized \
              S2P_CUTOVER_MARKER_MODE=ensure \
            python - < scripts/bytewax_cutover_marker.py
          else
            echo "Keeping existing Bytewax cutover markers: core runtime is unchanged."
          fi

          # SourceFeed CRs are durable runtime configuration. A one-time live
          # policy marker is written only after the exact current schedules
          # and obsolete workloads have been reconciled. A retry after any
          # earlier deployment failure therefore cannot skip this boundary.
          source_policy_marker=stream2pretrain-source-policy-20260825
          if [[ "$SOURCES_CHANGED" == "true" \
             || "$frontier_reset_applied" == "true" ]] \
             || ! kubectl -n stream2pretrain get \
                  "configmap/$source_policy_marker" >/dev/null 2>&1; then
            NAMESPACE=stream2pretrain bash scripts/load_seed_feeds.sh
            kubectl -n stream2pretrain delete \
              cronjob/stream2pretrain-ingest-hf-daily-papers \
              job/stream2pretrain-ingest-openreview-backfill \
              --ignore-not-found --wait=true
            kubectl -n stream2pretrain delete job \
              -l app.kubernetes.io/component=seed-loader \
              --ignore-not-found --wait=true
            for _ in $(seq 1 60); do
              source_schedules="$(
                kubectl -n stream2pretrain get cronjob \
                  -l stream2pretrain.io/source-feed \
                  -o name | wc -l
              )"
              [[ "$source_schedules" -eq 5 ]] && break
              sleep 2
            done
            if [[ "$source_schedules" -ne 5 ]]; then
              kubectl -n stream2pretrain get sourcefeeds.stream2pretrain.io -o wide || true
              kubectl -n stream2pretrain get cronjob -o wide || true
              echo "The controller did not materialize exactly five arXiv discovery schedules" >&2
              exit 1
            fi
            kubectl -n stream2pretrain create configmap "$source_policy_marker" \
              --from-literal=applied-at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --from-literal=git-sha="$GITHUB_SHA" \
              --from-literal=policy="live-sources-2026-08-25" \
              --dry-run=client -o yaml \
              | kubectl apply -f -
          else
            echo "Keeping existing SourceFeed schedules: source definitions are unchanged."
          fi
          finish_phase "SourceFeed reconciliation"

          if [[ "$CORE_CHANGED" == "true" ]]; then
          # Clone the exact deployed curator Pod spec into a short-lived,
          # isolated consumer group. This gives the release canary its own
          # bounded execution lane without permanently reserving another GiB
          # of memory or letting production replay lag hide a broken release.
          curator_canary_job="s2p-curate-smoke-${GITHUB_RUN_ID}"
          curator_canary_group="s2p-curate-smoke-${GITHUB_RUN_ID}"
          kubectl -n stream2pretrain get \
            statefulset/stream2pretrain-processor-curate -o json \
            | jq \
              --arg name "$curator_canary_job" \
              --arg group "$curator_canary_group" '
                .spec.template as $template
                | {
                    apiVersion: "batch/v1",
                    kind: "Job",
                    metadata: {
                      name: $name,
                      namespace: "stream2pretrain",
                      labels: (
                        $template.metadata.labels
                        + {"app.kubernetes.io/component": "processor-curate-canary"}
                      )
                    },
                    spec: {
                      backoffLimit: 0,
                      activeDeadlineSeconds: 600,
                      ttlSecondsAfterFinished: 300,
                      template: {
                        metadata: {
                          labels: (
                            $template.metadata.labels
                            + {"app.kubernetes.io/component": "processor-curate-canary"}
                          )
                        },
                        spec: (
                          $template.spec
                          | .restartPolicy = "Never"
                          | .containers = [
                              .containers[]
                              | select(.name == "curate")
                              | .name = "curate-canary"
                              | del(
                                  .startupProbe,
                                  .livenessProbe,
                                  .readinessProbe
                                )
                              | .env = (
                                  [
                                    .env[]
                                    | select(
                                        .name != "S2P_COMPONENT"
                                        and .name != "S2P_CONSUMER_GROUP"
                                        and .name != "S2P_CURATOR_INPUT_TOPIC"
                                        and .name != "S2P_CURATOR_DECISIONS_TOPIC"
                                        and .name != "S2P_CURATOR_CURATED_TOPIC"
                                        and .name != "S2P_CURATOR_RETRY_TOPIC"
                                        and .name != "S2P_KAFKA_START_OFFSET"
                                        and .name != "S2P_BYTEWAX_FLOW_NAME"
                                        and .name != "S2P_BYTEWAX_RECOVERY_NAME"
                                        and .name != "S2P_BYTEWAX_RECOVERY_PARTITIONS"
                                        and .name != "S2P_PROCESSING_FAILURE_BUCKET"
                                        and .name != "S2P_PROCESSING_FAILURE_PREFIX"
                                      )
                                  ]
                                  + [
                                      {name: "S2P_COMPONENT", value: "processor-curate-canary"},
                                      {name: "S2P_CONSUMER_GROUP", value: $group},
                                      {name: "S2P_CURATOR_INPUT_TOPIC", value: "docs.normalized.smoke"},
                                      {name: "S2P_CURATOR_DECISIONS_TOPIC", value: "curation.decisions.smoke"},
                                      {name: "S2P_CURATOR_CURATED_TOPIC", value: "docs.curated.smoke"},
                                      {name: "S2P_CURATOR_RETRY_TOPIC", value: "raw.smoke"},
                                      {name: "S2P_KAFKA_START_OFFSET", value: "beginning"},
                                      {name: "S2P_BYTEWAX_FLOW_NAME", value: "s2p-curate-smoke-v1"},
                                      {name: "S2P_BYTEWAX_RECOVERY_NAME", value: "curate-smoke-v1"},
                                      {name: "S2P_BYTEWAX_RECOVERY_PARTITIONS", value: "1"},
                                      {name: "S2P_PROCESSING_FAILURE_BUCKET", value: "$(S2P_STATE_BUCKET)"},
                                      {name: "S2P_PROCESSING_FAILURE_PREFIX", value: "canary-processing-failures/curate"}
                                    ]
                                )
                            ]
                          | .volumes = (
                              [
                                (.volumes // [])[]
                                | select(.name != "checkpoint")
                              ]
                              + [{
                                  name: "checkpoint",
                                  emptyDir: {sizeLimit: "2Gi"}
                                }]
                            )
                        )
                      }
                    }
                  }
              ' \
            | kubectl apply -f -

          # The record-level timeout must measure curation, not a cold canary
          # Pod waiting for model services and initialising Presidio. The live
          # curator took longer than that startup allowance after the measured
          # memory resize even though it resumed and routed records correctly.
          if ! kubectl -n stream2pretrain wait \
            --for=condition=Ready \
            "pod" \
            -l "job-name=$curator_canary_job" \
            --timeout=300s; then
            kubectl -n stream2pretrain describe "job/$curator_canary_job" || true
            kubectl -n stream2pretrain logs "job/$curator_canary_job" \
              --all-containers --prefix || true
            exit 1
          fi
          if ! kubectl -n stream2pretrain exec -i \
            deployment/stream2pretrain-duckdb -- \
            python - < scripts/cluster_smoke.py; then
            kubectl -n stream2pretrain describe "job/$curator_canary_job" || true
            kubectl -n stream2pretrain logs "job/$curator_canary_job" \
              --all-containers --prefix || true
            exit 1
          fi
          kubectl -n stream2pretrain logs "job/$curator_canary_job" \
            --all-containers --prefix || true
          kubectl -n stream2pretrain delete "job/$curator_canary_job" \
            --wait=true
          curator_canary_job=""
          else
            echo "Skipping the core curator canary: core pipeline inputs are unchanged."
          fi
          finish_phase "Core canary"
          deploy_finished_at="$(date +%s)"
          echo "::notice title=Deployment total::$((deploy_finished_at - deploy_started_at))s"

      - name: Upload rendered UI audit
        if: ${{ always() && inputs.mode == 'audit-ui' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: stream2pretrain-ui-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/ui-audit
          if-no-files-found: error
